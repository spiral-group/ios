name: ShareExtension

schemes:
  ShareExtension:
    analyze:
      config: Debug
    archive:
      config: Release
    build:
      targets:
        ShareExtension:
        - running
        - testing
        - profiling
        - analyzing
        - archiving
    profile:
      config: Release
    run:
      askForAppToLaunch: true
      config: Debug
      debugEnabled: false
      disableMainThreadChecker: false
      launchAutomaticallySubstyle: 2
    test:
      config: Debug
      disableMainThreadChecker: false

targets:
  ShareExtension:
    type: app-extension
    platform: iOS

    dependencies:
      - package: MatrixRustSDK
      - package: Compound
      - package: Collections
      - package: KeychainAccess
      - package: BuildExtensions
        product: Macros

    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: $(PRODUCT_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        appGroupIdentifier: $(APP_GROUP_IDENTIFIER)
        baseBundleIdentifier: $(BASE_BUNDLE_IDENTIFIER)
        keychainAccessGroupIdentifier: $(KEYCHAIN_ACCESS_GROUP_IDENTIFIER)
        productionAppName: $(PRODUCTION_APP_NAME)
        isNightlyBuild: $(IS_NIGHTLY_BUILD)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareExtensionViewController
          NSExtensionAttributes:
            IntentsSupported: [INSendMessageIntent]
            NSExtensionActivationRule:
              NSExtensionActivationSupportsFileWithMaxCount: 60
              NSExtensionActivationSupportsImageWithMaxCount: 60
              NSExtensionActivationSupportsMovieWithMaxCount: 60
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 10

    entitlements:
      path: ShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
        - $(APP_GROUP_IDENTIFIER)
        keychain-access-groups:
        - $(KEYCHAIN_ACCESS_GROUP_IDENTIFIER)

    settings:
      base:
        PRODUCT_NAME: ShareExtension
        PRODUCT_DISPLAY_NAME: $(APP_DISPLAY_NAME)
        PRODUCT_BUNDLE_IDENTIFIER: ${BASE_BUNDLE_IDENTIFIER}.shareextension
        MARKETING_VERSION: $(MARKETING_VERSION)
        CURRENT_PROJECT_VERSION: $(CURRENT_PROJECT_VERSION)
        DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
        SWIFT_VERSION: 6
        SWIFT_APPROACHABLE_CONCURRENCY: YES
      configs:
        # AGENT-PLATFORM: Xcode compilation caching, Debug (the test
        # configuration) only; Release/archive builds stay uncached.
        Debug:
          COMPILATION_CACHE_ENABLE_CACHING: YES

    sources:
    - path: ../Sources
    - path: ../SupportingFiles
      # AGENT-PLATFORM (Brief 0083 L1b, decision 302): the XcodeGen manifest is
      # not a resource; shipped, it put upstream's target names in the bundle.
      excludes:
        - target.yml
    - path: ../../ElementX/Sources/ShareExtension
    - path: ../../ElementX/Sources/AppHooks/AppHooks.swift
    - path: ../../ElementX/Sources/AppHooks/Hooks/TracingHook.swift
    - path: ../../ElementX/Sources/AppHooks/Hooks/ClientFactoryHook.swift
    # AGENT-PLATFORM (Brief 0083 L1b): no RemoteSettingsHook.swift (Element Pro's check).
    - path: ../../ElementX/Sources/AppHooks/Hooks/UserSessionHook.swift
    - path: ../../Components/Secrets/Secrets.swift
    - path: ../../ElementX/Sources/Application/Settings
    # AGENT-PLATFORM (Brief 0073): `AppSettings.pendingInvite` is typed
    # with these; `SpiralInviteLink` needs the `SpiralLink.serverName`
    # constant. The extension never uses them but compiles AppSettings.
    - path: ../../ElementX/Sources/Services/AgentPlatform/SpiralLink.swift
    - path: ../../ElementX/Sources/Services/AgentPlatform/SpiralInviteLink.swift
    - path: ../../ElementX/Sources/Services/AgentPlatform/PendingInvite.swift
    - path: ../../ElementX/Sources/Application/TargetConfiguration.swift
    - path: ../../ElementX/Sources/Generated/Strings.swift
    # AGENT-PLATFORM (App Review 5.2): NotificationTone's default label is Spiral's own string.
    - path: ../../ElementX/Sources/Generated/Strings+Untranslated.swift
    - path: ../../ElementX/Sources/Services/AlertTones/NotificationTone.swift
    - path: ../../ElementX/Sources/Services/Keychain/KeychainController.swift
    - path: ../../ElementX/Sources/Services/Keychain/KeychainControllerProtocol.swift
    - path: ../../ElementX/Sources/Services/UserSession/RestorationToken.swift
    - path: ../../ElementX/Sources/Services/UserSession/SessionDirectories.swift
    - path: ../../ElementX/Sources/Other/Extensions/Bundle.swift
    - path: ../../ElementX/Sources/Other/Extensions/Dictionary.swift
    - path: ../../ElementX/Sources/Other/Extensions/FileManager.swift
    - path: ../../ElementX/Sources/Other/Extensions/NSItemProvider.swift
    - path: ../../ElementX/Sources/Other/Extensions/ProcessInfo.swift
    - path: ../../ElementX/Sources/Other/Extensions/UIView.swift
    - path: ../../ElementX/Sources/Other/Extensions/URL.swift
    - path: ../../ElementX/Sources/Other/InfoPlistReader.swift
    - path: ../../ElementX/Sources/Other/CurrentValuePublisher.swift
    - path: ../../ElementX/Sources/Other/Logging
    - path: ../../ElementX/Sources/UITests/UITestsScreenIdentifier.swift
