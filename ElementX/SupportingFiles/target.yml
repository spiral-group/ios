name: ElementX

schemes:
  ElementX:
    analyze:
      config: Debug
    archive:
      config: Release
    build:
      targets:
        ElementX:
          - running
          - testing
          - profiling
          - analyzing
          - archiving
    profile:
      config: Release
    run:
      config: Debug
      environmentVariables:
        - variable: HTTPS_PROXY
          value: localhost:9090
          isEnabled: false
        - variable: UI_TESTS_SCREEN
          value: ""
          isEnabled: false
        - variable: RESET_APP_SETTINGS
          value: "true"
          isEnabled: false
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets:
        - ElementX
      testPlans:
        - path: ../../UnitTests/SupportingFiles/UnitTests.xctestplan
          defaultPlan: true

targets:
  ElementX:
    type: application
    platform: iOS
    # AGENT-PLATFORM: the product is `Spiral` (PRODUCT_NAME = $(APP_NAME)),
    # but XcodeGen does not evaluate build settings and would name the
    # scheme's buildable after the TARGET. Xcode then rewrote the generated
    # scheme on every run, so state it here instead.
    productName: Spiral

    info:
      path: Info.plist
      properties:
        UILaunchScreen:
          UIColorName: colors/background-color
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes: [
          {
            CFBundleTypeRole: Editor,
            CFBundleURLName: "Application",
            CFBundleURLSchemes: [
              $(BASE_BUNDLE_IDENTIFIER), # The app's own scheme for custom routes
              # AGENT-PLATFORM (Brief 0060): `spiral://` mirrors every
              # spiral.md smart-link shape. Required because iOS does
              # NOT fire universal links on same-domain taps in Safari
              # (Apple TN3155), so the link landing page's "Open in
              # Spiral" button has to use a custom scheme. The generic
              # "matrix" scheme was dropped along with matrix.to
              # generation (ADR-0072 D2).
              "spiral"
            ]
          }
        ]
        UIApplicationSceneManifest: {
          UIApplicationSupportsMultipleScenes: true
        }
        UISupportedInterfaceOrientations: [
          UIInterfaceOrientationPortrait,
          UIInterfaceOrientationPortraitUpsideDown,
          UIInterfaceOrientationLandscapeLeft,
          UIInterfaceOrientationLandscapeRight
        ]
        appGroupIdentifier: $(APP_GROUP_IDENTIFIER)
        baseBundleIdentifier: $(BASE_BUNDLE_IDENTIFIER)
        keychainAccessGroupIdentifier: $(KEYCHAIN_ACCESS_GROUP_IDENTIFIER)
        # AGENT-PLATFORM: classic{App,Keychain}* Info.plist keys removed
        # to disable Element Classic (im.vector) account import — see app.yml.
        productionAppName: $(PRODUCTION_APP_NAME)
        isNightlyBuild: $(IS_NIGHTLY_BUILD)
        ITSAppUsesNonExemptEncryption: false
        NSUserActivityTypes: [
          INSendMessageIntent,
          INStartCallIntent,
          INStartAudioCallIntent,
          INStartVideoCallIntent,
        ]
        NSCameraUsageDescription: To make video calls, and to take pictures or videos and send them as a message, $(APP_DISPLAY_NAME) needs access to the camera.
        NSMicrophoneUsageDescription: To make calls, and to record and send messages with audio, $(APP_DISPLAY_NAME) needs to access the microphone.
        NSPhotoLibraryAddUsageDescription: This lets you save images and videos to your photo library.
        NSLocationWhenInUseUsageDescription: Grant location access so that $(APP_DISPLAY_NAME) can share your location.
        NSLocationAlwaysAndWhenInUseUsageDescription: To share your live location, $(APP_DISPLAY_NAME) needs location access when the app is in the background.
        NSFaceIDUsageDescription: Face ID is used to access your app.
        # AGENT-PLATFORM (Brief 0078): no `location` mode while location sharing
        # is off (no MapTiler key, no `m.tile_server`) — App Review 2.5.4. Add it
        # back with the feature; `LiveLocationManager` follows this list.
        # No `processing` either: the one background task is a BGAppRefreshTask
        # (`fetch`), and App Review reads an unused mode as a false declaration.
        UIBackgroundModes: [
          audio,
          fetch,
          voip
        ]
        BGTaskSchedulerPermittedIdentifiers: [
          $(BASE_BUNDLE_IDENTIFIER).background.refresh
        ]
        UTExportedTypeDeclarations:
        - UTTypeConformsTo: [public.text]
          UTTypeDescription: Mention Pills
          UTTypeIdentifier: $(PILLS_UT_TYPE_IDENTIFIER)
        CFBundleDocumentTypes:
        - CFBundleTypeName: Mention Pills
          CFBundleTypeRole: Viewer
          LSHandlerRank: Owner
          LSItemContentTypes: $(PILLS_UT_TYPE_IDENTIFIER)
        LSSupportsOpeningDocumentsInPlace: false

    entitlements:
      path: ElementX.entitlements
      properties:
        aps-environment: development
        # AGENT-PLATFORM (Brief 0060 / ADR-0072): associated-domains
        # scoped to our own domain ONLY. matrix.to was dropped — we no
        # longer generate matrix.to links, so claiming that domain would
        # only hijack third-party links we don't own. The matching AASA
        # (components format, /u /c /r /m) ships from
        # deploy/config/brand/.well-known/apple-app-site-association.
        com.apple.developer.associated-domains:
        - applinks:spiral.md
        # NB: an `applinks:spiral.md?mode=developer` entry existed during
        # Brief 0060 so development-signed builds could bypass Apple's
        # AASA CDN cache. It was stripped for the first TestFlight build
        # (Apple rejects the `?mode=` query in submissions) and must not
        # come back on a release branch — see docs/project/DECISIONS.md.
        - webcredentials:spiral.md
        com.apple.developer.usernotifications.communication: true
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
        - $(APP_GROUP_IDENTIFIER)
        com.apple.security.network.client: true
        keychain-access-groups:
        - $(KEYCHAIN_ACCESS_GROUP_IDENTIFIER)

    settings:
      base:
        PRODUCT_NAME: $(APP_NAME)
        # AGENT-PLATFORM: the product renamed to Spiral, but the Swift
        # MODULE keeps the code-stable name — every test file does
        # `@testable import ElementX` and Sourcery/SwiftGen emit against it.
        PRODUCT_MODULE_NAME: ElementX
        PRODUCT_BUNDLE_IDENTIFIER: $(BASE_BUNDLE_IDENTIFIER)
        MARKETING_VERSION: $(MARKETING_VERSION)
        CURRENT_PROJECT_VERSION: $(CURRENT_PROJECT_VERSION)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
        SWIFT_OBJC_BRIDGING_HEADER: ElementX/SupportingFiles/ElementX-Bridging-Header.h
        SWIFT_OBJC_INTERFACE_HEADER_NAME: GeneratedInterface-Swift.h
        PILLS_UT_TYPE_IDENTIFIER: $(BASE_BUNDLE_IDENTIFIER).pills
        DEVELOPMENT_ASSET_PATHS: DevelopmentAssets/Media
        SWIFT_VERSION: 6.2
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        OTHER_SWIFT_FLAGS:
        - "-DIS_MAIN_APP"
      configs:
        # AGENT-PLATFORM: Xcode compilation caching, Debug (the test
        # configuration) only; Release/archive builds stay uncached.
        Debug:
          COMPILATION_CACHE_ENABLE_CACHING: YES

    preBuildScripts:
    - name: 🛠 SwiftGen
      runOnlyWhenInstalling: false
      basedOnDependencyAnalysis: false
      shell: /bin/sh
      script: |
        export PATH="$PATH:/opt/homebrew/bin"
        if which swiftgen >/dev/null; then
            swiftgen config run --config Tools/SwiftGen/swiftgen-config.yml
        else
            echo "warning: SwiftGen not installed, download from https://github.com/SwiftGen/SwiftGen"
        fi
    - name: 🧙 Sourcery - Generate mocks
      runOnlyWhenInstalling: false
      basedOnDependencyAnalysis: false
      shell: /bin/sh
      script: |
        export PATH="$PATH:/opt/homebrew/bin"
        if which sourcery >/dev/null; then
            sourcery --config Tools/Sourcery/AutoMockableConfig.yml
        else
            echo "warning: Sourcery not installed, run swift run tools setup-project"
        fi

    - name: 🧙 Sourcery - Generate preview tests
      runOnlyWhenInstalling: false
      basedOnDependencyAnalysis: false
      shell: /bin/sh
      script: |
        export PATH="$PATH:/opt/homebrew/bin"
        if which sourcery >/dev/null; then
            sourcery --config Tools/Sourcery/PreviewTestsConfig.yml
        else
            echo "warning: Sourcery not installed, run swift run tools setup-project"
        fi
        
    - name: 🧙 Sourcery - Generate Accessibility Tests
      runOnlyWhenInstalling: false
      basedOnDependencyAnalysis: false
      shell: /bin/sh
      script: |
        export PATH="$PATH:/opt/homebrew/bin"
        if which sourcery >/dev/null; then
            sourcery --config Tools/Sourcery/TestablePreviewsDictionary.yml
            sourcery --config Tools/Sourcery/AccessibilityTests.yml
        else
            echo "warning: Sourcery not installed, run swift run tools setup-project"
        fi

    postBuildScripts:
    - name: ⚠️ SwiftLint
      runOnlyWhenInstalling: false
      basedOnDependencyAnalysis: false
      shell: /bin/sh
      script: |
        export PATH="$PATH:/opt/homebrew/bin"
        if which swiftlint >/dev/null; then
            swiftlint
        else
            echo "warning: SwiftLint not installed, download from https://github.com/realm/SwiftLint"
        fi
    - name: 🧹 SwiftFormat
      runOnlyWhenInstalling: false
      basedOnDependencyAnalysis: false
      shell: /bin/sh
      script: |
        export PATH="$PATH:/opt/homebrew/bin"
        if which swiftformat >/dev/null; then
            swiftformat --lint --lenient "$PROJECT_DIR"
        else
            echo "warning: SwiftFormat not installed, download from https://github.com/nicklockwood/SwiftFormat"
        fi

    dependencies:
    - target: NSE
    - target: ShareExtension
    - target: MatrixRustSDKMocks
    - package: MatrixRustSDK
      embed: true
    - package: Compound
    # AGENT-PLATFORM: typed REST bindings for /api/v1/*. Drives the
    # Services/AgentPlatform/ layer (M2.3+).
    - package: AgentPlatformClient
    - package: BuildExtensions
      product: Macros
    - package: Algorithms
    - package: AsyncAlgorithms
    - package: AnalyticsEvents
    - package: Collections
    - package: DeviceKit
    # AGENT-PLATFORM (Brief 0063): native MatrixRTC media transport.
    - package: LiveKit
      product: LiveKit
    # AGENT-PLATFORM (Brief 0066): trusted shell + runtime for Interactive
    # Posts. Carries the built `dist` as a bundle resource; see the note on
    # the package in project.yml for why this does not reopen ADR-0079.
    - package: SpiralAppShell
      product: SpiralAppShell
    - package: KeychainAccess
    - package: Kingfisher
    - package: KZFileWatchers
    - package: LoremSwiftum
    - package: LRUCache
    - package: Mantis
    - package: MapLibre
    # AGENT-PLATFORM (Brief 0078): no PostHog and no Sentry — Spiral collects no
    # analytics or crash data, and their manifests would contradict the label.
    - package: SwiftState
    - package: GZIP
    - package: Version
    - package: Emojibase
    - package: WysiwygComposer
    - package: SwiftOGG
    - package: SwiftSoup
    - package: SwiftFlow
      product: Flow
    - package: DSWaveformImage
      product: DSWaveformImageViews

    sources:
    - path: ../Sources
      excludes:
        - Other/Extensions/XCTestCase.swift
        - Other/Extensions/XCUIElement.swift
    - path: ../../Secrets/Secrets.swift
    - path: ../Resources
    - path: ../SupportingFiles
    - path: ../../Tools/Scripts/Templates/SimpleScreenExample/ElementX
    - path: ../../DevelopmentAssets/Media
    
    # This is required for testing purposes... The problem with unit tests is that if you
    # try to `@testable import NSE` you can only get the definition of files, but due to a
    # limitation in how they work, they can only compile files that are part of the main test
    # target, so linking will fail. The solution is to just have the main app to reference the
    # extension code, and test it directly.
    - path: ../../NSE/Sources
