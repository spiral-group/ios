name: ElementX

schemes:
  ElementX:
    analyze:
      config: Debug
    archive:
      config: Release
    build:
      targets:
        ElementX:
          - running
          - testing
          - profiling
          - analyzing
          - archiving
    profile:
      config: Release
    run:
      config: Debug
      environmentVariables:
        - variable: HTTPS_PROXY
          value: localhost:9090
          isEnabled: false
        - variable: HTTP_PROXY
          value: localhost:9090
          isEnabled: false
        - variable: UI_TESTS_SCREEN
          value: ""
          isEnabled: false
        - variable: RESET_APP_SETTINGS
          value: "true"
          isEnabled: false
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets:
        - ElementX
      testPlans:
        - path: ../../UnitTests/SupportingFiles/UnitTests.xctestplan
          defaultPlan: true
  # AGENT-PLATFORM (Brief 0084): the build for a phone and TestFlight against
  # staging.spiral.md. Run and Archive both take the Staging configuration.
  Spiral Staging:
    analyze:
      config: Staging
    archive:
      config: Staging
    build:
      targets:
        ElementX:
          - running
          - profiling
          - analyzing
          - archiving
    profile:
      config: Staging
    run:
      config: Staging
    test:
      config: Staging

targets:
  ElementX:
    type: application
    platform: iOS
    # AGENT-PLATFORM: the product is `Spiral` (PRODUCT_NAME = $(APP_NAME)),
    # but XcodeGen does not evaluate build settings and would name the
    # scheme's buildable after the TARGET. Xcode then rewrote the generated
    # scheme on every run, so state it here instead.
    productName: Spiral

    info:
      path: Info.plist
      properties:
        UILaunchScreen:
          UIColorName: colors/background-color
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes: [
          {
            CFBundleTypeRole: Editor,
            CFBundleURLName: "Application",
            CFBundleURLSchemes: [
              $(BASE_BUNDLE_IDENTIFIER), # The app's own scheme for custom routes
              # AGENT-PLATFORM (Brief 0060): `spiral://` mirrors every
              # spiral.md smart-link shape. Required because iOS does
              # NOT fire universal links on same-domain taps in Safari
              # (Apple TN3155), so the link landing page's "Open in
              # Spiral" button has to use a custom scheme. The generic
              # "matrix" scheme was dropped along with matrix.to
              # generation (ADR-0072 D2).
              "spiral"
            ]
          }
        ]
        UIApplicationSceneManifest: {
          UIApplicationSupportsMultipleScenes: true
        }
        UISupportedInterfaceOrientations: [
          UIInterfaceOrientationPortrait,
          UIInterfaceOrientationPortraitUpsideDown,
          UIInterfaceOrientationLandscapeLeft,
          UIInterfaceOrientationLandscapeRight
        ]
        appGroupIdentifier: $(APP_GROUP_IDENTIFIER)
        # AGENT-PLATFORM (Brief 0086): the server ClipInviteHandOff.swift reads, as the App Clip does.
        spiralServerName: $(SPIRAL_ASSOCIATED_DOMAIN)
        baseBundleIdentifier: $(BASE_BUNDLE_IDENTIFIER)
        keychainAccessGroupIdentifier: $(KEYCHAIN_ACCESS_GROUP_IDENTIFIER)
        # AGENT-PLATFORM (Brief 0083 L1b): no classicApp* keys, Element Classic's import is gone.
        productionAppName: $(PRODUCTION_APP_NAME)
        isNightlyBuild: $(IS_NIGHTLY_BUILD)
        ITSAppUsesNonExemptEncryption: false
        NSUserActivityTypes: [
          INSendMessageIntent,
          INStartCallIntent,
          INStartAudioCallIntent,
          INStartVideoCallIntent,
        ]
        NSCameraUsageDescription: To make video calls, and to take pictures or videos and send them as a message, $(APP_DISPLAY_NAME) needs access to the camera.
        NSMicrophoneUsageDescription: To make calls, and to record and send messages with audio, $(APP_DISPLAY_NAME) needs to access the microphone.
        NSPhotoLibraryAddUsageDescription: This lets you save images and videos to your photo library.
        # AGENT-PLATFORM: App Review F1 (decision 252): no location purpose strings.
        # Spiral ships without location sharing and its binary references no
        # CoreLocation request API (`SpiralNoLocationManager`, no MapLibre).
        NSFaceIDUsageDescription: Face ID is used to access your app.
        # AGENT-PLATFORM (Brief 0078): no `location` mode — Spiral ships without
        # location sharing (App Review 2.5.4, F1). Add it back with the feature;
        # `LiveLocationManager` follows this list.
        # No `processing` either: the one background task is a BGAppRefreshTask
        # (`fetch`), and App Review reads an unused mode as a false declaration.
        UIBackgroundModes: [
          audio,
          fetch,
          voip
        ]
        BGTaskSchedulerPermittedIdentifiers: [
          $(BASE_BUNDLE_IDENTIFIER).background.refresh,
          $(BASE_BUNDLE_IDENTIFIER).background.search-backfill
        ]
        UTExportedTypeDeclarations:
        - UTTypeConformsTo: [public.text]
          UTTypeDescription: Mention Pills
          UTTypeIdentifier: $(PILLS_UT_TYPE_IDENTIFIER)
        CFBundleDocumentTypes:
        - CFBundleTypeName: Mention Pills
          CFBundleTypeRole: Viewer
          LSHandlerRank: Owner
          LSItemContentTypes: $(PILLS_UT_TYPE_IDENTIFIER)
        LSSupportsOpeningDocumentsInPlace: false

    entitlements:
      path: ElementX.entitlements
      properties:
        aps-environment: development
        # AGENT-PLATFORM (Brief 0060 / ADR-0072): associated-domains
        # scoped to our own domain ONLY. matrix.to was dropped — we no
        # longer generate matrix.to links, so claiming that domain would
        # only hijack third-party links we don't own. The matching AASA
        # (components format, /u /c /r /m) ships from
        # deploy/config/brand/.well-known/apple-app-site-association.
        com.apple.developer.associated-domains:
        # AGENT-PLATFORM (Brief 0084): spiral.md, or staging.spiral.md in a Staging build.
        - applinks:$(SPIRAL_ASSOCIATED_DOMAIN)
        # NB: an `applinks:spiral.md?mode=developer` entry existed during
        # Brief 0060 so development-signed builds could bypass Apple's
        # AASA CDN cache. It was stripped for the first TestFlight build
        # (Apple rejects the `?mode=` query in submissions) and must not
        # come back on a release branch — see docs/project/DECISIONS.md.
        - webcredentials:$(SPIRAL_ASSOCIATED_DOMAIN)
        # AGENT-PLATFORM (Brief 0086): the app names its App Clip (App Store Connect asks for it at upload).
        com.apple.developer.associated-appclip-app-identifiers:
        - $(AppIdentifierPrefix)$(BASE_BUNDLE_IDENTIFIER).Clip
        com.apple.developer.usernotifications.communication: true
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
        - $(APP_GROUP_IDENTIFIER)
        com.apple.security.network.client: true
        keychain-access-groups:
        - $(KEYCHAIN_ACCESS_GROUP_IDENTIFIER)

    settings:
      base:
        PRODUCT_NAME: $(APP_NAME)
        # AGENT-PLATFORM (Brief 0083 L1a, decision 302): the Swift module is
        # `Spiral`, so upstream's name is not in the binary's type metadata
        # (App Review 4.3(a)); tests `@testable import Spiral`. Pinned rather
        # than derived from $(APP_NAME). The target and folders keep
        # upstream's `ElementX` name to limit upstream merge conflicts.
        PRODUCT_MODULE_NAME: Spiral
        PRODUCT_BUNDLE_IDENTIFIER: $(BASE_BUNDLE_IDENTIFIER)
        MARKETING_VERSION: $(MARKETING_VERSION)
        CURRENT_PROJECT_VERSION: $(CURRENT_PROJECT_VERSION)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
        SWIFT_OBJC_BRIDGING_HEADER: ElementX/SupportingFiles/ElementX-Bridging-Header.h
        SWIFT_OBJC_INTERFACE_HEADER_NAME: GeneratedInterface-Swift.h
        PILLS_UT_TYPE_IDENTIFIER: $(BASE_BUNDLE_IDENTIFIER).pills
        DEVELOPMENT_ASSET_PATHS: Components/DevelopmentAssets/Media
        SWIFT_VERSION: 6
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        OTHER_SWIFT_FLAGS:
        - "-DIS_MAIN_APP"
      configs:
        # AGENT-PLATFORM: Xcode compilation caching, Debug (the test
        # configuration) only; Release/archive builds stay uncached.
        Debug:
          COMPILATION_CACHE_ENABLE_CACHING: YES

    preBuildScripts:
    - name: 🛠 SwiftGen
      runOnlyWhenInstalling: false
      basedOnDependencyAnalysis: false
      shell: /bin/sh
      script: |
        export PATH="$PATH:/opt/homebrew/bin"
        if which swiftgen >/dev/null; then
            swiftgen config run --config Tools/SwiftGen/swiftgen-config.yml
        else
            echo "warning: SwiftGen not installed, download from https://github.com/SwiftGen/SwiftGen"
        fi
    - name: 🧙 Sourcery - Generate mocks
      runOnlyWhenInstalling: false
      basedOnDependencyAnalysis: false
      shell: /bin/sh
      script: |
        export PATH="$PATH:/opt/homebrew/bin"
        if which sourcery >/dev/null; then
            sourcery --config Tools/Sourcery/AutoMockableConfig.yml
        else
            echo "warning: Sourcery not installed, run swift run tools setup-project"
        fi

    - name: 🧙 Sourcery - Generate preview tests
      runOnlyWhenInstalling: false
      basedOnDependencyAnalysis: false
      shell: /bin/sh
      script: |
        export PATH="$PATH:/opt/homebrew/bin"
        if which sourcery >/dev/null; then
            sourcery --config Tools/Sourcery/PreviewTestsConfig.yml
        else
            echo "warning: Sourcery not installed, run swift run tools setup-project"
        fi
        
    - name: 🧙 Sourcery - Generate Accessibility Tests
      runOnlyWhenInstalling: false
      basedOnDependencyAnalysis: false
      shell: /bin/sh
      script: |
        export PATH="$PATH:/opt/homebrew/bin"
        if which sourcery >/dev/null; then
            sourcery --config Tools/Sourcery/TestablePreviewsDictionary.yml
            sourcery --config Tools/Sourcery/AccessibilityTests.yml
        else
            echo "warning: Sourcery not installed, run swift run tools setup-project"
        fi

    postBuildScripts:
    - name: ⚠️ SwiftLint
      runOnlyWhenInstalling: false
      basedOnDependencyAnalysis: false
      shell: /bin/sh
      script: |
        export PATH="$PATH:/opt/homebrew/bin"
        if which swiftlint >/dev/null; then
            swiftlint
        else
            echo "warning: SwiftLint not installed, download from https://github.com/realm/SwiftLint"
        fi
    - name: 🧹 SwiftFormat
      runOnlyWhenInstalling: false
      basedOnDependencyAnalysis: false
      shell: /bin/sh
      script: |
        export PATH="$PATH:/opt/homebrew/bin"
        if which swiftformat >/dev/null; then
            swiftformat --lint --lenient "$PROJECT_DIR"
        else
            echo "warning: SwiftFormat not installed, download from https://github.com/nicklockwood/SwiftFormat"
        fi
    # AGENT-PLATFORM (Brief 0083 L1b, decision 302): Element's strings leave the
    # shipped bundle without an edit to upstream's Localizable.strings.
    - name: 🧽 Element strings
      runOnlyWhenInstalling: false
      basedOnDependencyAnalysis: false
      shell: /bin/sh
      script: |
        if [ "$CONFIGURATION" = "Release" ] || [ "$CONFIGURATION" = "Staging" ]; then # AGENT-PLATFORM (Brief 0084)
            python3 "$SRCROOT/Tools/Scripts/strip-element-strings.py" strip "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH" "$SRCROOT/ElementX/Resources/Localizations"
        else
            python3 "$SRCROOT/Tools/Scripts/strip-element-strings.py" check "$SRCROOT/ElementX/Resources/Localizations" --warn
        fi

    # AGENT-PLATFORM (Brief 0084): the same app record as prod, so a Staging archive must not reach App Review.
    - name: 🚧 Staging note
      runOnlyWhenInstalling: false
      basedOnDependencyAnalysis: false
      shell: /bin/sh
      script: |
        if [ "$CONFIGURATION" = "Staging" ]; then
            echo "warning: Staging build $MARKETING_VERSION talks to staging.spiral.md: internal TestFlight only, never App Review."
        fi

    dependencies:
    - target: NSE
    - target: ShareExtension
    - target: MatrixRustSDKMocks
    - package: MatrixRustSDK
      embed: true
    - package: Compound
    # AGENT-PLATFORM: typed REST bindings for /api/v1/*. Drives the
    # Services/AgentPlatform/ layer (M2.3+).
    - package: AgentPlatformClient
    - package: BuildExtensions
      product: Macros
    - package: Algorithms
    - package: AsyncAlgorithms
    - package: AnalyticsEvents
    - package: Collections
    - package: DeviceKit
    # AGENT-PLATFORM (Brief 0063): native MatrixRTC media transport.
    - package: LiveKit
      product: LiveKit
    # AGENT-PLATFORM (Brief 0066): trusted shell + runtime for Interactive
    # Posts. Carries the built `dist` as a bundle resource; see the note on
    # the package in project.yml for why this does not reopen ADR-0079.
    - package: SpiralAppShell
      product: SpiralAppShell
    - package: KeychainAccess
    - package: Kingfisher
    - package: KZFileWatchers
    - package: LoremSwiftum
    - package: LRUCache
    - package: Mantis
    - target: MapLibreInterface
      embed: true
    # AGENT-PLATFORM: App Review F1 (decision 252): neither MapLibreShim nor
    # MapLibre.framework is embedded. MapLibre asks for location access, and
    # Spiral declares no purpose string; `MapLibreLoader` finds no shim and the
    # (unreachable) map screens show their loading failure.
    # AGENT-PLATFORM (Brief 0067): no `ElementCall` package (upstream's own
    # native calls); calls are Spiral's native MatrixRTC (ADR-0079).
    # AGENT-PLATFORM (Brief 0078): no PostHog and no Sentry — Spiral collects no
    # analytics or crash data, and their manifests would contradict the label.
    - package: SwiftState
    - package: GZIP
    - package: Version
    - package: Emojibase
    - package: WysiwygComposer
    - package: SwiftOGG
    - package: SwiftSoup
    - package: SwiftFlow
      product: Flow
    - package: DSWaveformImage
      product: DSWaveformImageViews
    # AGENT-PLATFORM (Brief 0083 phase 3): Spiral's own tokens (Color.spiral, SpiralRadius),
    # last so that the generated project's other dependency IDs stay put.
    - package: SpiralUI
      product: SpiralTokens
    # AGENT-PLATFORM (Brief 0083 phase 3): Spiral's shared components, after the tokens for the same reason.
    - package: SpiralComponents
    # AGENT-PLATFORM (Brief 0086): the App Clip for invite links, in "Embed App Clips"; last for the same reason.
    - target: SpiralClip
      embed: true

    sources:
    - path: ../Sources
      excludes:
        - Other/Extensions/XCTestCase.swift
        - Other/Extensions/XCUIElement.swift
    - path: ../../Components/Secrets/Secrets.swift
    - path: ../Resources
    - path: ../SupportingFiles
      # AGENT-PLATFORM (Brief 0083 L1b, decision 302): the XcodeGen manifest is
      # not a resource; shipped, it put upstream's target names in the bundle.
      excludes:
        - target.yml
    - path: ../../Tools/Scripts/Templates/SimpleScreenExample/ElementX
    - path: ../../Components/DevelopmentAssets/Media
    
    # This is required for testing purposes... The problem with unit tests is that if you
    # try to `@testable import NSE` you can only get the definition of files, but due to a
    # limitation in how they work, they can only compile files that are part of the main test
    # target, so linking will fail. The solution is to just have the main app to reference the
    # extension code, and test it directly.
    - path: ../../NSE/Sources
