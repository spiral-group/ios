settings:
  # AGENT-PLATFORM: Nightly variant identifiers rebranded to our namespace
  # to stay consistent with the main app target. Runtime detection at
  # AppSettings.appBuildType + BugReportService matches these values.
  APP_GROUP_IDENTIFIER: group.com.veruslogistics.messenger.nightly
  BASE_BUNDLE_IDENTIFIER: com.veruslogistics.messenger.nightly
  IS_NIGHTLY_BUILD: true

targets:
  ElementX:
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: NightlyAppIcon
    sources:
    - path: Resources
