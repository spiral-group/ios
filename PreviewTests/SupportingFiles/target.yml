name: PreviewTests

schemes:
  PreviewTests:
    analyze:
      config: Debug
    archive:
      config: Release
    build:
      targets:
        PreviewTests: all
    profile:
      config: Release
    run:
      config: Debug
      disableMainThreadChecker: false
    test:
      config: Debug
      disableMainThreadChecker: false
      gatherCoverageData: true
      coverageTargets:
        - ElementX
      testPlans:
        - path: PreviewTests.xctestplan
          defaultPlan: true

targets:
  PreviewTests:
    type: bundle.unit-test
    platform: iOS
    
    dependencies:
    - target: ElementX
    - package: MatrixRustSDK
    - package: SnapshotTesting

    # AGENT-PLATFORM (Brief 0083 L1c): Spiral's tests of the previews that
    # conform to SpiralGatedPreview, generated before this target compiles and
    # named as the phase's output, so that the compile sees the new file.
    preBuildScripts:
    - name: 🧙 Sourcery - Spiral's gated previews
      runOnlyWhenInstalling: false
      basedOnDependencyAnalysis: false
      shell: /bin/sh
      outputFiles:
      - $(SRCROOT)/PreviewTests/Sources/GeneratedSpiralGatedPreviewTests.swift
      script: |
        export PATH="$PATH:/opt/homebrew/bin"
        if which sourcery >/dev/null; then
            sourcery --config Tools/Sourcery/SpiralGatedPreviewTests.yml
        else
            echo "warning: Sourcery not installed, run swift run tools setup-project"
        fi

    info:
      path: ../SupportingFiles/Info.plist

    settings:
      base:
        PRODUCT_NAME: PreviewTests
        PRODUCT_BUNDLE_IDENTIFIER: ${BASE_BUNDLE_IDENTIFIER}.preview.tests
        # AGENT-PLATFORM: same TEST_HOST pin as UnitTests — keeps the host
        # following $(APP_NAME) rather than the literal XcodeGen derives.
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/$(APP_NAME).app/$(APP_NAME)
        # AGENT-PLATFORM (Brief 0083 L1c): the app's iOS 18.5, not upstream's 26.0, so that the
        # pre-glass lane can run on iOS 18.6. The generated tests of previews gated to the
        # Observations-based observe(_:) carry their @available (PreviewTests.stencil).
        IPHONEOS_DEPLOYMENT_TARGET: '18.5'
        SWIFT_VERSION: 6
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
      configs:
        # AGENT-PLATFORM: Xcode compilation caching, Debug (the test
        # configuration) only; Release/archive builds stay uncached.
        Debug:
          COMPILATION_CACHE_ENABLE_CACHING: YES
      debug:
      release:

    sources:
    - path: ../Sources
      excludes:
        - "**/__Snapshots__/**"
    - path: ../SupportingFiles
    - path: ../../UnitTests/Sources/TestUtilities/DeferredFulfillment.swift
