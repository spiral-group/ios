name: UnitTests

schemes:
  UnitTests:
    analyze:
      config: Debug
    archive:
      config: Release
    build:
      targets:
        UnitTests: all
    profile:
      config: Release
    run:
      config: Debug
      disableMainThreadChecker: false
    test:
      config: Debug
      disableMainThreadChecker: false
      gatherCoverageData: true
      coverageTargets:
        - ElementX
      testPlans:
        - path: UnitTests.xctestplan
          defaultPlan: true

targets:
  UnitTests:
    type: bundle.unit-test
    platform: iOS

    dependencies:
    - target: ElementX
    - target: MapLibreInterface
    - package: MatrixRustSDK
    - package: AsyncAlgorithms
    # AGENT-PLATFORM (Brief 0067): CallKitServiceTests still use swift-clocks' TestClock (upstream moved to ManualClock).
    - package: Clocks
    - package: Dynamic
    - package: BuildExtensions
      product: Macros
    # AGENT-PLATFORM (App Review F2, decision 252): the shell's first-party
    # artifacts, for tests only — the app bundle no longer carries them.
    - package: SpiralAppShell
      product: SpiralAppTestArtifacts

    info:
      path: ../SupportingFiles/Info.plist

    settings:
      base:
        PRODUCT_NAME: UnitTests
        PRODUCT_BUNDLE_IDENTIFIER: ${BASE_BUNDLE_IDENTIFIER}.unit.tests
        # AGENT-PLATFORM: the app target declares `productName: Spiral`, so
        # XcodeGen now derives a correct host — but as a LITERAL. Keep the pin
        # so the path follows $(APP_NAME) instead of a name frozen at
        # generation time.
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/$(APP_NAME).app/$(APP_NAME)
        # Requires iOS 26 so tests exercise the Observations-based observe(_:) overload.
        IPHONEOS_DEPLOYMENT_TARGET: '26.0'
        SWIFT_VERSION: 6
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
      configs:
        # AGENT-PLATFORM: Xcode compilation caching, Debug (the test
        # configuration) only; Release/archive builds stay uncached.
        Debug:
          COMPILATION_CACHE_ENABLE_CACHING: YES
      debug:
      release:

    sources:
    - path: ../Sources
    - path: ../SupportingFiles
    - path: ../../Components/DevelopmentAssets/Media
    # AGENT-PLATFORM (Brief 0083 L1b): no ClassicAppFixtures, Element Classic's import is gone.
    - path: ../../ElementX/Sources/Other/Extensions/Publisher.swift
    - path: ../../ElementX/Sources/Other/InfoPlistReader.swift
    - path: ../../Tools/Scripts/Templates/SimpleScreenExample/Tests/Unit
    # AGENT-PLATFORM (security pass 2): the post-sandbox attack corpus, a folder
    # reference so each attack stays a readable .jsx file.
    - path: ../Resources/SpiralAppAttackCorpus
      type: folder
      buildPhase: resources
    
