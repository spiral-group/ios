name: AccessibilityTests

schemes:
  AccessibilityTests:
    analyze:
      config: Debug
    archive:
      config: Release
    build:
      targets:
        AccessibilityTests: all
    profile:
      config: Release
    run:
      config: Debug
      disableMainThreadChecker: false
    test:
      config: Debug
      testPlans:
        - path: AccessibilityTests.xctestplan
          defaultPlan: true

targets:
  AccessibilityTests:
    type: bundle.ui-testing
    platform: iOS

    dependencies:
    - target: ElementX
    - package: KZFileWatchers

    # AGENT-PLATFORM (Brief 0083 L1c): this target doesn't import the app, so it
    # can compile before the app target's Sourcery phases have run. Spiral's list
    # of gated previews is generated here instead, and named as the phase's
    # output so that the compile waits for it and sees the new list.
    preBuildScripts:
    - name: 🧙 Sourcery - Spiral's gated previews
      runOnlyWhenInstalling: false
      basedOnDependencyAnalysis: false
      shell: /bin/sh
      outputFiles:
      - $(SRCROOT)/AccessibilityTests/Sources/GeneratedSpiralGatedAccessibilityTests.swift
      script: |
        export PATH="$PATH:/opt/homebrew/bin"
        if which sourcery >/dev/null; then
            sourcery --config Tools/Sourcery/SpiralGatedAccessibilityTests.yml
        else
            echo "warning: Sourcery not installed, run swift run tools setup-project"
        fi

    info:
      path: ../SupportingFiles/Info.plist

    settings:
      base:
        PRODUCT_NAME: AccessibilityTests
        PRODUCT_BUNDLE_IDENTIFIER: ${BASE_BUNDLE_IDENTIFIER}.accessibility.tests
        SWIFT_VERSION: 6
        SWIFT_APPROACHABLE_CONCURRENCY: YES
      configs:
      # This is required to remove the $(inherited) flags
      # which would prevent SnapshotTesting to be imported in UI Tests
        debug:
          OTHER_SWIFT_FLAGS: ["-DDEBUG"]
        release:
          OTHER_SWIFT_FLAGS: ["-DRELEASE"]

    sources:
    - path: ../Sources
    - path: ../SupportingFiles
    - path: ../../ElementX/Sources/UITests/UITestsSignalling.swift
    - path: ../../ElementX/Sources/Other/AccessibilityIdentifiers.swift
    - path: ../../ElementX/Sources/Other/MatrixEntityRegex.swift
    - path: ../../ElementX/Sources/Other/Pills/PillUtilities.swift
    - path: ../../ElementX/Sources/Other/Extensions/NSRegularExpresion.swift

