        '404':
          description: Voice session not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Purge requested while teardown is still in progress
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: 'Internal server error (`/errors/internal`): something the request depends on failed; the `detail` says no more'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - bearer_auth: []
