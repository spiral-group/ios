        decided_at:
          type:
          - string
          - 'null'
          format: date-time
        state:
          type: string
          description: '`granted` | `refused` | `never` (never asked or never answered).'
        version:
          type:
          - string
          - 'null'
          description: The disclosure version decided on.
    AdminCreateCampaignRequest:
      type: object
      description: '`POST /invites`: a new campaign.'
      required:
      - token
      - max_uses
      properties:
        expires_in_days:
          type:
          - integer
          - 'null'
          format: int64
          description: Days until it expires, 1–3650; `null` or absent never expires.
        max_uses:
          type: integer
          format: int64
          description: Seats, 1 or more.
        token:
          type: string
          description: 10–64 characters of `A-Z a-z 0-9 - _`; unique across all invites.
    AdminFeedDecision:
      type: object
      required:
      - state
      - modlog_id
      - reports_closed
      properties:
        modlog_id:
          type: string
          format: uuid
        reports_closed:
          type: integer
          format: int32
          description: Open reports closed by it.
          minimum: 0
        state:
          type: string
          description: The item's state after it.
    AdminFeedItemDecisionRequest:
      type: object
      description: A decision on a post or a comment.
      required:
      - decision
      properties:
        decision:
          type: string
          description: |-
            `approve` (a held item back) | `remove` | `restore` (a removed item
            back) | `sensitive` | `not_sensitive` (on a `visible` item only).
          example: remove
        explanation:
          type:
          - string
          - 'null'
          description: |-
            The moderator's comment, optional: shown to the author as written
            after the rule's texts (≤ 500 characters, plain text).
        legal_ground:
          type:
          - string
          - 'null'
          description: |-
            The legal ground, for content that breaks the law (Art. 17(3)(d)):
            the law it breaks and why, as plain text (≤ 200 characters). Required
            with `rule: illegal`, optional otherwise; the author reads it in the
            notice.
          example: 'Criminal Code art. 307: an offer to sell drugs'
        rule:
          type:
          - string
          - 'null'
          description: |-
            The Terms § 6 category it rests on; required for `remove` and
            `sensitive`. The author reads the category's fixed title and
            explanation in their language (decision 271).
          example: hate
    AdminFeedModlog:
      type: object
      required:
      - items
      - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminFeedModlogEntry'
        total:
          type: integer
          format: int64
          minimum: 0
    AdminFeedModlogEntry:
      type: object
      description: 'One modlog row: ids and codes only.'
      required:
      - id
      - at
      - actor
      - action
      - target_kind
      - target_id
      properties:
        action:
          type: string
          description: '`hold`, `approve`, `remove`, `suspend`, `set_tier`, …'
        actor:
          type: string
          description: '`operator` | `system:reports` | `system:sla` | `system:filter`.'
        at:
          type: string
          format: date-time
        detail:
          type: object
          description: 'Codes, such as a set-tier''s `{"from": 0, "to": 2}`.'
        id:
          type: string
          format: uuid
        report_id:
          type:
          - string
          - 'null'
          format: uuid
        rule:
          type:
          - string
          - 'null'
        target_id:
          type: string
          format: uuid
        target_kind:
          type: string
          description: '`post` | `comment` | `person` | `report`.'
    AdminFeedOfficialRequest:
      type: object
      required:
      - official
      properties:
        official:
          type: boolean
    AdminFeedPinRequest:
      type: object
      required:
      - post_id
      properties:
        post_id:
          type: string
          format: uuid
    AdminFeedQueue:
      type: object
      required:
      - items
      - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminFeedQueueEntry'
        total:
          type: integer
          format: int64
          minimum: 0
    AdminFeedQueueEntry:
      type: object
      description: One queue entry.
      required:
      - target_kind
      - sensitive
      - media
      - reports
      properties:
        author_mxid:
          type:
          - string
          - 'null'
        bio:
          type:
          - string
          - 'null'
        created_at:
          type:
          - string
          - 'null'
          format: date-time
        filter_rule:
          type:
          - string
          - 'null'
          description: |-
            The rule the keyword filter cited when it held the item, or marked
            it `sensitive`, at publish (decision 278): a Terms § 6 code.
        held_reason:
          type:
          - string
          - 'null'
        media:
          type: array
          items:
            type: string
          description: Its images (`mxc://`), for thumbnails.
        name:
          type:
          - string
          - 'null'
          description: 'For an author: the name and bio the latest report saw.'
        post_id:
          type:
          - string
          - 'null'
          format: uuid
          description: A comment's post (and a post's own id).
        reports:
          type: array
          items:
            $ref: '#/components/schemas/AdminFeedQueueReport'
          description: Open reports, oldest first.
        review_due_at:
          type:
          - string
          - 'null'
          format: date-time
          description: |-
            Present while the filter's hold or mark awaits a moderator (a
            "review" item): due 24 h after publish. The first decision on the
            item clears it; past it the item stays as it is (a held item stays
            held) and the overdue alert fires.
        sensitive:
          type: boolean
        state:
          type:
          - string
          - 'null'
          description: The item's state now; absent when it is gone, or for an author.
        target_id:
          type:
          - string
          - 'null'
          format: uuid
          description: The post or comment; absent for an author.
        target_kind:
          type: string
          description: '`post` | `comment` | `author`.'
        text:
          type:
          - string
          - 'null'
          description: |-
            The text (now, or as the latest report saw it when gone). Plain
            text: render it as text only, never as HTML (D-S5).
    AdminFeedQueueReport:
      type: object
      description: One open report in the queue. Who filed it is not shown.
      required:
      - id
      - reason
      - severe
      - counts_toward_hold
      - automated
      - created_at
      - deadline_at
      properties:
        automated:
          type: boolean
          description: Automated means held the target.
        counts_toward_hold:
          type: boolean
          description: The reporter counts toward the three that hold a post.
        created_at:
          type: string
          format: date-time
        deadline_at:
          type: string
          format: date-time
        detail:
          type:
          - string
          - 'null'
          description: 'The reporter''s words: plain text, render as text.'
        id:
          type: string
          format: uuid
        reason:
          type: string
          description: A Terms § 6 code (`child_safety`, `hate`, …).
        severe:
          type: boolean
    AdminFeedReportDecisionRequest:
      type: object
      required:
      - decision
      properties:
        decision:
          type: string
          description: '`resolve` (acted on elsewhere, e.g. the account locked) | `dismiss`.'
          example: dismiss
    AdminFeedSuspendRequest:
      type: object
      required:
      - until
      - rule
      properties:
        explanation:
          type:
          - string
          - 'null'
          description: |-
            The moderator's comment, optional: shown to the author as written
            after the rule's texts (≤ 500 characters, plain text).
        hold_content:
          type: boolean
          description: |-
            Also hold every visible post and comment of theirs (with a lock:
