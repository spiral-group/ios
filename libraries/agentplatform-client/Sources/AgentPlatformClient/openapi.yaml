  /api/v1/me/memory:
    delete:
      tags:
      - me
      summary: |-
        Erase a contact from every agent the caller owns (GDPR Article 17 —
        right to erasure, per-contact scope per ADR-0019 Principle 5).
      description: |-
        Removes what the caller's agents hold about the contact: memory
        entries, the relationship, outreach to them, approvals about them (a
        pending one is cancelled), their lines in the caller's calls and the
        key-relay rows naming their devices. The caller and the caller's own
        agents are not contacts (400).

        Audit: one `gdpr_audit_log` row (`actor_kind = gdpr_memory_purge`)
        with the counts and the requestor — not the contact — written in the
        same transaction as the erase, so an erase is never unaudited.

        Idempotency: a second call against the same contact returns zeros,
        NOT 404. Distinct from `DELETE /me` (which 404s on the second call
        because the tenant itself is gone).
      operationId: delete_me_memory
      parameters:
      - name: contact_mxid
        in: query
        description: |-
          MXID of the contact whose memory rows to erase (e.g.
          `@bob:agent-x.pp.ua`).
        required: true
        schema:
          type: string
        example: '@bob:agent-x.pp.ua'
      responses:
        '200':
          description: The contact erased from the caller's agents (or already absent)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteMemoryResponse'
        '400':
          description: Malformed contact_mxid, or the caller's own account or agent
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Missing or invalid bearer token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No account for this caller
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Erasure failed; nothing was erased
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - bearer_auth: []
