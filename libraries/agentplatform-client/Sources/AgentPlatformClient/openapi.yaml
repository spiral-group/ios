      - me
      summary: Which of the caller's agents block a person (decision 87).
      description: |-
        One entry per agent that is not archived, across every form the block
        is stored in, with the earliest `blocked_at`. Only the blocks an agent
        asked for: the caller's own messenger block (decision 98) is the
        messenger's "Unblock user", not listed here. No blocks is an empty list,
