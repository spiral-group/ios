    delete:
      tags:
      - operator-voice-sessions
      summary: End a voice session, or GDPR-purge it (with `?purge=true`).
      description: |-
        Without `?purge=true` — durable two-phase teardown with
        `end_reason=manual`; 204 No Content; idempotent.

        With `?purge=true` — hard cascading delete across transcripts,
        summary, consent log, room budget, and recording retention; an
        audit row is appended to `gdpr_audit_log` BEFORE the destructive
        delete so the trail survives.
      operationId: end_or_purge_handler
      parameters:
      - name: session_id
        in: path
        description: Voice session id (UUIDv7)
        required: true
        schema:
          type: string
          format: uuid
      - name: purge
        in: query
        description: |-
          `true` = GDPR right-to-erasure (cascading delete);
          absent / `false` = soft state flip only.
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: Purge succeeded with cascade counts (only when `?purge=true`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurgeResponse'
        '204':
          description: Session teardown durably requested (idempotent)
        '400':
          description: 'Request could not be read (`/errors/validation-failed`): a path parameter does not parse, or a query parameter does not parse'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Missing or invalid bearer token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Caller is not the session owner
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Voice session not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Purge requested while teardown is still in progress
