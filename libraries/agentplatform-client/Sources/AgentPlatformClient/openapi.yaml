components:
  schemas:
    AcceptFeedRulesRequest:
      type: object
      description: '`POST /feed/rules/accept`.'
      required:
      - version
      properties:
        version:
          type: string
          description: |-
            The rules version the person read and accepted: the app's built-in
            version, which must be the server's current one.
          example: 2026-10-27
    AdminActionResponse:
      type: object
      description: |-
        One action of the agent's log — what, decided how, with what outcome.
        No input, no reasoning.
      required:
      - at
      - capability
      - policy_decision
      - policy_reason
      - outcome
      properties:
        at:
          type: string
          format: date-time
        capability:
          type: string
          description: The capability (`messenger.reply_in_room`, `tool.fire`, …).
        failure_reason:
          type:
          - string
          - 'null'
          description: Why a failed action failed (a tag).
        outcome:
          type: string
          description: |-
            `pending` | `executed` | `failed` | `declined` | `cancelled` |
            `denied` | `ignored`.
        policy_decision:
          type: string
          description: '`allowed_direct` | `requires_owner_consent` | `denied` | `ignored`.'
        policy_reason:
          type: string
          description: The policy's stable reason tag.
        room_id:
          type:
          - string
          - 'null'
        trigger:
          type:
          - string
          - 'null'
          description: |-
            What set it off: `matrix_event` | `voice_utterance` | `scheduled_job`
            | `owner_command`.
    AdminActionsResponse:
      type: object
      required:
      - items
      - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AdminActionResponse'
        total:
          type: integer
          format: int64
    AdminAgentCategoryResponse:
      type: object
      description: One category of one agent, against its cap.
      required:
      - category
      - spent_usd
      - cap_source
      - setting
      - counts_since
      - counts_since_source
      - paused
      properties:
        cap_source:
          type: string
          description: 'Where it comes from: `global` | `agent`.'
        cap_usd:
          type:
          - string
          - 'null'
          description: 'The cap that applies (USD); `null`: no cap.'
        category:
          type: string
        counts_since:
          type: string
          format: date-time
        counts_since_source:
          type: string
          description: '`period` | `window_reset` | `category_reset`.'
        global_cap_usd:
          type:
          - string
          - 'null'
          description: 'The global cap it would inherit (USD); `null`: no cap.'
        pause_until:
          type:
          - string
          - 'null'
          format: date-time
          description: When the pause lifts; `null` for a $0 cap (off) or when not paused.
        paused:
          type: boolean
        paused_since:
          type:
          - string
          - 'null'
          format: date-time
          description: When the category refused its first action this window.
        setting:
          type: string
          description: 'The agent''s own setting: `inherit` | `cap` | `no_cap`.'
        spent_usd:
          type: string
          description: Spent since `counts_since` (USD).
    AdminAgentDetailResponse:
      allOf:
      - $ref: '#/components/schemas/AdminAgentResponse'
      - type: object
        required:
        - settings
        - tools
        - blocked
        - approvals
        - spend_by_day
        - budget_cards
        properties:
          approvals:
            $ref: '#/components/schemas/AdminApprovalsResponse'
          blocked:
            type: array
            items:
              $ref: '#/components/schemas/AdminBlockedResponse'
            description: The people its owner blocked, newest first.
          budget_cards:
            type: array
            items:
              type: string
              format: date-time
            description: |-
              The starts of the limit windows in the last 30 days in which the
              agent hit its limit (and its person was told), newest first.
          limit_override_usd:
            type:
            - string
            - 'null'
            description: The agent's own limit override, if set (USD).
          settings:
            $ref: '#/components/schemas/AdminAgentSettingsResponse'
          spend_by_day:
            type: array
            items:
              $ref: '#/components/schemas/AdminSpendDayResponse'
            description: 30 UTC days, newest first, by category and by model.
          tools:
            type: array
            items:
              $ref: '#/components/schemas/AdminAgentToolResponse'
            description: Active tools first, then turned-off ones, newest first.
    AdminAgentLimitResponse:
      type: object
      description: One agent's AI limit (the agent page's "AI limit" tab).
      required:
      - period
      - window
      - total
      - categories
      - recent
      - warnings
      properties:
        categories:
          type: array
          items:
            $ref: '#/components/schemas/AdminAgentCategoryResponse'
          description: Every category that can carry a cap, in a fixed order.
        period:
          type: string
          description: '`day` | `week`.'
        recent:
          type: array
          items:
            $ref: '#/components/schemas/AdminAiLimitAuditResponse'
          description: The latest audit rows about the agent, newest first.
        reset_at:
          type:
          - string
          - 'null'
          format: date-time
          description: The agent's latest whole-window reset.
        total:
          $ref: '#/components/schemas/AdminAgentTotalResponse'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/AdminLimitWarning'
          description: What the write did that the admin should see; empty on a read.
        window:
          $ref: '#/components/schemas/AdminLimitWindowResponse'
    AdminAgentResponse:
      type: object
      required:
      - id
      - mxid
      - state
      - owner_mxid
      - created_at
      - last_active_at
      - spend_today_usd
      - limit_usd
      - limit_source
      - limit_period
      - window_starts_at
      - window_resets_at
      - window_spend_usd
      - limit_reached
      properties:
        company:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/AdminCompanyRefResponse'
            description: The company it works for; `null` for a personal agent.
        created_at:
          type: string
          format: date-time
        display_name:
          type:
          - string
          - 'null'
        id:
          type: string
          format: uuid
        kind:
          type:
          - string
          - 'null'
          description: |-
            `personal_assistant` | `sales` | `outreach` | `support` | `llm` |
            `echo`; a newer kind passes through as stored. `null` without a
            current configuration.
        last_active_at:
          type: string
          format: date-time
        limit_period:
          type: string
          description: '`day` | `week`.'
        limit_reached:
          type: boolean
          description: |-
            The window's spend is at or past the limit: the agent makes no
            model call until `window_resets_at` (or a reset).
        limit_source:
          type: string
          description: 'Where `limit_usd` comes from: `global` | `agent`.'
        limit_usd:
          type: string
          description: |-
            Its AI limit now (question 394): its own override, else the global
            amount (no person level, decision D6).
        mxid:
          type: string
        owner_mxid:
          type: string
          description: The person who owns the agent's tenant.
        spend_today_usd:
          type: string
          description: Model calls and calls, today (UTC).
        state:
          type: string
          description: '`active` | `paused` | `archived`; a newer state passes through.'
        window_resets_at:
          type: string
          format: date-time
          description: … to the period's end.
        window_spend_usd:
          type: string
          description: Model calls and calls in the current window.
        window_starts_at:
          type: string
          format: date-time
          description: 'The current window: from the period''s start or a later reset …'
    AdminAgentSettingsResponse:
      type: object
      description: The agent's settings that are not content.
      required:
      - summary_language
      properties:
        call_language:
          type:
          - string
          - 'null'
          description: The voice profile's language; `null` without a voice profile.
        summary_language:
          type: string
          description: The language its call summaries are written in (`uk` | `ru` | `en`).
        talking_to_people:
          type:
          - string
          - 'null'
          description: |-
            «Talking to people»: `ask_first` | `reply` | `off`; `null` for an
            agent without a persona.
        tone:
          type:
          - string
          - 'null'
          description: |-
            `friendly` | `business` | `calm` | `brief` | `custom` — never the
            tone's words. `null` for an agent without a persona.
    AdminAgentToolResponse:
      type: object
      required:
      - room_id
      - kind
      - active
      - created_at
      properties:
        active:
          type: boolean
        created_at:
          type: string
          format: date-time
        kind:
          type: string
          description: The tool kind (`translate`, `live_translate`, `call_summary`, …).
        room_id:
          type: string
    AdminAgentTotalResponse:
      type: object
      description: One agent's total.
      required:
      - amount_usd
      - source
      - global_amount_usd
      - spent_usd
      - reached
      properties:
        amount_usd:
          type: string
          description: The total that applies (USD).
        global_amount_usd:
          type: string
          description: The global total it would inherit (USD).
        reached:
          type: boolean
        source:
          type: string
          description: '`global` | `agent`.'
        spent_usd:
          type: string
          description: Spent in the window (USD), every category and system work included.
    AdminAgentsResponse:
      type: object
      required:
      - items
      - total
