          type:
          - string
          - 'null'
    CreateCompanyRequest:
      type: object
      required:
      - name
      properties:
        branding_mxc:
          type:
          - string
          - 'null'
        description:
          type:
          - string
          - 'null'
        industry:
          type:
          - string
          - 'null'
        name:
          type: string
