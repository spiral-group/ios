    get:
      tags:
      - me
      summary: Export the caller's account (GDPR Article 20 — data portability).
      description: |-
        Returns a structured JSON bundle: the tenant and one array per
        table holding the caller's data — agents and their configs, voice
        sessions, transcripts, summaries, consent log, recording
        publications, voice and AI usage, the person's company spaces and their
        seats in other people's, approvals, the agents' action log,
        memory, contact relationships, outreach targets, long flows, tools,
        AI-consent decisions, push devices, the hub read marker, invites and
        their redemptions, phrase resets, `gdpr_audit_log` rows and the
        visitor messages an assistant under «Не отвечать» kept (decision 195,
        the fields the notifications hub shows). Secrets
        are left out: invite tokens, LiveKit JWTs, recording encryption keys
        (and memory embeddings, derived numbers). Records a surviving row in
        `gdpr_audit_log` (`kind = gdpr_tenant_export`).
      operationId: export_me
      responses:
        '200':
          description: Full account export bundle
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExportMeResponse'
        '401':
