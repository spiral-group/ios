              schema:
                $ref: '#/components/schemas/SetControlResponse'
        '400':
          description: 'Request could not be read (`/errors/validation-failed`): the body is not valid JSON, or a path parameter does not parse'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Missing or invalid bearer token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Caller does not own the session's agent
          content:
            application/problem+json:
