  /api/v1/agents/{id}/voice-sessions:
    post:
      tags:
      - operator-voice-sessions
      summary: |-
        Start an on-demand voice session for an agent in a specific
        Matrix room (Phase 7.7).
      description: |-
        Three scenarios (A/B/C) covered by the same handler:
          * **A** — agent already in room: immediate consent + JWT mint.
          * **B** — agent not in room: AS-impersonated join, then attach.
          * **C** — call already in progress: same flow, `call_in_progress = true`.

        Owner-only: caller MXID must match the agent's `owner_user_id`,
        must be a joined room member, and the agent + room must share a
        tenant. All three predicates collapse to `403` on failure to
        avoid information disclosure. The shared `/api/v1` request limiter
        protects this endpoint from request bursts; completed attach cycles
        are not subject to a separate per-agent quota.
      operationId: attach_handler
      parameters:
      - name: id
        in: path
        description: Agent id (UUIDv7)
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachRequest'
        required: true
      responses:
        '202':
          description: Voice session started; lifecycle proceeds asynchronously
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachResponse'
        '400':
          description: Malformed room_id / leave_policy
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Missing or invalid bearer token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Owner / membership / tenant check failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: 'Active session already exists, or agent not voice-capable. `/errors/voice-session-active`: the agent already has an active session in the room, and the extension member `existing_session_id` names it (join it); a session the owner just removed (still `ending`) is waited for, up to 5 s (one waiting attach per caller and room), before this answer; `/errors/conflict`: the agent is not a voice agent, or the running session could not be read back (race; retry); `/errors/agent-paused`: the owner paused the agent (decision 194) — it joins no call until resumed; nothing changed'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '415':
          description: 'Request body is not `Content-Type: application/json` (`/errors/unsupported-media-type`)'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: 'Three distinct causes share this status; branch on the RFC 7807 `type`, never on `detail` prose. `/errors/agent-invite-required` — agent could not auto-join an invite-only room, so invite it and retry (the only case that warrants a client-side write). `/errors/unprocessable-entity` — agent_rooms cache slow (retry shortly), or booth conflict (ADR-0075: another agent already covers a speaker the start rules claim — detail names it).. `/errors/invalid-request-body`: the body is JSON but does not fit the schema; `detail` names the field and what was expected'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: 'Internal server error (`/errors/internal`): something the request depends on failed; the `detail` says no more'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - bearer_auth: []
  /api/v1/approvals:
    get:
      tags:
      - approvals
      summary: |-
        List the caller's approvals with optional state filter +
        cursor pagination.
      description: |-
        Returns approvals visible to the caller — i.e. tenant matches
        AND `owner_user_id` equals the bearer-token MXID. Cross-tenant
        / cross-owner rows are silently filtered out; the endpoint
        never reveals their existence.

        R3.3.d (Session 145): added `?state=` filter (all / pending /
        approved / rejected / edited / expired) and cursor pagination
        (`?limit=` + `?cursor=`). Default behaviour unchanged: empty
        query string → `state=pending` + 25 newest rows. Existing
        clients keep working.
      operationId: list_approvals
      parameters:
      - name: state
        in: query
        description: |-
          State filter. R3.3.d (Session 145) widened this from
          `pending`-only to the full set: `pending` / `approved` /
          `rejected` / `edited` / `expired` / `all`. Defaults to
          `pending` (the most common mobile UI case) so existing
          clients don't break.
        required: false
        schema:
          type: string
        example: pending
      - name: limit
        in: query
        description: |-
          Maximum rows per page. Default 25; clamped to [1, 100].
          Mobile inbox typically renders ~10-20 visible items so
          25 is a comfortable initial page.
        required: false
        schema:
          type: integer
          format: int64
        example: 25
      - name: cursor
        in: query
        description: |-
          Opaque cursor from the previous response's `next_cursor`.
          Encoded as `<rfc3339-created_at>|<uuid>`. Clients should
          treat as opaque — the format may evolve.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Approvals for the caller (newest first)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalListResponse'
        '400':
          description: Bad `state` filter or malformed cursor
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Missing or invalid bearer token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: 'Internal server error (`/errors/internal`): something the request depends on failed; the `detail` says no more'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - bearer_auth: []
  /api/v1/approvals/stream:
    get:
      tags:
      - approvals
      summary: |-
        Subscribe to approval lifecycle events for the caller's tenant
        + owner_user_id. Wire shape mirrors
        [`crate::adapters::approval_events::ApprovalEvent`].
      description: |-
        Filter semantics: the same rules as [`ensure_owner`] — we only
        deliver events whose underlying approval is visible to the
        caller through the REST list/fetch endpoints. Doing the filter
        per-event (rather than per-subscription via a sharded channel)
        keeps the broadcaster tenant-agnostic and means adding more
        per-subscriber criteria later (e.g. filter by agent_id) is a
        pure handler change.

        Lag handling: tokio's `broadcast` channel signals `Lagged(n)`
        when a slow subscriber overflows the channel buffer. We log
        the lag and keep streaming — the client is expected to
        re-`GET /approvals?state=pending` on its own to reconcile when
        it cares. Closing the stream on lag would be worse: mobile
        clients routinely stall for a few seconds on tab-switch, and
        we'd tear down every one of them.
        Subscribe to a Server-Sent Events feed of approval lifecycle
        changes for the caller's tenant + owner pair.

        Event names emitted:
          * `ready` — single frame on connect; clients use it to
            distinguish "subscription active" from "still dialing".
          * `approval` — payload mirrors
            [`crate::adapters::approval_events::ApprovalEvent`] (kinds:
            `created`, `decided`, `expired`).
          * `lagged` — broadcast channel overflow; the client should
            reconcile by calling `GET /approvals?state=pending`.

        The stream stays open for the lifetime of the client; a 15 s
        keepalive comment frame prevents idle-proxy disconnects.
      operationId: stream_approvals
      responses:
        '200':
          description: Long-lived Server-Sent Events stream of approval lifecycle frames
          content:
            text/event-stream: {}
        '401':
          description: Missing or invalid bearer token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: 'Internal server error (`/errors/internal`): something the request depends on failed; the `detail` says no more'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - bearer_auth: []
