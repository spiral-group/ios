        apply_scope:
          type: string
          description: '`hot` | `generation_restart`.'
        consent_class:
          type: string
          description: '`none` | `notice` | `explicit`.'
        control:
          type: string
        mid_call_mutability:
          type: string
          description: 'Brief 0055 asymmetric vocabulary: `full` | `disable_only`.'
        mutable_mid_call:
          type: boolean
          description: |-
            Wire-compat boolean: `true` only for fully mutable controls.
            Prefer `mid_call_mutability`.
        supports_audience_scope:
          type: boolean
        visible_to_participants:
          type: boolean
    ControlSetResponse:
