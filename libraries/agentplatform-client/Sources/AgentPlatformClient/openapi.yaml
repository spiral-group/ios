      required:
      - kind
      - text
      properties:
        kind:
          type: string
          description: '`text` today; `text_images` from lane B2.'
          example: text
        media_ids:
          type: array
          items:
            type: string
          description: The caller's registered images (lane B2); must be empty for `text`.
        text:
          type: string
    CreateFeedPostRequest:
      type: object
      description: |-
        `POST /feed/posts`. Fields this server does not know are ignored, so a
        newer app's extra field never fails a create (decision 96).
      required:
      - content
      - idempotency_key
      properties:
        content:
          $ref: '#/components/schemas/CreateFeedPostContent'
        idempotency_key:
          type: string
          format: uuid
          description: |-
            One per composer session: a retry with the same key and text answers
            the post it made (`200`); the same key with another text is `422
            /errors/idempotency-key-reused`.
        lang:
          type:
          - string
          - 'null'
          description: |-
            An official account's post in one language (`en` | `uk` | `ru`),
            with `translation_group`: a reader is shown the post of the group in
            their language, or the English one when theirs has none. Only an
            account with the official label may send it (`422` otherwise); one
            post per language per group (`409`).
          example: uk
        translation_group:
          type:
          - string
          - 'null'
          format: uuid
          description: |-
            The author's own key for the post its translations share; required
            with `lang`, and only with it.
    CreateSpaceAgentRequest:
      type: object
      description: |-
        Provision a role agent inside a company space (was
        `POST /companies/{id}/agents`). Now accepts `role_brief` in the same
        request — the published create-schema form is submittable as one call.
      required:
      - role
      properties:
        display_name:
          type:
          - string
          - 'null'
          description: Optional display-name override; default `"<Company> <Role>"`.
        role:
          type: string
          description: One of `sales` / `outreach` / `support`.
          example: sales
        role_brief:
          type:
          - string
          - 'null'
          description: |-
            What this agent is for, in the owner's words (published bounds
            enforced).
        slug:
          type:
          - string
          - 'null'
          description: Optional slug override (`^[a-z][a-z0-9-]*$`, ≤32).
    DecideRequest:
      oneOf:
      - type: object
        required:
        - action
        properties:
          action:
            type: string
            enum:
            - approve
      - type: object
        required:
        - action
        properties:
          action:
            type: string
            enum:
            - reject
      - type: object
        required:
        - new_body
        - action
        properties:
          action:
            type: string
            enum:
            - edit
          new_body:
            type: string
      description: |-
        Decide payload. `action` is one of `"approve"`, `"reject"`, `"edit"`.
        `new_body` is required when `action == "edit"` and ignored otherwise.
    DecideResponse:
      type: object
      description: |-
        Response payload. `delivery` describes what happened with the final
        Matrix message (if any); `approval` is the post-image.
      required:
      - approval
      - delivery
      properties:
        approval:
          $ref: '#/components/schemas/ApprovalResponse'
        delivery:
          $ref: '#/components/schemas/DeliveryResponse'
    DeleteMeResponse:
      type: object
      description: |-
        Response body for `DELETE /api/v1/me`. We deliberately return a
        200 + body rather than a 204 because the cascade counts are useful
        for clients (mobile apps showing "your data has been deleted: N
        transcripts, M sessions, ..."). RFC 7231 § 6.3.5 forbids a body
        on 204; 200 is the right shape when there's a body to deliver.
      required:
      - status
      - counts
      properties:
        counts:
          $ref: '#/components/schemas/PurgeCountsBody'
        status:
          type: string
          description: Always `"purged"` on success.
          example: purged
    DeleteMemoryResponse:
      type: object
      description: |-
        Response body for `DELETE /api/v1/me/memory`. Returns the counts so a
        client UI can show what was erased; the idempotent re-call returns
        zeros rather than 404.
      required:
      - status
      - contact_mxid
      - deleted_count
      - erased
      properties:
        contact_mxid:
          type: string
          description: |-
            The contact MXID whose data was erased, as given (trimmed), echoed
            for the client. The audit row does not keep it.
          example: '@bob:agent-x.pp.ua'
        deleted_count:
          type: integer
          format: int32
          description: Memory entries erased (`erased.memory_entries`). Zero is valid.
          minimum: 0
        erased:
          $ref: '#/components/schemas/ContactErasureCountsBody'
          description: Everything erased about the contact across the caller's agents.
        status:
          type: string
          description: |-
            Always `"purged"` on success (even when nothing was erased, to
            keep the idempotent re-call shape predictable).
          example: purged
    DeliveryResponse:
      oneOf:
      - type: object
        description: The approval was rejected — no message was sent.
        required:
        - kind
        properties:
          kind:
            type: string
            enum:
            - not_sent
      - type: object
        description: The agent's message landed in the target room.
        required:
        - event_id
        - kind
        properties:
          event_id:
            type: string
          kind:
            type: string
            enum:
            - sent
      - type: object
        description: |-
          The decision was recorded but the final send failed. Callers
          with a UI should surface this prominently; the user may want to
          re-run the decide later or fix the underlying issue.
        required:
        - reason
        - kind
        properties:
          kind:
            type: string
            enum:
            - send_failed
          reason:
            type: string
      - type: object
        description: |-
          The decision was recorded, but the standard delivery path was
          skipped because the approval carried a specialised-delivery
          context (e.g. cold-outreach). The caller (REST handler) drove
          the specialised delivery after receiving this from the domain
          service; the final on-the-wire response replaces this variant
          with the specialised path's Sent / SendFailed outcome before
          serialisation. A `deferred` response that reaches the client
          would indicate the specialised-dispatch glue failed to fire,
          which is a server-side bug.

          The inner field is serialised as `deferred_kind` because the
          outer envelope already uses `kind` as the tag.
        required:
        - deferred_kind
        - kind
        properties:
          deferred_kind:
            type: string
          kind:
            type: string
            enum:
            - deferred
      - type: object
        description: |-
          The approved action was carried out and sends no message: a block
          request (`context_snapshot.kind = "block_sender"`, decision 38) —
          the contact is blocked.
        required:
        - kind
        properties:
          kind:
            type: string
            enum:
            - applied
    EditAgentRequest:
      type: object
      description: |-
        The single agent-edit request. Field groups mirror the published
        edit-schema exactly (ADR-0049 enforcement: the schemable types validate
        the write): `display_name` + `visibility` from the profile section,
        `persona` (whole group, PA-only), `role_brief` (company-role-only).
        `tool_use_enabled` / `model` / `timezone` are the persona editor's
        read-only-schema extras (kept writable for the PA editor toggles; their
        current values arrive on the read-model persona block).

        Replaces the four scattered PATCHes (`/agents/{id}` raw-config,
        `/persona`, `/visibility`, `/role-brief`) and their three different
        auth predicates with one endpoint behind THE ownership predicate.
      properties:
        avatar_mxc:
          type:
          - string
          - 'null'
          description: |-
            Agent avatar as an `mxc://` content URI. The client uploads the
            image itself through the Matrix SDK (Brief 0039 decision 5 —
            media is client-side, mirroring how Element rooms handle
            avatars) and hands us the resulting URI; the domain service
            pushes it to the agent's Synapse profile. Empty string clears
            the avatar. Replaces the deleted `POST /agents/{id}/avatar`
            route (ADR-0050: this PATCH is THE only config write).
          example: mxc://agent-x.pp.ua/AbCdEf
        display_name:
          type:
          - string
          - 'null'
        model:
          type:
          - string
          - 'null'
          description: |-
            Empty string clears the override (falls back to the deployment
            default model).
        paused:
          type:
          - boolean
          - 'null'
          description: |-
            Decision 194 — any kind: `true` pauses the agent (it replies to
            nobody, fires no tools, runs no scheduled actions, joins no calls,
            sends no outreach; approving its cards is refused with 409
            `/errors/agent-paused`), `false` resumes it. 409 for an archived
            agent.
        persona:
          $ref: '#/components/schemas/PersonaPatchBody'
          description: |-
            Persona group — fields from the published `AgentPersonaEdit`
            schema section, each optional (partial patch; the domain service
            keeps absent fields). 409 for non-PA kinds.

            `value_type` pins a direct `$ref` (not `oneOf [null, $ref]`) —
            swift-openapi-generator skips nullable-oneOf schemas entirely,
            which silently dropped this field from the iOS client.
        role_brief:
          type:
          - string
          - 'null'
          description: 409 for kinds that aren't a company role.
        timezone:
          type:
          - string
          - 'null'
          description: IANA tag; empty string clears back to the deployment default.
        tool_use_enabled:
          type:
          - boolean
          - 'null'
        visibility:
          type:
          - string
          - 'null'
          description: |-
            Whether the agent is shown in search: `public` — found by people
            search and on its person's public profile (`GET /users/{mxid}`);
            `private` — in neither. It does NOT decide who may write to the
            agent: anyone who has its address can, and what it does with them
            is the personal assistant's `visitor_policy` (decision 194).
          example: private
        voice_language:
          type:
          - string
          - 'null'
          description: |-
            Decision 193 — the language a personal assistant's calls are
            transcribed and summarised in: `uk` | `ru` | `en` (the enum in the
            edit-schema's `voice_schema`). 409 for other kinds and for an
            assistant that takes no calls.
          example: ru
    EffectiveControlView:
      type: object
      description: The effective translation of the session (ADR-0094 A.3).
      required:
      - source
      - lanes
      - standby
      - syncing
      - paused
      properties:
        category:
          type:
          - string
          - 'null'
          description: '`call_translation` when `paused`; `null` otherwise.'
        for_language:
          type:
          - string
          - 'null'
          description: The intent language (`for_language`); `null` otherwise.
        lanes:
          type: array
          items:
            $ref: '#/components/schemas/LaneView'
          description: |-
            This session's live claims (may include a speaker in their 60 s
            grace).
        pause_until:
          type:
          - string
          - 'null'
          format: date-time
          description: |-
            When the pause lifts (RFC 3339); `null` when not paused, or while a
            $0 cap keeps translation off.
        paused:
          type: boolean
          description: Question 395 — the agent's Call translation is paused by its cap.
        paused_reason:
          type:
          - string
          - 'null'
          description: '`category_paused` when `paused`; `null` otherwise.'
        pocket:
          type:
          - array
          - 'null'
          items:
            type: string
          description: The pocket interpreter's two languages; `null` otherwise.
        source:
          type: string
          description: '`override` | `room_tool` | `off`.'
        standby:
          type: boolean
          description: An enabled, unstopped `for_language` intent that holds no lane.
        stopped_reason:
          type:
          - string
          - 'null'
          description: |-
            `null` | `owner_stopped` | `owner_left` | `ai_limit` |
            `translation_paused` | `call_cap` | `ended` — a plain string; an
            unknown value reads as `ended`.
        style:
          type:
          - string
          - 'null'
          description: |-
            Derived, never written: `simultaneous` while producing or standing
            by, `consecutive` for the pocket interpreter, `null` when off or
            stopped.
        syncing:
          type: boolean
          description: |-
            The runtime has not acknowledged the newest mode yet: show the
            lanes as starting.
    EmojiResponse:
      type: object
      required:
      - glyph
      - description
      properties:
        description:
          type: string
          description: Human-readable label (e.g. `"Dog"`).
        glyph:
          type: string
          description: Single emoji character (e.g. `🐶`).
    EnqueueItemOutcome:
      oneOf:
      - type: object
        description: Successfully queued.
        required:
        - id
        - status
        properties:
          id:
            type: string
            format: uuid
          status:
            type: string
            enum:
            - queued
      - type: object
        description: |-
          Target already has an unfinished row for this agent
          (queued or pending_approval).
        required:
        - status
        properties:
          status:
            type: string
            enum:
            - duplicate
      - type: object
        description: MXID failed shape validation.
        required:
        - reason
        - status
        properties:
          reason:
            type: string
          status:
            type: string
            enum:
            - invalid
    EnqueueRequest:
      type: object
      required:
      - mxids
      properties:
        mxids:
          type: array
          items:
            type: string
          description: |-
            Target MXIDs. Each must be a valid-looking MXID
            (`@user:server`); whitespace trimmed; case preserved.
            Duplicates inside the same batch collapse to a single
            attempted insert with the others reported as `duplicate`.
            Hard-capped at 200 items per request.
          example:
          - '@bob:agent-x.pp.ua'
          - '@carol:agent-x.pp.ua'
    EnqueueResponse:
      type: object
      required:
      - items
      - accepted
      - rejected
      properties:
        accepted:
          type: integer
          format: int32
          minimum: 0
        items:
          type: array
          items:
            $ref: '#/components/schemas/EnqueueResponseItem'
        rejected:
          type: integer
          format: int32
          minimum: 0
    EnqueueResponseItem:
      allOf:
      - $ref: '#/components/schemas/EnqueueItemOutcome'
      - type: object
        required:
        - target_mxid
        properties:
          target_mxid:
            type: string
    ExportMeResponse:
      allOf:
      - type: object
        description: |-
          The bundle proper. `serde_json::Value` because the shape is
          rendered by Postgres `row_to_json` and we don't want to define
          a typed mirror for every table — that would invert the
          schema-evolution gravity (changing a column would require an
          API-layer struct edit). The shape itself is stable per
          `TenantExportBundle` doc-comment. Documented as a free-form
          JSON object in the spec; per-section schemas land in a future
          slice if/when a mobile client needs typed bindings.
      - type: object
        required:
        - export_metadata
        properties:
          export_metadata:
            $ref: '#/components/schemas/ExportMetadata'
      description: |-
        Response body for `GET /api/v1/me/export`. Top-level shape mirrors
        the [`crate::ports::tenant_cascade_repository::TenantExportBundle`]
        JSON, plus an `export_metadata` envelope with counts so the client
        doesn't have to walk every array to size the payload.
    ExportMetadata:
      type: object
      description: |-
        Echoed counts so the client can avoid walking arrays in the
        payload to size things. Same wire shape as the audit-row
        metadata for `gdpr_tenant_export`.
      required:
      - agents_count
      - voice_sessions_count
      - voice_transcripts_count
      - voice_summaries_count
      - voice_consent_log_count
      - approvals_count
      - export_size_bytes
      properties:
        agents_count:
          type: integer
          format: int32
          minimum: 0
        approvals_count:
          type: integer
          format: int32
          minimum: 0
        export_size_bytes:
          type: integer
          format: int32
          minimum: 0
        voice_consent_log_count:
          type: integer
          format: int32
          minimum: 0
        voice_sessions_count:
          type: integer
          format: int32
          minimum: 0
        voice_summaries_count:
          type: integer
          format: int32
          minimum: 0
        voice_transcripts_count:
          type: integer
          format: int32
          minimum: 0
    FeedActivityEntry:
      type: object
      description: One entry of the caller's activity.
      required:
      - id
      - kind
      - at
      - post_id
      - actors
      - total
      - post_preview
      - sensitive
      - unread
      properties:
        actors:
          type: array
          items:
            $ref: '#/components/schemas/FeedAuthor'
          description: |-
            Who did it, newest first: up to three people of a like group ("Taras
            and 3 others"), the comment's author. Never empty.
        at:
          type: string
          format: date-time
          description: The newest like of a group; a comment's creation.
        comment_id:
          type: string
          format: uuid
          description: 'The comment of a `comment` or `reply`: open the post''s thread at it.'
        id:
          type: string
          description: |-
            Stable across pages and pushes: `like:<post>:<YYYY-MM-DD>` (a like
            group keeps its id while it grows), `comment:<comment>`,
            `reply:<comment>`. Dedupe by it.
          example: like:0199d0a1-7c2e-7b44-9a51-3f1e2d4c5b6a:2026-10-30
        kind:
          type: string
          description: |-
            `like` | `comment` | `reply`. A string: skip an entry of a kind the
            app does not know.
          example: like
        post_id:
          type: string
          format: uuid
        post_preview:
          type: string
          description: The post's text, one line, at most 100 characters.
        preview:
          type:
          - string
          - 'null'
          description: |-
            The comment's text, one line, at most 100 characters (`comment`,
            `reply`).
        sensitive:
          type: boolean
          description: |-
            The comment or the post is `sensitive`: hide the previews behind
            "Show".
        total:
          type: integer
          format: int32
          description: |-
            People who liked in the group (1 for a comment). It can exceed the
            people who may still be shown; "and N others" is `total` minus the
            actors shown.
          minimum: 0
        unread:
          type: boolean
          description: Newer than what the caller marked seen.
    FeedActivityPage:
      type: object
      description: One page of the caller's activity.
      required:
      - items
      - unread
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FeedActivityEntry'
        next_cursor:
          type:
          - string
          - 'null'
          description: |-
            Pass back as `cursor` for the next (older) page; absent at the end.
            Keep paging while it is present: a page may be empty and still have
            one.
        unread:
          type: integer
          format: int32
          description: |-
            Entries newer than what the caller marked seen, at most 99 ("99+"):
            the badge on the bell and the Feed tab.
          minimum: 0
    FeedActivitySeenRequest:
      type: object
      description: |-
        `POST /feed/activity/seen`. Fields this server does not know are
        ignored.
      properties:
        at:
          type:
          - string
          - 'null'
          format: date-time
          description: |-
            Seen up to this entry's `at` (the newest the app showed); absent:
            now. Never moves back, never past now.
    FeedActivityUnread:
      type: object
      description: |-
        The caller's unread activity: the answer to `POST /feed/activity/seen`
        and the stream's `activity` event.
      required:
      - unread
      properties:
        unread:
          type: integer
          format: int32
          description: At most 99.
          minimum: 0
    FeedAuthor:
      type: object
      description: A post's author (arch § 3 `Author`), read from Synapse at every page.
      required:
      - mxid
      - official
      properties:
        avatar_mxc:
          type:
          - string
          - 'null'
        bio:
          type:
          - string
          - 'null'
          description: |-
            Plain text, one line, at most 160 user-perceived characters
            (graphemes; MSC4133 `io.spiral.bio`), bidi and zero-width format
            characters removed; absent when unset. Show it as text: no markup, and
            links in it are not tappable.
        mxid:
          type: string
          example: '@ann:spiral.md'
        name:
          type:
          - string
          - 'null'
          description: Display name; absent when unset (show the MXID's localpart).
        name_withheld:
          type: boolean
          description: |-
            The name (or, without one, the MXID's localpart) breaks the rules and
            is withheld: show a neutral name such as "Spiral member", not the
            localpart (lane B4). Always sent; not required — absent (an older
            server) means `false`.
        official:
          type: boolean
          description: Spiral's official account, shown with a label (lane B4, D-P1).
    FeedComment:
      type: object
      description: A comment under a post (arch § 3 `Comment`; flat, D-P7).
      required:
      - id
      - post_id
      - author
      - text
      - created_at
      - state
      - viewer
      properties:
        author:
          $ref: '#/components/schemas/FeedAuthor'
        created_at:
          type: string
          format: date-time
        held_reason:
          type:
          - string
          - 'null'
          description: |-
            Set when `state` is `held`: `filter` | `reports` | `moderator` |
            `sla`. A string.
        id:
          type: string
          format: uuid
          description: UUIDv7; the dedupe key across pages.
        post_id:
          type: string
          format: uuid
        reply_to:
          $ref: '#/components/schemas/FeedReplyTo'
          description: |-
            The comment this one replies to ("replying to <name>"), while the
            caller may see it; absent otherwise (no reply, or the comment
            replied to was deleted, held or is hidden by a block).
        sensitive:
          type: boolean
          description: |-
            Set by the filter only (decision 265): the app shows the comment
            behind a "Show" overlay, as a `sensitive` post. Always sent; not
            required — absent (an older server) means `false`. Ignored on
            create.
        state:
          type: string
          description: |-
            `visible` | `held` | `removed` (the last two for its author only).
            A string: show an unknown value as "not available".
          example: visible
        text:
          type: string
          description: |-
            Plain text, NFKC-normalised, at most 1,000 characters, no markup;
            the app detects http(s) links itself.
        viewer:
          $ref: '#/components/schemas/FeedCommentViewer'
    FeedCommentPage:
      type: object
      description: One page of a post's comments, oldest first.
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FeedComment'
        next_cursor:
          type:
          - string
          - 'null'
          description: |-
            Pass back as `cursor` for the next (newer) page; absent at the end.
            Keep paging while it is present: a page may be empty and still have
            one.
    FeedCommentViewer:
      type: object
      description: The caller's relation to a comment.
      required:
      - is_author
      - can_delete
      properties:
        can_delete:
          type: boolean
          description: 'The caller may delete it: they wrote it, or it is under their post.'
        is_author:
          type: boolean
          description: The caller wrote it.
    FeedContent:
      type: object
      description: What a post holds (arch § 3 `Content`).
      required:
      - kind
      - text
      - media
      - sensitive
      properties:
        kind:
          type: string
          description: |-
            `text` | `text_images`. A string: an unknown kind is "Update Spiral
            to see this post".
          example: text
        media:
          type: array
          items:
            $ref: '#/components/schemas/FeedMediaRef'
          description: 0–4 images in order (lane B2); empty for `text`.
        sensitive:
          type: boolean
          description: |-
            Set by a moderator or the filter only: the app covers the whole post
            with one "Show" overlay.
        text:
          type: string
          description: |-
            Plain text, NFKC-normalised, at most 5,000 characters, no markup;
            the app detects http(s) links itself.
    FeedCounts:
      type: object
      description: A post's counts (arch § 3 `Counts`; lane B3 moves them).
      required:
      - likes
      - comments
      - shares
      properties:
        comments:
          type: integer
          format: int32
          minimum: 0
        likes:
          type: integer
          format: int32
          minimum: 0
        shares:
          type: integer
          format: int32
          minimum: 0
    FeedLiker:
      type: object
      description: One person who liked a post.
      required:
      - author
      - liked_at
      properties:
        author:
          $ref: '#/components/schemas/FeedAuthor'
        liked_at:
          type: string
          format: date-time
    FeedLikersPage:
      type: object
      description: One page of a post's likers, newest first.
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FeedLiker'
        next_cursor:
          type:
          - string
          - 'null'
          description: |-
            Pass back as `cursor` for the next (older) page; absent at the end.
            Keep paging while it is present: a page may be empty and still have
            one.
    FeedLikes:
      type: object
      description: A post's likes after a like or an unlike.
      required:
      - likes
      - liked
      properties:
        liked:
          type: boolean
          description: The caller likes the post now.
        likes:
          type: integer
          format: int32
          minimum: 0
    FeedMediaRef:
      type: object
      description: One image of a post (arch § 3 `MediaRef`; served from lane B2).
      required:
      - id
      - mxc
      - mime
      - width
      - height
      properties:
        alt:
          type:
          - string
          - 'null'
        blurhash:
          type:
          - string
          - 'null'
        height:
          type: integer
          format: int32
          minimum: 0
        id:
          type: string
          format: uuid
        mime:
          type: string
        mxc:
          type: string
          description: '`mxc://<our server>/<media id>`; thumbnails through the media repo.'
        width:
          type: integer
          format: int32
          minimum: 0
    FeedNotice:
      type: object
      description: One notice.
      required:
      - id
      - kind
      - created_at
      - read
      - statement
      properties:
        comment_id:
          type:
          - string
          - 'null'
          format: uuid
        created_at:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
          description: UUIDv7.
        kind:
          type: string
          description: |-
            `held` | `removed` | `restored` | `sensitive` | `suspended` |
            `unsuspended` | `limited` (about the caller's content or account) |
            `report_received` | `report_decided` (about a report they filed). A
            string: show an unknown kind as a generic notice.
          example: removed
        post_id:
          type:
          - string
          - 'null'
          format: uuid
          description: The post it is about (or the post a comment is under).
        read:
          type: boolean
        report_id:
          type:
          - string
          - 'null'
          format: uuid
          description: The caller's report (reporter notices only).
        statement:
          $ref: '#/components/schemas/FeedNoticeStatement'
    FeedNoticePage:
      type: object
      description: A page of the caller's notices, newest first.
      required:
      - items
      - unread
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FeedNotice'
        next_cursor:
          type:
          - string
          - 'null'
          description: Pass back as `cursor` for the next (older) page; absent at the end.
        unread:
          type: integer
          format: int32
          description: Unread notices in all (the badge).
          minimum: 0
    FeedNoticeStatement:
      type: object
      description: |-
        A notice's statement. For the author of the content (Art. 17(3), the
        six elements): `restriction` and `until`, `trigger` (the facts),
        `automated` and `detected_by_automated_means`, `rule` with `rule_title` and `rule_explanation` (the
        contractual ground: fixed texts per rule, decision 271) and then
        `moderator_comment` (the moderator's own words, shown as "Moderator's
        comment"), `legal_ground`, `appeal_contact` (the redress). For the
        reporter: `target_kind` and `deadline_at` (`report_received`),
        `outcome` and `automated` (`report_decided`). Never who reported. Every
        field is optional; an unknown value of a string is shown generically.
      required:
      - automated
      properties:
        appeal_contact:
          type:
          - string
          - 'null'
          description: Where to appeal (an email address).
        automated:
          type: boolean
          description: |-
            The decision was taken by automated means: the filter's hold or
            mark at publish, a hold by reports or the SLA, a report decided
            that way (Art. 17(3)(c), 16(6)). `false` for a moderator's decision.
        deadline_at:
          type:
          - string
          - 'null'
          format: date-time
        detected_by_automated_means:
          type: boolean
          description: |-
            The content was detected by automated means (the keyword filter),
            whoever took the decision (Art. 17(3)(c)). Always sent; not
            required — absent means `false`.
        legal_ground:
          type:
          - string
          - 'null'
          description: |-
            For content a moderator found illegal: the law it breaks and why, as
            plain text (Art. 17(3)(d), decision 278). Show it as written.
        moderator_comment:
          type:
          - string
          - 'null'
          description: |-
            The moderator's own words, in their language, as plain text: show
            it after the rule's texts, headed "Moderator's comment".
        outcome:
          type:
          - string
          - 'null'
          description: '`action_taken` | `no_action` | `target_deleted`.'
        restriction:
          type:
          - string
          - 'null'
          description: |-
            `held` | `removed` | `restored` | `sensitive` | `suspended` |
            `unsuspended` | `limited`.
        rule:
          type:
          - string
          - 'null'
          description: |-
            The rule it rests on: a stable code (a `reason` code of the report
            request), for the app's own logic.
        rule_explanation:
          type:
          - string
          - 'null'
          description: |-
            What the rule does not allow, in plain words, in the same language
            as `rule_title`.
        rule_title:
          type:
          - string
          - 'null'
          description: |-
            The rule's title, in the caller's language (the one they registered
            in, else the request's `Accept-Language`: en, uk or ru; else
            English). Present with a known `rule`.
          example: Spam
        target_kind:
          type:
          - string
          - 'null'
          description: 'What was reported: `post` | `comment` | `author`.'
        tier:
          type:
          - integer
          - 'null'
          format: int32
          description: |-
            A limiting's new feed tier: 0 (30 posts and 200 comments a day) or
            1.
          maximum: 2
          minimum: 0
        trigger:
          type:
          - string
          - 'null'
          description: |-
            What set it off: `report` (someone's report), `reports` (several
            people's), `filter` (the keyword filter), `moderator` (a moderator's
            own review), `sla` (a report stayed open 24 h: held pending review).
        until:
          type:
          - string
          - 'null'
          format: date-time
          description: A suspension's end.
    FeedNotificationSettings:
      type: object
      description: |-
        The caller's feed push settings (decisions 266, 287): per kind, who
        it reaches — `everyone` | `off`. Strings, so `following` can join with
        follows: a value the app does not know means "on" for showing, and a
        value the server does not know is `400`. Notices about their content
        and reports always push. Engagement pushes together reach a person at
        most 20 times an hour.
      required:
      - likes
      - comments
      - replies
      properties:
        comments:
          type: string
          description: |-
            Comments under the caller's posts: at most one push per post per
            10 minutes.
          example: everyone
        likes:
          type: string
          description: |-
            Likes on the caller's posts, grouped: at most one push per post per
            hour.
          example: everyone
        replies:
          type: string
          description: |-
            Replies to the caller's comments (a reply to them under their own
            post is a reply, not also a comment).
          example: everyone
    FeedPage:
      type: object
      description: One page of posts.
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FeedPost'
        next_cursor:
          type:
          - string
          - 'null'
          description: |-
            Pass back as `cursor` for the next (older) page; absent at the end.
            Keep paging while it is present: a page may be empty (every row it
            scanned was filtered out) and still have one.
        pinned:
          $ref: '#/components/schemas/FeedPost'
          description: |-
            The pinned rules post (D-P1): on the first page of Latest only,
            while one is pinned and the caller may see it. Show it on top, once:
            it may also be in `items` (dedupe by `id`).
    FeedPost:
      type: object
      description: A post (arch § 3 `Post`).
      required:
      - id
      - created_at
      - author
      - content
      - counts
      - viewer
      - state
      - comments_enabled
      properties:
        author:
          $ref: '#/components/schemas/FeedAuthor'
        comments_enabled:
          type: boolean
          description: The author lets people comment (lane B3).
        content:
          $ref: '#/components/schemas/FeedContent'
        counts:
          $ref: '#/components/schemas/FeedCounts'
        created_at:
          type: string
          format: date-time
        held_reason:
          type:
          - string
          - 'null'
          description: |-
            Set when `state` is `held`: `filter` | `reports` | `moderator` |
            `premoderation` | `sla`. A string.
        id:
          type: string
          format: uuid
          description: UUIDv7; the dedupe key across pages.
        lang:
          type: string
          description: |-
            An official post's language (`en` | `uk` | `ru`): the page already
            chose the one for the caller's language. Absent on every other post.
          example: uk
        state:
          type: string
          description: |-
            `visible` | `held` | `hidden_author` | `removed`. A string: show an
            unknown value as "not available".
          example: visible
        viewer:
          $ref: '#/components/schemas/FeedViewerState'
    FeedReplyTo:
      type: object
      description: What a reply refers to.
      required:
      - id
      - author
      properties:
        author:
          $ref: '#/components/schemas/FeedAuthor'
        id:
          type: string
          format: uuid
    FeedReportReceipt:
      type: object
      description: A report's receipt (Art. 16(4)).
      required:
      - report_id
      - deadline_at
      properties:
        deadline_at:
          type: string
          format: date-time
          description: |-
            A moderator decides by then; past it the content is held until they
            do (Terms § 7).
        report_id:
          type: string
          format: uuid
    FeedReportRequest:
      type: object
      description: |-
        A report (`POST …/report`). Fields this server does not know are
        ignored (decision 96).
      required:
      - reason
      properties:
        detail:
          type:
          - string
          - 'null'
          description: |-
            What the moderator should know; at most 1,000 characters, plain
            text. The author never sees it.
        reason:
          type: string
          description: |-
            The rule it breaks (Terms § 6): `child_safety` | `threat_to_life` |
            `private_information` (these three are severe: the content is held
            at once) | `illegal` | `regulated_goods` | `sexual_content` |
            `harassment` | `hate` | `violence` | `impersonation` | `spam` |
            `malware` | `other`.
          example: harassment
    FeedShare:
      type: object
      description: What the app sends into the room, as built by the server.
      required:
      - content
      - link
      - shares
      properties:
        content:
          $ref: '#/components/schemas/FeedShareContent'
        link:
          type: string
          description: |-
            `https://<server>/feed/<post id>`: a universal link the app opens;
            the web page shows nothing of the post.
        shares:
          type: integer
          format: int32
          description: The post's shares (each person counts once).
          minimum: 0
    FeedShareContent:
      type: object
      description: 'A Matrix `m.room.message` content: send it as it is.'
      required:
      - msgtype
      - body
      properties:
        body:
          type: string
          description: |-
            The post's text, a blank line, and "View the post in Spiral:
            <link>". Plain text, no `formatted_body`.
        msgtype:
          type: string
          description: Always `m.text`.
          example: m.text
    FeedStanding:
      type: object
      description: |-
        The caller's standing for the composer (`GET /feed/me/standing`, `POST
        /feed/rules/accept`): what they may post now.
      required:
      - rules_version
      - rules_accepted
      - posts_today
      properties:
        comments_per_day:
          type:
          - integer
          - 'null'
          format: int32
          description: Comments a day (UTC); absent when there is no cap (lane B3).
          minimum: 0
        comments_today:
          type: integer
          format: int32
          description: |-
            Comments made today (UTC) (lane B3). Always sent; not required in
            the schema, so a client decodes an older server's answer.
          minimum: 0
        posts_per_day:
          type:
          - integer
          - 'null'
          format: int32
          description: Posts a day (UTC); absent when there is no cap.
          minimum: 0
        posts_today:
          type: integer
          format: int32
          description: Posts made today (UTC).
          minimum: 0
        rules_accepted:
          type: boolean
          description: |-
            They accepted `rules_version`; posting answers `409
            /errors/feed-rules-not-accepted` otherwise.
        rules_version:
          type: string
          description: The current feed rules version.
          example: 2026-10-27
        suspended_until:
          type:
          - string
          - 'null'
          format: date-time
          description: Suspended from posting until then; absent when not suspended.
    FeedViewerState:
      type: object
      description: The caller's relation to a post (arch § 3 `Viewer`).
      required:
      - liked
      - hidden
      - is_author
      properties:
        hidden:
          type: boolean
        is_author:
          type: boolean
        liked:
          type: boolean
    FlowIdResponse:
      type: object
      description: |-
        Flattened flow id. `kind` is `in_room` or `to_device`;
        either `room_id` + `event_id` or `transaction_id` is populated.
      required:
      - kind
      properties:
        event_id:
          type:
          - string
          - 'null'
        kind:
          type: string
          description: '`in_room` (Megolm room) or `to_device` (Olm to-device).'
          example: in_room
        room_id:
          type:
          - string
          - 'null'
        transaction_id:
          type:
          - string
          - 'null'
    IgnoredUsersBody:
      type: object
      description: The caller's whole messenger ignore list (`m.ignored_user_list`).
      required:
      - user_ids
      properties:
        user_ids:
          type: array
          items:
            type: string
          description: The ignored users' MXIDs, as the account data holds them.
    InviteResponse:
      type: object
      description: The owner's personal invite link.
      required:
      - token
      - url
      - max_uses
      - used
      properties:
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
        max_uses:
          type: integer
          format: int32
        token:
          type: string
          description: Opaque token; the last path segment of `url`.
        url:
          type: string
          description: '`https://<server>/join/<token>` — what the owner shares.'
        used:
          type: integer
          format: int32
          description: Seats taken (reserved + completed).
    InvitedByResponse:
      type: object
      description: |-
        1.0.3 — who invited the caller, for the Invite to Spiral screen («Invited
        you») and the app's welcome after sign-up. The platform decides whether
        the welcome is owed, so an invite pasted on the web page counts, a sign-in
        to an account registered otherwise is never greeted, freshness is the
        server's clock, and once the app has shown it (`POST …/welcomed`) no later
        sign-in, second device or reinstall shows it again.
      required:
      - welcome_owed
      properties:
        inviter_user_id:
          type:
          - string
          - 'null'
          description: |-
            The inviter's MXID; null without a personal link (none, or a
            campaign), or once either account is gone.
        welcome_owed:
          type: boolean
          description: |-
            Whether the app should still show the welcome: a seat taken within a
            day, not yet welcomed. False with no inviter.
    JoinCheckResponse:
      type: object
      description: |-
        Whether the caller's agent can join a call in a room, and if not, the
        one reason the owner can act on (question 387, B4).
      required:
      - reason
      properties:
        reason:
          type: string
          description: |-
            `ok`, or the first of: `paused` (resume the agent) ·
            `ai_consent_owner` (the owner has not allowed AI) · `ask_to_join`
            (only admins may add members to this room) · `ai_consent_room` (not
            everyone in the room has allowed AI; names no one) ·
            `budget_reached` (the agent's AI limit is spent) ·
            `category_paused` (its Calls are paused by their cap). A client
            meeting a newer value treats it as "can't join, update the app" —
            a plain string on the wire for that reason (decision 96).
          example: ok
    JoinRoomRequest:
      type: object
      required:
      - room
      properties:
        room:
          type: string
          description: |-
            Either a room id (`!abc:server`) or an alias
            (`#lobby:server`). Passed straight through to Synapse.
          example: '!Abc:agent-x.pp.ua'
    JoinRoomResponse:
      type: object
      required:
      - agent_id
      - room_id
      properties:
        agent_id:
          type: string
          format: uuid
        room_id:
          type: string
    JoinedEntry:
      type: object
      description: One person who registered through the caller's link.
      required:
      - user_id
      - joined_at
      properties:
        joined_at:
          type: string
          format: date-time
        user_id:
          type: string
          description: Full MXID on this homeserver.
    JoinedResponse:
      type: object
      required:
      - joined
      properties:
        joined:
          type: array
          items:
            $ref: '#/components/schemas/JoinedEntry'
    LaneView:
      type: object
      description: |-
        One lane this session produces (ADR-0094 A.3): whose voice, which
        source, into which language.
      required:
      - speaker
      - input
      - language
      properties:
        input:
          type: string
          description: |-
            `voice` in this release; a client leaves out a lane whose input it
            does not know (ADR-0094 D12).
        language:
          type: string
          description: A voice-catalog code in its exact form.
        speaker:
          type: string
          description: The speaker's MXID.
    LastSeenRequest:
      type: object
      description: Body for `PUT /api/v1/me/notifications/last-seen`.
      properties:
        last_seen_at:
          type:
          - string
          - 'null'
          format: date-time
          description: |-
            Marker position. Omit to use the server clock. Values older
            than the stored marker are ignored (monotonic — a stale
            backgrounded client can't un-see notifications).
    LastSeenResponse:
      type: object
      description: |-
        Response for `PUT /api/v1/me/notifications/last-seen` — the
        effective marker after the monotonic upsert.
      required:
      - last_seen_at
      properties:
        last_seen_at:
          type: string
          format: date-time
    LeavePolicyJson:
      type: string
      description: |-
        Wire enum for `leave_policy`. Mirrors the domain [`LeavePolicy`]
        but kept as its own type so we can default + reject unknown values
        in serde without leaking domain internals.
      enum:
      - call_end
      - stay
    LeaveRoomRequest:
      type: object
      required:
      - room
      properties:
        room:
          type: string
          description: Room id the agent should leave (`!abc:server`).
          example: '!Abc:agent-x.pp.ua'
    LeaveRoomResponse:
      type: object
      required:
      - agent_id
      - room_id
      properties:
        agent_id:
          type: string
          format: uuid
        room_id:
          type: string
    ListAgentSpacesResponse:
      type: object
      required:
      - spaces
      - provisioning_status
      properties:
        provisioning_status:
          type: string
          description: |-
            Provisioning state of the caller's personal agent — lets the Personal
            space show a "being created…" state on a fresh signup.
          example: ready
        spaces:
          type: array
          items:
            $ref: '#/components/schemas/AgentSpaceSummaryResponse'
    ListQueueResponse:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OutreachQueueEntry'
    ListSessionsResponse:
      type: object
      description: |-
        List response with cursor pagination. `next_cursor` is `None`
        when the result set is exhausted.
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/VoiceSessionView'
        next_cursor:
          type:
          - string
          - 'null'
          description: |-
            Opaque cursor for the next page. Pass back via
            `?cursor=...` to continue. Internally encodes
            `(created_at, id)` of the last returned row.
    NeedsActionSection:
      type: object
      description: |-
        Pinned "Needs action" section — every pending item the owner can
        currently decide on, one array per family. Newest first within
        each family.
      required:
      - approvals
      - verifications
      properties:
        approvals:
          type: array
          items:
            $ref: '#/components/schemas/ApprovalResponse'
        verifications:
          type: array
          items:
            $ref: '#/components/schemas/VerificationApprovalResponse'
    NotificationsResponse:
      type: object
      description: Wire envelope for `GET /api/v1/me/notifications`.
      required:
      - needs_action
      - visitor_messages
      - activity
      - unseen_count
      properties:
        activity:
          type: array
          items:
            $ref: '#/components/schemas/AgentActivityEntry'
          description: |-
            Chronological feed of terminal agent actions (executed /
            failed / declined / cancelled / denied / ignored), newest
            first. Same entry shape as `GET /agents/{id}/activity`.
        last_seen_at:
          type:
          - string
          - 'null'
          format: date-time
          description: |-
            The owner's last-seen marker. `None` when the hub was never
            opened (treat everything as unseen).
        needs_action:
          $ref: '#/components/schemas/NeedsActionSection'
        next_activity_cursor:
          type:
          - string
          - 'null'
          description: Present iff the activity page filled exactly `limit` rows.
        unseen_count:
          type: integer
          format: int64
          description: |-
            Items in THIS response created after `last_seen_at`
            (needs-action families + visitor messages + the returned activity
            page). Drives
            the bell badge; capped by the response's own limits, which is
            fine — the badge renders "99+" well before that.
        visitor_messages:
          type: array
          items:
            $ref: '#/components/schemas/VisitorMessageResponse'
          description: |-
            Decisions 194, 196 — what the owner's assistants kept for them about
            people they do not answer (messages and missed calls), newest first,
            at most 50, each for 30 days. No push is sent for them.
    OutreachQueueEntry:
      type: object
      required:
      - id
      - target_mxid
      - status
      - approval_id
      - created_at
      - updated_at
      properties:
        approval_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        draft_body:
          type:
          - string
          - 'null'
        error_message:
          type:
          - string
          - 'null'
        id:
          type: string
          format: uuid
        status:
          type: string
          description: |-
            DB-tag status (`queued` / `pending_approval` / `sent` /
            `blocked_by_target` / `content_blocked` / `error`).
        target_mxid:
          type: string
        updated_at:
          type: string
          format: date-time
    PatchAgentSpaceRequest:
      type: object
      description: |-
        Edit a company space's profile (re-homed from `PATCH /organizations/{id}`,
        Brief 0037 S6 → 0038 S4). Behind THE ownership predicate. The Solo
        space is not editable (`409 /errors/personal-space-not-editable`).
      properties:
        branding_mxc:
          type:
          - string
          - 'null'
        description:
          type:
          - string
          - 'null'
        industry:
          type:
          - string
          - 'null'
        name:
          type:
          - string
          - 'null'
        website:
          type:
          - string
          - 'null'
    PersonaPatchBody:
      type: object
      description: |-
        Partial persona patch — the wire mirror of `AgentPersonaEdit` with
        every field optional. Present fields are validated against the exact
        published bounds (`AgentPersonaEdit`'s schemars annotations).
      properties:
        greeting:
          type:
          - string
          - 'null'
        owner_display_name:
          type:
          - string
          - 'null'
        tone:
          type:
          - string
          - 'null'
        visitor_greeting:
          type:
          - string
          - 'null'
        visitor_policy:
          type:
          - string
          - 'null'
          description: |-
            Decision 194 — what the assistant does in a one-to-one chat with
            someone who is not its owner and whom the owner has not approved:
            `ask_first` (default: it drafts, the owner decides), `reply` (it
            answers; moderation and the budget still apply), `off` (no model
            call; the person is told once that the message went to the owner,
            who finds it in `GET /me/notifications` `visitor_messages`).
            Blocked people are ignored and approved ones answered under every
            policy; group rooms are not affected.
          example: ask_first
    PhraseResetResponse:
      type: object
      description: Where the app sends the person to choose a new phrase.
      required:
      - url
      - expires_at
      properties:
        expires_at:
          type: string
          format: date-time
        url:
          type: string
          description: |-
            The identity page in ticket mode — open it in the in-app web
            session. Single use.
    ProblemDetails:
      type: object
      description: |-
        RFC 7807 Problem Details: the body of every error response, sent as
        `application/problem+json`. Branch on `type`; `detail` is the
        request-specific reason, written for people.
      required:
      - type
      - title
      - status
      - detail
      properties:
        detail:
          type: string
          description: Specific, request-scoped reason for the failure.
          example: slug must start with a letter
        existing_session_id:
          type:
          - string
          - 'null'
          format: uuid
          description: |-
            Extension member, sent with `/errors/voice-session-active` only: the
            id of the voice session already running for this agent in the
            room — join it instead of starting another.
        handled:
          type:
          - object
          - 'null'
          description: |-
            Extension member, sent with `/errors/report-already-handled` only:
            the report with the handling record already stored, in the shape
            `GET /api/v1/admin/reports` lists it.
        instance:
          type:
          - string
          - 'null'
          description: |-
            RFC 7807 `instance`: a URI for this occurrence. Optional; this
            server does not send it today.
        pause_until:
          type:
          - string
          - 'null'
          format: date-time
          description: |-
            Extension member, sent with `/errors/translation-paused` only: when
            the pause lifts (RFC 3339), or null (`call_cap`, a $0 cap).
        reason:
          type:
          - string
          - 'null'
          description: |-
            Extension member, sent with `/errors/translation-paused` only:
            `translation_paused` | `ai_limit` | `call_cap`.
          example: translation_paused
        recording_agent:
          type:
          - string
          - 'null'
          description: |-
            Extension member, sent with `/errors/recording-covered` only: the
            MXID of the assistant that records the call, or null.
          example: '@assistant-olena:example.org'
        recording_owner:
          type:
          - string
          - 'null'
          description: |-
            Extension member, sent with `/errors/recording-covered` only: the
            MXID of that assistant's owner, or null.
          example: '@olena:example.org'
        room_kind:
          type:
          - string
          - 'null'
          description: |-
            Extension member, sent with `/errors/translation-intent-unavailable`
            only: the room kind as the agent classifies it (`group` |
            `voice_room` | `owner_dm` | `visitor_dm`).
          example: owner_dm
        rules_version:
          type:
          - string
          - 'null'
          description: |-
            Extension member, sent with `/errors/feed-rules-not-accepted` only:
            the feed rules version to accept (`POST /api/v1/feed/rules/accept`).
            An app whose built-in rules are older asks the person to update.
          example: 2026-10-27
        status:
          type: integer
          format: int32
          description: |-
            HTTP status code mirrored into the body for clients that
            parse the JSON before the headers.
          example: 400
          minimum: 0
        title:
          type: string
          description: Short, human-readable title for the error class.
          example: Validation failed
        type:
          type: string
          description: |-
            RFC 7807 `type` URI identifying the error class
            (`/errors/<kind>`).
          example: /errors/validation-failed
    ProvisioningStatus:
      type: string
      description: |-
        Minimal representation of a personal agent for the `/me/personal-
        agents` endpoint.

        Deliberately thinner than [`crate::api::routes::agents::AgentResponse`] —
        the caller is the owner, they already know the tenant/org context,
        and the persona editor (Phase 6.b) will have its own richer endpoint
        for config details. This is the "directory" shape.
        R3.3.c — coarse status enum on the `GET /me/personal-agents`
        response envelope. Lower-cased on the wire to match the
        project-wide convention for enum-like strings (mirrors
        `LifecycleState` / `Visibility`).
      enum:
      - idle
      - in_progress
      - ready
    PublicAgentSummary:
      type: object
      description: |-
        A single public agent as seen on someone else's profile page.

        Deliberately narrower than the owner-side agent card:
          * no tenant_id / organization_id — leaks backend structure.
          * no lifecycle_state — we filter on active already.
          * no owner_user_id — the caller is reading *somebody else's*
            profile and the owner is right there in the URL, no need
            to re-project.

        Phase 6 closeout (Session 40): we now project the persona
        fields (`display_name`, `tone`, `greeting`, `visitor_greeting`)
        from the agent's current `AgentConfig`. The visitor-facing UI
        wanted this so "Contact agent" could preview how the agent
        greets strangers BEFORE opening a DM. Persona fields are
        `Option<String>` so the wire stays clean for:

          * agents with behaviour != `PersonalAssistant` (technically
            allowed to be public but don't have a persona to preview);
          * older rows where the config fetch failed — UI can fall back
            to the MXID localpart.

        `visitor_greeting` IS safe to expose publicly — by construction
        (see `docs/DECISIONS.md` § Session 35) it's the text the agent
        would send a stranger anyway, there's no new info leakage.
      required:
      - id
      - matrix_user_id
      - created_at
      properties:
        avatar_mxc:
          type:
          - string
          - 'null'
          description: |-
            The agent's avatar, when it has one. `None` is common today —
            nothing sets an avatar at provisioning — and a client letter avatar
            seeded from `display_name` is the correct fallback.
        created_at:
          type: string
          format: date-time
        display_name:
          type:
          - string
          - 'null'
          description: |-
            The agent's own configured name (`agent_configs.display_name`) —
            the same string its Matrix profile carries and the agent editor
            shows. `None` only when the config could not be read. Clients must
            NOT derive a name from the MXID localpart: that renders a login as
            an identity and disagrees with every other surface.
        greeting:
          type:
          - string
          - 'null'
          description: Persona's "about you" line. Visitor preview.
        id:
          type: string
          format: uuid
        matrix_user_id:
          type: string
        tone:
          type:
          - string
          - 'null'
          description: |-
            Persona tone hint. UI can show this as a subtitle so visitors
            know what to expect ("warm, concise, professional").
        visitor_greeting:
          type:
          - string
          - 'null'
          description: |-
            First-contact greeting the agent would send a stranger. Safe
            to preview: it's exactly what the visitor gets anyway.
    PurgeCountsBody:
      type: object
      description: |-
        Wire-shape mirror of [`GdprTenantPurgeCounts`]. Kept in the API
        layer rather than re-exporting the domain struct so the JSON
        shape can evolve independently from the domain shape (e.g. add
        a `i18n_message_key` field for the mobile UI without touching
        the domain type).
      required:
      - agents
      - voice_sessions
      - voice_transcripts
      - voice_summaries
      - voice_consent_log
      - approvals
      - mas_deactivated
      - agents_deactivated
      - recordings_queued
      - login_links_deleted
      - identity_erased
      - bridge_logins_ended
      - bridges_failed
      - ai_consent_decisions
      - recording_publications
      - push_devices
      - notification_read_markers
      - organization_memberships
      - queue_jobs_erased
      - action_log_entries
      - gdpr_audit_rows
      - as_contact
      properties:
        action_log_entries:
          type: integer
          format: int32
          description: The action-log entries of the person's agents, deleted.
          minimum: 0
        agents:
          type: integer
          format: int32
          minimum: 0
        agents_deactivated:
          type: integer
          format: int32
          description: Brief 0078 — agents whose Matrix users were deactivated.
          minimum: 0
        ai_consent_decisions:
          type: integer
          format: int32
          description: Brief 0078 phase 2 — the person's AI-consent decisions, erased.
          minimum: 0
        approvals:
          type: integer
          format: int32
          minimum: 0
        as_contact:
          $ref: '#/components/schemas/ContactErasureCountsBody'
          description: |-
            Decision 13 — what other people's agents held about the person
            (and their agents) as a contact, erased.
        bridge_logins_ended:
          type: integer
          format: int32
          description: Brief 0078 — chat-bridge logins ended.
          minimum: 0
        bridges_failed:
          type: integer
          format: int32
          description: Brief 0078 — bridges that could not be asked to log out.
          minimum: 0
        feed_actions:
          type: integer
          format: int32
          description: The caller's likes, hides and shares, and those on their posts.
          minimum: 0
        feed_comments:
          type: integer
          format: int32
          description: The caller's feed comments and the comments under their posts.
          minimum: 0
        feed_media_queued:
          type: integer
          format: int32
          description: The caller's feed images queued for deletion.
          minimum: 0
        feed_notices:
          type: integer
          format: int32
          description: The caller's feed notices.
          minimum: 0
        feed_posts:
          type: integer
          format: int32
          description: |-
            Brief 0082 — the caller's feed posts. Always sent; a client must
            tolerate its absence from an older server.
          minimum: 0
        feed_reports_scrubbed:
          type: integer
          format: int32
          description: |-
            Reports about the caller, scrubbed (lane B4): their MXID and the
            content dropped; a report under a legal hold is kept as it is.
          minimum: 0
        gdpr_audit_rows:
          type: integer
          format: int32
          description: |-
            The person's other GDPR audit rows (exports, erases, call purges),
            deleted; the deletion's receipt is the one row left (decision 73).
          minimum: 0
        identity_erased:
          type: boolean
          description: Brief 0078 — identity-login erased the identity.
        ignored_by_others:
          type: integer
          format: int32
          description: Other people's ignore-list entries naming the caller.
          minimum: 0
        ignored_users:
          type: integer
          format: int32
          description: The caller's ignore list.
          minimum: 0
        login_links_deleted:
          type: integer
          format: int32
          description: Brief 0078 — MAS upstream links deleted.
          minimum: 0
        mas_deactivated:
          type: boolean
          description: |-
            Whether MAS deactivated and GDPR-erased the person. Always
            `true` on a 200: since Brief 0078 the purge stops (503) otherwise.
        notification_read_markers:
          type: integer
          format: int32
          description: The person's notifications-hub read marker, deleted.
          minimum: 0
        organization_memberships:
          type: integer
          format: int32
          description: The person's company-space memberships, in any space, deleted.
          minimum: 0
        push_devices:
          type: integer
          format: int32
          description: The person's registered push devices, deleted.
          minimum: 0
        queue_jobs_erased:
          type: integer
          format: int32
          description: Finished reply-queue jobs that named the person, removed.
          minimum: 0
        recording_publications:
          type: integer
          format: int32
          description: |-
            The agents' recording publications (keys, media URIs, event ids),
            deleted.
          minimum: 0
        recordings_queued:
          type: integer
          format: int32
          description: Brief 0078 — recording objects queued for deletion.
          minimum: 0
        voice_consent_log:
          type: integer
          format: int32
          minimum: 0
        voice_sessions:
          type: integer
          format: int32
          minimum: 0
        voice_summaries:
          type: integer
          format: int32
          minimum: 0
        voice_transcripts:
          type: integer
          format: int32
          minimum: 0
    PurgeResponse:
      type: object
      description: |-
        Response body for the GDPR purge variant — counts cascade
        rows the operation wiped. Empty body for the plain end
        variant (204 No Content).
      required:
      - session_id
      - transcripts_purged
      - summary_purged
      - audit_rows_purged
      - budget_rows_purged
      properties:
        audit_rows_purged:
          type: integer
          format: int32
          minimum: 0
        budget_rows_purged:
          type: integer
          format: int32
          minimum: 0
        session_id:
          type: string
          format: uuid
        summary_purged:
          type: boolean
        transcripts_purged:
          type: integer
          format: int32
          minimum: 0
    RegisterPushDeviceRequest:
      type: object
      description: Body for `POST /api/v1/me/push-devices`.
      required:
      - pushkey
      - app_id
      properties:
        app_id:
          type: string
          description: Sygnal app id (`com.veruslogistics.messenger.ios.prod|dev`).
        pushkey:
          type: string
          description: |-
            APNs device token, same encoding the client hands Synapse's
            `setPusher` (base64).
    RoomToolAgentEntry:
      type: object
      description: |-
        One agent joined to the room, with its active Tools.

        Only joined agents are listed (an agent accepts every invite at once,
        and `agent_rooms` records it on the join), so a client's "invited"
        state can never show from here (room-tools audit finding 12); a client
        that wants an invite's state reads it from the room itself.
      required:
      - agent_id
      - matrix_user_id
      - display_name
      - is_mine
      - tools
      properties:
        agent_id:
          type: string
        display_name:
          type: string
        is_mine:
          type: boolean
          description: |-
            Whether the caller owns the agent's space — their personal
            assistant, or an agent of a company space they own (whose
            `owner_user_id` is null). Such an agent's tools are listed in full,
            and the caller may arm and turn them off.
        matrix_user_id:
          type: string
        owner_user_id:
          type:
          - string
          - 'null'
        tools:
          type: array
          items:
            $ref: '#/components/schemas/RoomToolView'
    RoomToolView:
      type: object
      description: |-
        One Tool as the room-wide read surfaces it. For an agent the caller
        owns the projection is full (`params` + `trigger` + `id`); for others
        it is a safe slice — the `kind` + trigger discriminant only (the
        operator's instruction / target details are elided, and no id). Both
        say whether the Tool touches the caller's own messages, and only that:
        the owner's chosen audience stays private.
      required:
      - tool_kind
      - trigger_kind
      - applies_to_viewer
      properties:
        applies_to_viewer:
          type: string
          description: |-
            Whether this Tool touches the caller's own messages, on every Tool,
            own and others'. `yes`: a plain message of theirs fires it. `no`: it
            never does. `not_applicable`: the Tool acts on a call and has no
            sender. `unknown`: a read failed, which is not a `no`. It comes from
            the rule the Tool fires by and says nothing about anyone else. A
            plain string, as `tool_kind` is: a client reads a value it does not
            know as `unknown`.
        id:
          type:
          - string
          - 'null'
          description: |-
            Tool id — `Some` only for the caller's own agents (needed to
            `DELETE`). `None` for others.
        params:
          type:
          - object
          - 'null'
          description: |-
            Full typed params — `Some` only for own agents (the safe slice
            elides the details that may carry private instructions). Nullable:
            emitted as JSON `null` for agents the caller doesn't own, so the
            schema MUST allow null (else clients fail to decode a room that
            contains another participant's armed tool).
        target_language:
          type:
          - string
          - 'null'
          description: |-
            The translate/live-translate target language, e.g. `English` / `uk`.
            Public for EVERY agent (own AND others), because it is already
            public in the all-participant `com.spiral.tools` state event — the
            banner shows "Translating to English" for anyone's agent. It is the
            only `params` field that is safe to surface in the safe slice; the
            private free-text instructions (`rephrase` / `custom`) stay owner-
            only via `params`. `None` for non-translate tools.
        tool_kind:
          type: string
          description: Tool kind discriminant (`translate` / `live_translate` / …).
        trigger:
          type:
          - object
          - 'null'
          description: |-
            Full typed trigger — `Some` only for own agents. Nullable for the
            same reason as `params`.
        trigger_kind:
          type: string
          description: Trigger discriminant (`on_message` / `on_voice_call`).
    RoomToolsResponse:
      type: object
      description: The room-wide tools read.
      required:
      - room_id
      - agents
      properties:
        agents:
          type: array
          items:
            $ref: '#/components/schemas/RoomToolAgentEntry'
        room_id:
          type: string
    SessionControlView:
      type: object
      description: One override row as the owner panel reads it.
      required:
      - control
      - state
      - params
      - revision
      - updated_by
      - updated_at
      properties:
        control:
          type: string
        params:
          type:
          - object
          - 'null'
          description: Typed `SessionControlParams` (present iff `enabled`).
        revision:
          type: integer
          format: int32
          description: CAS token for the next write.
        state:
          type: string
          description: '`inherit` | `enabled` | `disabled`.'
        updated_at:
          type: string
          format: date-time
        updated_by:
          type: string
    SessionControlsCatalogResponse:
      type: object
      required:
      - controls
      - params_schema
      - voice_translation_languages
      properties:
        controls:
          type: array
          items:
            $ref: '#/components/schemas/ControlCatalogEntry'
        params_schema:
          type: object
          description: JSON Schema of the typed `SessionControlParams` object.
        voice_translation_languages:
          type: array
          items:
            $ref: '#/components/schemas/CatalogLanguage'
          description: |-
            Voice-capable translation languages (Brief 0047 / ADR-0062
            provider allow-list — the same set the arm gate enforces).
    SessionControlsResponse:
      type: object
      required:
      - session_id
      - room_id
      - effective
      - overrides
      - call_artifacts
      - conversation
      properties:
        call_artifacts:
          $ref: '#/components/schemas/CallArtifactsView'
          description: Brief 0055 — live recording/summary flags for this session.
        conversation:
          $ref: '#/components/schemas/ConversationView'
          description: Brief 0080 — the Conversation / Silent switch.
        effective:
          $ref: '#/components/schemas/EffectiveControlView'
          description: |-
            Effective per-control resolution (`session override → room Tool
            → off`). Phase 1: translation only.
        overrides:
          type: array
          items:
            $ref: '#/components/schemas/SessionControlView'
          description: Raw override rows (the owner's session-scoped writes).
        room_id:
          type: string
        session_id:
          type: string
    SetControlRequest:
      type: object
      description: '`PUT /controls/{control}` body.'
      required:
      - state
      properties:
        params:
          type:
          - object
          - 'null'
          description: Typed `SessionControlParams`; required iff `state == "enabled"`.
        revision:
          type: integer
          format: int32
          description: |-
            CAS token: 0 = "no override row yet"; else the revision from the
            last read. 409 on mismatch.
        state:
          type: string
          description: '`enabled` | `disabled` | `inherit`.'
    SetControlResponse:
      type: object
      required:
      - status
      - action_log_id
      - controls
      properties:
        action_log_id:
          type: string
        controls:
          $ref: '#/components/schemas/SessionControlsResponse'
          description: Post-write override row + effective state.
        status:
          type: string
          description: '`applied` | `awaiting_consent`.'
    ShareFeedPostRequest:
      type: object
      description: '`POST /feed/posts/{post_id}/share`.'
      required:
      - room_id
      properties:
        lang:
          type:
          - string
          - 'null'
          description: |-
            The language of the line before the link: `en` | `uk` | `ru` (a
            region suffix is ignored); English otherwise.
          example: uk
        room_id:
          type: string
          description: |-
            The Matrix room the app will send the message to (`!…:server`). It
            is checked, never stored.
          example: '!PGBmctdJNFwoAOHtvM:spiral.md'
    SignInMethodsResponse:
      type: object
      description: How the caller can sign in (the app's account settings).
      required:
      - phrase
      - apple
      - apple_available
      properties:
        apple:
          type: boolean
          description: The account has an Apple ID attached.
        apple_available:
          type: boolean
          description: |-
            Sign in with Apple is configured on this server: the app may offer
            «Add Sign in with Apple» (`POST /me/apple-link`).
        phrase:
          type: boolean
          description: The account has an active sign-in phrase.
    SyncChange:
      type: object
      description: |-
        One change as a `changes` frame carries it. Only the fields of its
        kind are present; a kind the app does not know is skipped.
      required:
      - kind
      properties:
        agent:
          type: string
          format: uuid
          description: '`agent.*`, `verification.changed`, `profile.public`: the agent.'
        approval:
          type: string
          format: uuid
          description: '`approval.changed`: the approval.'
        author:
          type: string
          description: '`feed.post_published`: the author''s MXID (their page re-reads).'
        comment:
          type: string
          format: uuid
        comments:
          type: integer
          format: int32
          minimum: 0
        kind:
          type: string
          description: |-
            `feed.counts`, `feed.post_published`, … (a string: skip one the
            app does not know).
          example: feed.counts
        liked:
          type: boolean
          description: '`feed.viewer_like`: the caller''s own like, from another device.'
        likes:
          type: integer
          format: int32
          minimum: 0
        message:
          type: string
          format: uuid
          description: '`notification.visitor`: the kept visitor message.'
        parent:
          type: string
          format: uuid
          description: The comment `comment` replies to.
        post:
          type: string
          format: uuid
        room:
          type: string
          description: '`agent.rooms`, `agent.tools`: the Matrix room id.'
          example: '!abc:spiral.example'
        shares:
          type: integer
          format: int32
          minimum: 0
        space:
          type: string
          format: uuid
          description: '`agent.updated`, `space.updated`: the space (organization).'
        state:
          type: string
          description: |-
            `feed.post_state`: `visible` or `gone`; to the author also the real
            state (`held`, `removed`, `hidden_author`). A string.
        verification:
          type: string
          format: uuid
          description: '`verification.changed`: the verification request.'
    SyncChanges:
      type: object
      description: A `changes` event; its SSE `id` is `position`.
      required:
      - position
      - changes
      properties:
        changes:
          type: array
          items:
            $ref: '#/components/schemas/SyncChange'
        position:
          type: string
          example: 8125-4417
    SyncLimited:
      type: object
      description: The `limited` event.
      required:
      - position
      properties:
        position:
          type: string
          description: Continue from here, after re-reading what is shown.
          example: 8200-0
    SyncReady:
      type: object
      description: The `ready` event.
      required:
      - position
      - fresh
      properties:
        fresh:
          type: boolean
          description: 'No `since` was given: re-read what is shown, then follow.'
        position:
          type: string
          description: 'Opaque: keep it, pass it back as `since`.'
          example: 8123-0
    ToolsCatalogResponse:
      type: object
      description: |-
        The settable-tool catalog: the typed `ToolParams` + `TriggerKind` JSON
        Schemas a client renders forms from, plus the per-transport translation
        language sets a client populates its language pickers from (Brief 0047).
      required:
      - agent_id
      - room_id
      - params_schema
      - trigger_schema
      - text_translation_languages
      - voice_translation_languages
      - available_tool_kinds
      properties:
        agent_id:
          type: string
        available_tool_kinds:
          type: array
          items:
            type: string
          description: |-
            The tool kinds that can fire in THIS room for THIS agent, in catalog
            order. A client offers only these: a text tool in the owner DM, live
            call translation in a 1:1 room, or any call tool on an agent that
            does not join calls (a company agent in 1.0.1, decision 168) would be
            saved and never fire, so the arm refuses them
            (`/errors/tool-does-not-fire-here`).
        params_schema:
          type: object
          description: |-
            JSON Schema 2020-12 for the `params` field (the `ToolParams`
            `oneOf`, tagged by `kind`).
        room_id:
          type: string
        text_translation_languages:
          type: array
          items:
            $ref: '#/components/schemas/CatalogLanguage'
          description: |-
            Languages selectable for the `translate` (text) Tool — the backend's
            curated text-provider set (ADR-0062). A client renders its Translate
            language picker from this list, not from a device-local list.
        trigger_schema:
          type: object
          description: JSON Schema for the `trigger` field (the `TriggerKind` `oneOf`).
        voice_translation_languages:
          type: array
          items:
            $ref: '#/components/schemas/CatalogLanguage'
          description: |-
            Languages selectable for the `live_translate` (voice) Tool — the voice
            provider's allow-list (Gemini live translation). A client MUST render its
            LiveTranslate picker from this list; an off-list code makes the runtime
            session crash with `1007 Unsupported language code`.
    UpdateFeedPostRequest:
      type: object
      description: |-
        `PATCH /feed/posts/{post_id}`: the author's changes. Fields this server
        does not know are ignored; at least one it knows must be given.
      properties:
        comments_enabled:
          type:
          - boolean
          - 'null'
          description: |-
            Turn comments on or off (D-P7). Off hides the comments from everyone
            but the author and refuses new ones; on shows them again.
    UsageCategoryShareResponse:
      type: object
      required:
      - category
      - used_percent
      properties:
        category:
          type: string
          description: |-
            One of `messages`, `room_tools`, `posts`, `calls`,
            `call_translation`, `call_summaries`, `other`. A string, not a
            closed enum: a client shows a category it does not know as other
            rather than failing the whole view.
        used_percent:
          type: number
          format: double
          description: |-
            Share of the limit, in percent (one decimal; any use reads at least
            0.1, never 0).
    UsageCurrentCategoryResponse:
      type: object
      description: |-
        A category of the current window: its share, and whether its cap paused
        it (question 395). Never an amount or a cap (K2).
      required:
      - category
      - used_percent
      - paused
      properties:
        category:
          type: string
          description: As in [`UsageCategoryShareResponse`].
        pause_until:
          type:
          - string
          - 'null'
          format: date-time
          description: |-
            When the pause lifts (RFC 3339; show it in local time); `null` when
            not paused, or while a $0 cap keeps the category off, which the end
            of the week does not lift.
        paused:
          type: boolean
          description: 'Its cap paused it: the app shows the row with a pause, even at 0%.'
        used_percent:
          type: number
          format: double
          description: |-
            Share of the weekly limit, in percent (K2); 0 for a paused category
            that spent nothing.
    UsageCurrentResponse:
      type: object
      required:
      - period
      - starts_at
      - resets_at
      - used_percent
      - limit_reached
      - categories
      properties:
        categories:
          type: array
          items:
            $ref: '#/components/schemas/UsageCurrentCategoryResponse'
          description: |-
            The window's non-zero categories and every paused one, largest
            first.
        limit_reached:
          type: boolean
          description: 'The limit is spent: the agent stays silent until `resets_at`.'
        period:
          type: string
          description: |-
            `day` (the UTC day) | `week` (the calendar week from Monday 00:00
            UTC). A string, not a closed enum: a client meeting a newer period
            shows a neutral "limit" (decision 96).
          example: week
        resets_at:
          type: string
          format: date-time
          description: |-
            When the window ends and the limit starts afresh; show it in the
            person's local time.
        starts_at:
          type: string
          format: date-time
          description: 'When the window began: the period''s start, or a later reset.'
        used_percent:
          type: number
          format: double
          description: |-
            Share of the limit spent in the window, in percent; past 100 when a
            call ran over.
    UsageDayResponse:
      type: object
      required:
      - date
      - used_percent
      - categories
      properties:
        categories:
          type: array
          items:
            $ref: '#/components/schemas/UsageCategoryShareResponse'
          description: Non-zero categories, largest first; empty on a day without use.
        date:
          type: string
          format: date
          description: The UTC day.
        used_percent:
          type: number
          format: double
          description: |-
            That day's share of the limit, in percent; past 100 when a call ran
            over.
    UserProfileResponse:
      type: object
      required:
      - mxid
      - display_name
      - public_agents
      properties:
        display_name:
          type: string
          description: |-
            Best-effort display name. Phase 6.c derives this from the
            MXID localpart (capitalised) — matches how
            `provision_personal_agent` builds its owner name. Phase 6.d
            or later can fetch the real Matrix profile display name
            through the intent client.
        mxid:
          type: string
          description: Canonical MXID of the user the profile describes.
          example: '@alice:agent-x.pp.ua'
        public_agents:
          type: array
          items:
            $ref: '#/components/schemas/PublicAgentSummary'
          description: |-
            Publicly-contactable personal agents owned by the user.
            Empty array when the user has no agent yet (reconciliation
            pending) OR has toggled them all private.
    VerificationApprovalResponse:
      type: object
      description: |-
        Client-facing shape. Mirrors [`VerificationApproval`] but flattens
        `FlowId` into wire-friendly scalars and renders state / cancel
        code as strings (vs the domain enums). Stable on the wire — we
        version this struct if we ever need to break it.
      required:
      - id
      - agent_id
      - owner_user_id
      - requester_user_id
      - flow_id
      - state
      - created_at
      - deadline_at
      properties:
        agent_id:
          type: string
          format: uuid
        cancel_code:
          type:
          - string
          - 'null'
          description: Set when state is `cancelled`. RFC-spec cancel-code string.
        created_at:
          type: string
          format: date-time
        deadline_at:
          type: string
          format: date-time
        decided_at:
          type:
          - string
          - 'null'
          format: date-time
        decided_by:
          type:
          - string
          - 'null'
        emojis:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/EmojiResponse'
        emojis_ready_at:
          type:
          - string
          - 'null'
          format: date-time
        flow_id:
          $ref: '#/components/schemas/FlowIdResponse'
        id:
          type: string
          format: uuid
        owner_user_id:
          type: string
        requester_device_id:
          type:
          - string
          - 'null'
        requester_user_id:
          type: string
        shown_to_owner_at:
          type:
          - string
          - 'null'
          format: date-time
        state:
          type: string
          description: |-
            Domain state tag (`pending_dh_exchange` / `pending_owner` /
            `awaiting_remote_done` / `confirmed` / `cancelled`).
    VerificationListResponse:
      type: object
      description: |-
        Renamed S146 alongside `approvals::ApprovalListResponse` to
        avoid OpenAPI schema name collision (see that doc-comment).
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/VerificationApprovalResponse'
    VisitorMessageResponse:
      type: object
      description: |-
        Decisions 194, 196 — an entry a personal assistant kept for its owner
        about someone it does not answer: a message (under «Не отвечать»; no
        model read it, the person was told once that it went to the owner), or
        a missed call (under «Спрашивать меня» or «Не отвечать», from a person
        the owner has not approved).
      required:
      - id
      - kind
      - agent_id
      - visitor_mxid
      - room_id
      - body
      - created_at
      properties:
        agent_id:
          type: string
          format: uuid
          description: The assistant it was written to.
        body:
          type: string
          description: What they wrote, as written; empty for a `missed_call`.
        created_at:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
        kind:
          type: string
          description: |-
            `message` or `missed_call`. A plain string in the spec, so a client
            meeting a newer value decodes the hub and shows the entry as a generic
            one (decision 96).
          example: message
        room_id:
          type: string
          description: The one-to-one chat it was written in.
        visitor_mxid:
          type: string
          description: Who wrote it.
          example: '@bob:agent-x.pp.ua'
    VoiceLanguagesResponse:
      type: object
      description: ADR-0094 A.8 — the voice-translation catalog.
      required:
      - languages
      properties:
        languages:
          type: array
          items:
            $ref: '#/components/schemas/CatalogLanguage'
    VoiceSessionExportConsentEvent:
      type: object
      description: One consent-timeline event.
      required:
      - id
      - actor_kind
      - actor_mxid
      - room_id
      - metadata
      - occurred_at
      properties:
        actor_kind:
          type: string
        actor_mxid:
          type: string
        id:
          type: string
          format: uuid
        metadata:
          type: object
        occurred_at:
          type: string
          format: date-time
        room_id:
          type: string
        triggering_event_id:
          type:
          - string
          - 'null'
      additionalProperties: false
    VoiceSessionExportResponse:
      type: object
      description: |-
        Body of `GET /voice-sessions/{id}/export` (backend audit A10: the 200
        used to declare no body). The service renders it as JSON; these types
        are its documented shape, and `tests/voice_gdpr_db.rs` reads a real
        export back through them with unknown fields refused, so the two
        cannot drift apart silently.
      required:
      - session
      - transcripts
      - audit
      properties:
        audit:
          type: array
          items:
            $ref: '#/components/schemas/VoiceSessionExportConsentEvent'
          description: The call's consent timeline (`voice_consent_log`).
        session:
          $ref: '#/components/schemas/VoiceSessionExportSession'
        summary:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/VoiceSessionExportSummary'
            description: The call's summary, `null` when none was made.
        transcripts:
          type: array
          items:
            $ref: '#/components/schemas/VoiceSessionExportTranscript'
          description: |-
            Every line of the call, the owner's and everyone else's (decision
            68: a call's owner exports its whole transcript).
      additionalProperties: false
    VoiceSessionExportSession:
      type: object
      description: The session row, without the LiveKit JWT.
      required:
      - id
      - agent_id
      - room_id
      - call_id
      - state
      - voice_mode
      - attached_via_rest
      - was_room_member_before
      - created_at
      - updated_at
      properties:
        agent_id:
          type: string
          format: uuid
        attached_via_rest:
          type: boolean
        call_id:
          type: string
        consent_msg_event_id:
          type:
          - string
          - 'null'
        created_at:
          type: string
          format: date-time
        end_reason:
          type:
          - string
          - 'null'
        ended_at:
          type:
          - string
          - 'null'
          format: date-time
        id:
          type: string
          format: uuid
        leave_policy:
          type:
          - string
          - 'null'
        room_id:
          type: string
        started_at:
          type:
          - string
          - 'null'
          format: date-time
        state:
          type: string
          description: '`pending_consent` | `starting` | `active` | `ending` | `ended`.'
        updated_at:
          type: string
          format: date-time
        voice_mode:
          type: string
        was_room_member_before:
          type: boolean
      additionalProperties: false
    VoiceSessionExportSummary:
      type: object
      description: The call's summary.
      required:
      - id
      - session_id
      - structured
      - created_at
      properties:
        created_at:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
        session_id:
          type: string
          format: uuid
        structured:
          type: object
          description: Topics, decisions, action items, sentiment and the prose.
        summary_event_id:
          type:
          - string
          - 'null'
      additionalProperties: false
    VoiceSessionExportTranscript:
      type: object
      description: One transcript line.
      required:
      - id
      - speaker_mxid
      - speaker_role
      - content
      - started_at_ms
      - created_at
      properties:
        confidence:
          type:
          - number
          - 'null'
          format: double
        content:
          type: string
        created_at:
          type: string
          format: date-time
        ended_at_ms:
          type:
          - integer
          - 'null'
          format: int64
        id:
          type: string
          format: uuid
        speaker_mxid:
          type: string
        speaker_role:
          type: string
          description: '`human` | `agent`.'
        started_at_ms:
          type: integer
          format: int64
      additionalProperties: false
    VoiceSessionView:
      type: object
      description: |-
        Client-facing voice session shape — narrower than the domain
        [`VoiceSession`] (no LiveKit JWT, no internal call_id; the
        fields a mobile UI needs to render a session card).

        Kept here rather than reusing `VoiceSession` directly because:
          * `livekit_jwt` is a secret — never expose it.
          * `call_id` is internal MatrixRTC identity bookkeeping —
            callers should reference the session by our id only.
          * `mode_state` is intentionally `serde_json::Value` so the
            spec documents it as `Object`; per-mode typed schemas land
            if a mobile client needs them.
      required:
      - id
      - agent_id
      - agent_mxid
      - room_id
      - state
      - voice_mode
      - leave_policy
      - was_room_member_before
      - mode_state
      - created_at
      properties:
        agent_id:
          type: string
          format: uuid
        agent_mxid:
          type: string
        category:
          type:
          - string
          - 'null'
          description: |-
            With `end_reason` `category_paused`: the category whose cap ended
            it — `calls`, or `call_translation` when translating was the
            agent's only job. A plain string: a client meeting a newer one shows
            the generic reason.
        consent_msg_event_id:
          type:
          - string
          - 'null'
          description: |-
            Event ID of the consent disclosure Matrix message. `None`
            before consent is published.
        created_at:
          type: string
          format: date-time
        end_reason:
          type:
          - string
          - 'null'
          description: |-
            Set when the session ends: `call_ended` / `manual` / `timeout` /
            `crash` / `error` / `opt_out` (someone without AI consent joined or
            spoke) / `ai_consent_owner` (the owner has not allowed AI) /
            `ai_consent_room` (not everyone in the room has; names no one) /
            `budget_reached` (the agent's AI limit, before joining or
            mid-call) / `notice_failed` (the consent gate failed). Readable by the
            owner after the end (`GET /voice-sessions/{id}`), so a refused attach
            says why. `category_paused` (question 395): the cap of a category
            ended the agent's part of the call — `category` names it. A
            client meeting a newer value shows a generic reason.
        ended_at:
          type:
          - string
          - 'null'
          format: date-time
        id:
          type: string
          format: uuid
        leave_policy:
          type: string
          description: |-
            `call_end` / `stay` — what the agent does when the call ends.

            A plain string on the way OUT, deliberately, matching `state` and
            `voice_mode` beside it (audit A8-2). It used to be the closed
            generated enum, which meant a shipped mobile build meeting a newer
            backend that had added a third variant failed to decode the WHOLE
            list — one unknown string in one session, and the owner's entire
            Agent Center reported itself unavailable.

            Strict on the way in, tolerant on the way out: `AttachRequest`
            keeps the enum, because rejecting a value we cannot honour is the
            right answer to a bad request, while a response field the client
            never branches on has no business being able to break it.
          example: call_end
        mode_state:
          type: object
          description: |-
            Per-call mode payload — see `voice_sessions.mode_state`
            JSON in the spec (tagged-union: owner_assistant /
            silent_observer /
        room_id:
          type: string
        started_at:
          type:
          - string
          - 'null'
          format: date-time
        state:
          type: string
          description: |-
            DB-tag state: `pending_consent` / `pending_join` / `starting` /
            `active` / `ending` / `ended`.
          example: active
        voice_mode:
          type: string
          description: |-
            `assistant` / `silent` / `meeting` —
            behavioural mode at attach time.
        was_room_member_before:
          type: boolean
    WaitlistJoinRequest:
      type: object
      description: The sign-up.
      required:
      - email
      - lang
      properties:
        email:
          type: string
          description: |-
            An email address, at most 254 characters. Stored trimmed and
            lower-cased.
        lang:
          type: string
          description: 'The page''s language: `en` | `uk`.'
        website:
          type:
          - string
          - 'null'
          description: A honeypot people never see. Leave it out or empty.
    WaitlistJoinResponse:
      type: object
      description: The one success answer, for a new address, a repeat and a honeypot hit.
      required:
      - status
      properties:
        status:
          type: string
          description: Always `accepted`.
  securitySchemes:
    bearer_auth:
      type: http
      scheme: bearer
      description: MAS-issued bearer token. Accepts both opaque MAS access tokens (`mat_…`) and Matrix compat tokens (`mct_…` from `POST /_matrix/client/v3/login`).
tags:
- name: approvals
  description: Approval queue + decide + SSE stream
- name: me
  description: Caller-scoped endpoints (GDPR delete/export/memory)
- name: agents
  description: Agent archive + activity timeline + room join (the edit surface lives under agent-spaces)
- name: companies
  description: 'Public marketplace-seed reads: company directory + world-readable company card'
- name: users
  description: Public profile lookup (marketplace seed)
- name: verifications
  description: Owner-proxied cross-signing verification
- name: operator-voice-sessions
  description: OPERATOR/INTERNAL — voice session lifecycle; not part of the iOS client contract (Brief 0038 decision 3)
- name: outreach
  description: Cold-outreach queue management
- name: notifications
  description: Notifications hub (Brief 0041, ADR-0054) — needs-action union + activity feed + last-seen marker + unified SSE stream
- name: admin
  description: 'OPERATOR — the admin panel''s read-only API (Brief 0081): needs a MAS token with `urn:mas:admin`; every request is written to an access log; no content'
- name: waitlist
  description: 'PUBLIC — the spiral.md landing''s waitlist sign-up: no token, a strict per-IP limit, a body of 1 KiB, the same answer for a new and a repeated address'
- name: tools
  description: Unified Tool + Trigger API (Brief 0036 / ADR-0048) — arm / read / disable any typed Tool through the gate; the /controls* successor
- name: sync
  description: 'The app''s one change stream (decision 289, ADR-0092): `GET /sync?since=` over Server-Sent Events — ids of what changed and the values that are the same for everyone, from a resumable position'
- name: feed
  description: 'The public feed (Brief 0082, ADR-0091): Latest, one post, the caller''s and an author''s posts, text publishing through the rules, trust, links, limits and the severe filter, the caller''s standing, the rules acceptance and the author''s delete; likes, hides, flat comments with "replying to", the author''s comment switch and shares into Spiral chats (lane B3); reports with receipts, the caller''s notices (statements of reasons, report decisions) and the push settings per kind (lanes B4, B6); the caller''s activity (likes grouped, comments, replies), who liked a post (lane B6). What moves live: `GET /sync`. Every enumerated field is a plain string; `503 /errors/feed-unavailable` while the feed is off'
