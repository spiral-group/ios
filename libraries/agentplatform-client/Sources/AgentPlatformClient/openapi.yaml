        category:
          type: string
        reset_at:
          type:
          - string
          - 'null'
          format: date-time
          description: The latest reset of this category for everyone.
        spent_usd:
          type: string
          description: Spent in it this window, across everyone (USD).
    AdminInviteResponse:
