          description: 'Internal server error (`/errors/internal`): something the request depends on failed; the `detail` says no more'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - bearer_auth: []
  /api/v1/voice-sessions/{session_id}/controls/{control}/save-as-room-default:
    post:
      tags:
      - session-controls
      operationId: post_save_as_room_default
      parameters:
      - name: session_id
        in: path
        description: Voice session id
        required: true
        schema:
          type: string
      - name: control
        in: path
        description: Control kind tag (translation)
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Enabled override promoted to standing room Tools
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaveAsRoomDefaultResponse'
        '400':
          description: 'Request could not be read (`/errors/validation-failed`): a path parameter does not parse'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Missing or invalid bearer token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Caller does not own the session's agent
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Unknown session / control
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: '`/errors/tool-cap-reached`: the directions do not fit beside the room''s other tools (5 at most); `/errors/tool-duplicate`: two directions are the same tool. Nothing is changed'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '410':
          description: Session already ended
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: No enabled override to promote; `/errors/tool-does-not-fire-here` for a call in a 1:1 room (live translation runs in group calls only)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: 'Internal server error (`/errors/internal`): something the request depends on failed; the `detail` says no more'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - bearer_auth: []
  /api/v1/voice-sessions/{session_id}/export:
    get:
      tags:
      - operator-voice-sessions
      summary: Export a single voice session (GDPR Article 20 / right-of-access).
      description: |-
        Returns `{session, transcripts, summary, audit}` — the session row
        (no LiveKit JWT), every transcript line, the summary (or `null`) and
        the consent timeline. Records a surviving `gdpr_audit_log` row
        (`actor_kind = gdpr_export`). Sent with `Cache-Control: no-store`.
      operationId: export_handler
      parameters:
      - name: session_id
        in: path
        description: Voice session id (UUIDv7)
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: The session, its transcript, summary and consent timeline
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoiceSessionExportResponse'
        '400':
          description: 'Request could not be read (`/errors/validation-failed`): a path parameter does not parse'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Missing or invalid bearer token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Caller is not the session owner
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Voice session not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: 'Internal server error (`/errors/internal`): something the request depends on failed; the `detail` says no more'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - bearer_auth: []
components:
  schemas:
    AgentActivityEntry:
      type: object
      description: |-
        Wire DTO for one row of the agent's action-log timeline.

        1:1 mirror of [`crate::domain::agent_runtime::AgentActionLogEntry`]
        with redacted PII (the `input_redacted` JSON has already been
        hashed per the capability's `audit_redaction` rule on append).

        The shape is intentionally flat — every field is wire-stable.
        iOS / Element Web clients read it directly without needing
        schema translation. `Brief 0002 § API contract / AgentActivityEntry`
        pins this shape end-to-end.
      required:
      - id
      - agent_id
      - capability_name
      - input_redacted
      - reasoning_summary
      - policy_decision
      - policy_reason
      - outcome
      - created_at
      - step_index
      properties:
        agent_id:
          type: string
          format: uuid
        approval_id:
          type: string
          format: uuid
          description: |-
            The approval the owner decides when the decision needed their
            consent (`GET /approvals/{id}`). NULL on direct / denied /
            ignored paths.
        capability_name:
          type: string
          description: Stable capability identifier (e.g. `messenger.reply_in_room`).
        created_at:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
        input_redacted:
          type: object
          description: |-
            Redacted input bundle per the capability's `AuditRedaction`
            rule. Body / suggestion fields land here as
            `{"sha256":..., "len":...}`; IDs and structural fields are
            verbatim.
        long_flow_id:
          type: string
          format: uuid
          description: |-
            Phase 6 long-running-workflow link. NULL today (no callers
            in v1.0; reserved for v2.0).
        outcome:
          type: string
          description: |-
            Stable enum tag of the terminal outcome (`pending` /
            `executed` / `failed` / `declined` / `cancelled` /
            `denied` / `ignored`).
        outcome_event_id:
          type:
          - string
          - 'null'
          description: |-
            Matrix event id of the side effect, when the executor
            committed one. `None` while `outcome=pending`, and for
            terminal outcomes that don't produce a Matrix event
            (e.g. `denied`, `ignored`).
        policy_decision:
          type: string
          description: |-
            Stable enum tag (`allowed_direct` / `requires_owner_consent`
            / `denied` / `ignored`).
        policy_reason:
          type: string
          description: |-
            Stable `&'static str` reason identifier (e.g.
            `first_contact_with_unknown_visitor`).
        reasoning_summary:
          type: string
          description: |-
            Free-text reasoning trace emitted by the strategy. Capped at
            512 chars by domain layer.
        resolved_at:
          type:
          - string
          - 'null'
          format: date-time
          description: |-
            Timestamp the outcome was recorded. `None` while
            `outcome=pending`.
        room_id:
          type:
          - string
          - 'null'
          description: |-
            Matrix room id the action targeted, when known. `None` for
            roomless events (owner commands, voice-runtime callbacks).
        step_index:
          type: integer
          format: int32
          description: |-
            Brief 0003 — ordinal of this step inside a single inbound-
            event handling under the multi-step tool loop. `0` for
            pre-Brief-0003 rows and for any single-step strategy
            (`MessengerReplyStrategy`). iOS clients that haven't yet
            adopted this field render the timeline as before; clients
            that have can group consecutive rows with the same
            `(trigger, agent_id)` and ascending `step_index` visually.
    AgentActivityListResponse:
      type: object
      description: |-
        Paginated response envelope. `next_cursor` is `Some` only when
        the page returned `limit` items (more rows may exist on the
        next page); `None` ends the timeline.
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AgentActivityEntry'
        next_cursor:
          type:
          - string
          - 'null'
    AgentBlockedContactView:
      type: object
      description: One person the agent blocks.
      required:
      - contact_mxid
      - blocked_at
      properties:
        blocked_at:
          type: string
          format: date-time
          description: When the agent first blocked them.
        contact_mxid:
          type: string
          description: |-
            The person's MXID in its canonical form: what
            `DELETE /agents/{id}/blocks?contact_mxid=` takes.
          example: '@bob:agent-x.pp.ua'
        display_name:
          type:
          - string
          - 'null'
          description: |-
            Their Matrix display name when their profile could be read; absent
            otherwise (show the MXID).
    AgentBlocksResponse:
      type: object
      description: Response body of `GET /api/v1/agents/{id}/blocks`.
      required:
      - blocks
      properties:
        blocks:
          type: array
          items:
            $ref: '#/components/schemas/AgentBlockedContactView'
          description: Newest block first.
        next_cursor:
          type:
          - string
          - 'null'
          description: Set only when the page filled `limit` entries (more may follow).
    AgentCardResponse:
      type: object
      required:
      - agent_id
      - matrix_user_id
      - display_name
      - kind
      - visibility
      - lifecycle_state
      - presence
      - room_count
      - active_tool_count
      - paused
      properties:
        active_tool_count:
          type: integer
          format: int64
        agent_id:
          type: string
          format: uuid
        avatar_mxc:
          type:
          - string
          - 'null'
        display_name:
          type: string
        kind:
          type: string
          example: personal_assistant
        lifecycle_state:
          type: string
          example: active
        matrix_user_id:
          type: string
          example: '@assistant-alice:agent-x.pp.ua'
        owner_user_id:
          type:
          - string
          - 'null'
        paused:
          type: boolean
          description: |-
            Decision 194 — the owner paused the agent (`lifecycle_state:
            suspended`): «На паузе».
        presence:
          type: string
          description: Coarse "recently active" flag (not Matrix presence).
          example: online
        room_count:
          type: integer
          format: int64
        visibility:
          type: string
          description: |-
            Whether the agent is shown in search: `public` — found by people
            search and on its person's public profile (`GET /users/{mxid}`);
            `private` — in neither. It does NOT decide who may write to the
            agent: anyone who has its address can, and what it does with them
            is the personal assistant's `visitor_policy` (decision 194).
          example: public
    AgentDetailResponse:
      type: object
      required:
      - agent_id
      - matrix_user_id
      - kind
      - organization_id
      - display_name
      - visibility
      - lifecycle_state
      - config_version_id
      - config_version_number
      - room_count
      - active_tool_count
      - paused
      properties:
        active_tool_count:
          type: integer
          format: int64
        agent_id:
          type: string
          format: uuid
        avatar_mxc:
          type:
          - string
          - 'null'
        config_version_id:
          type: string
          format: uuid
        config_version_number:
          type: integer
          format: int32
        display_name:
          type: string
        kind:
          type: string
          example: personal_assistant
        lifecycle_state:
          type: string
          example: active
        matrix_user_id:
          type: string
          example: '@assistant-alice:agent-x.pp.ua'
        organization_id:
          type: string
          format: uuid
        owner_user_id:
          type:
          - string
          - 'null'
        paused:
          type: boolean
          description: |-
            Decision 194 — the owner paused the agent (`lifecycle_state:
            suspended`): it acts for nobody until resumed.
        persona:
          $ref: '#/components/schemas/AgentPersonaResponse'
          description: |-
            Persona block for `personal_assistant` agents (Brief 0038 S2 —
            the read-model is the ONLY read; no more raw-config digging).
            Direct `$ref` for the same generator reason as
            `EditAgentRequest.persona`.
        role_brief:
          type:
          - string
          - 'null'
          description: Role brief for company-role agents (`sales`/`outreach`/`support`).
        room_count:
          type: integer
          format: int64
        visibility:
          type: string
          description: |-
            Whether the agent is shown in search: `public` — found by people
            search and on its person's public profile (`GET /users/{mxid}`);
            `private` — in neither. It does NOT decide who may write to the
            agent: anyone who has its address can, and what it does with them
            is the personal assistant's `visitor_policy` (decision 194).
          example: public
        voice_language:
          type:
          - string
          - 'null'
          description: |-
            Decision 193 — personal assistants that take calls: the language
            their calls are transcribed and summarised in, `uk` | `ru` | `en`
            (what `PATCH` `voice_language` sets). Absent for other kinds and for
            an assistant without voice. A client meeting another value shows it
            as not set.
          example: ru
    AgentEditSchemaResponse:
      type: object
      required:
      - agent_id
      - kind
      - profile_schema
      properties:
        agent_id:
          type: string
          format: uuid
        kind:
          type: string
          example: personal_assistant
        persona_schema:
          type: object
          description: |-
            JSON Schema for the persona form — present only for agents that carry
            a persona (personal assistants).
        profile_schema:
          type: object
          description: JSON Schema for the profile form (display_name / avatar / visibility).
        voice_schema:
          type: object
          description: |-
            JSON Schema for the voice form (decision 193: `voice_language`,
            enum `uk` / `ru` / `en`) — present only for personal assistants that
            take calls.
    AgentPersonaResponse:
      type: object
      description: |-
        Persona block on the canonical read-model. Field set mirrors the
        published `AgentPersonaEdit` schema section plus the read-only extras
        the editor renders.
      required:
      - owner_display_name
      - tone
      - greeting
      - visitor_greeting
      - visitor_policy
      properties:
        greeting:
          type: string
        model:
          type:
          - string
          - 'null'
        owner_display_name:
          type: string
        timezone:
          type:
          - string
          - 'null'
        tone:
          type: string
        tool_use_enabled:
          type:
          - boolean
          - 'null'
        visitor_greeting:
          type: string
        visitor_policy:
          type: string
          description: |-
            Decision 194 — `ask_first` | `reply` | `off` (see
            `PersonaPatchBody.visitor_policy`). A client meeting another value
            shows the setting as unknown and does not offer to change it.
          example: ask_first
    AgentRoomEntryResponse:
      type: object
      required:
      - room_id
      - kind
      - active_tools
      properties:
        active_tools:
          type: array
          items:
            $ref: '#/components/schemas/AgentRoomToolResponse'
        display_name:
          type:
          - string
          - 'null'
        kind:
          type: string
          example: dm
        room_id:
          type: string
    AgentRoomToolResponse:
      type: object
      required:
      - tool_id
      - tool_kind
      - target_languages
      - trigger_kind
      - audience
      - audience_members
      - params_summary
      - trigger_summary
      properties:
        audience:
          type: string
          description: |-
            Whom it applies to (the senders of `on_message`, the speakers of
            `on_voice_call`): `anyone`, `non_self_non_owner` (everyone but the
            owner), `owner_only`, `specific_senders` or `everyone_except` — the
            tags of the trigger's `AudienceScope`. A client meeting another value
            shows the tool without an audience label.
          example: anyone
        audience_members:
          type: array
          items:
            type: string
          description: |-
            MXIDs named by `specific_senders` / `everyone_except`; empty for the
            other audiences.
        params_summary:
          type: string
          description: |-
            English debugging hint, not for display: label the tool from
            `tool_kind` and `target_languages`.
          example: Translate → en
        target_languages:
          type: array
          items:
            type: string
          description: |-
            Canonical provider codes for `translate` / `live_translate`; empty for
            non-translation tools. Presentation belongs to the client locale.
        tool_id:
          type: string
        tool_kind:
          type: string
          example: translate
        trigger_kind:
          type: string
          description: |-
            When the tool fires: `on_message` or `on_voice_call` (the trigger
            discriminant `GET /rooms/{room_id}/tools` sends). A client meeting
            another value shows the tool without a trigger label.
          example: on_message
        trigger_summary:
          type: string
          description: |-
            English debugging hint, not for display: label the trigger from
            `trigger_kind`, `audience` and `audience_members`.
          example: on message · everyone except me
    AgentRoomViewResponse:
      type: object
      required:
      - agent_id
      - rooms
      properties:
        agent_id:
          type: string
          format: uuid
        rooms:
          type: array
          items:
            $ref: '#/components/schemas/AgentRoomEntryResponse'
    AgentSpaceDetailResponse:
      type: object
      required:
      - org_id
      - name
      - kind
      - owner_user_id
      - agents
      properties:
        agents:
          type: array
          items:
            $ref: '#/components/schemas/AgentCardResponse'
        avatar_mxc:
          type:
          - string
          - 'null'
        create_schema:
          type: object
          description: |-
            JSON Schema for the create-role-agent form (Brief 0037 / ADR-0049).
            Present only for company spaces — the create form opens before an
            agent exists, so its schema is org-scoped, not agent-scoped.
        description:
          type:
          - string
          - 'null'
        industry:
          type:
          - string
          - 'null'
        kind:
          type: string
          example: company
        name:
          type: string
        org_id:
          type: string
          format: uuid
        owner_user_id:
          type: string
          description: Owner MXID (whoever created / owns the space).
        website:
          type:
          - string
          - 'null'
    AgentSpaceSummaryResponse:
      type: object
      required:
      - org_id
      - name
      - kind
      - agent_count
      properties:
        agent_count:
          type: integer
          format: int64
        avatar_mxc:
          type:
          - string
          - 'null'
        kind:
          type: string
          description: '`"solo"` (the Personal space) or `"company"`.'
          example: company
        name:
          type: string
        org_id:
          type: string
          format: uuid
    AgentUsageResponse:
      type: object
      required:
      - today
      - days
      properties:
        days:
          type: array
          items:
            $ref: '#/components/schemas/UsageDayResponse'
          description: 30 days, newest first, today included.
        today:
          $ref: '#/components/schemas/UsageTodayResponse'
    AiConsentRequest:
      type: object
      required:
      - granted
      properties:
        granted:
          type: boolean
          description: |-
            `true` agrees to the disclosure in force, `false` declines or
            withdraws.
    AiConsentResponse:
      type: object
      description: The caller's consent as the server applies it.
      required:
      - granted
      - current_version
      properties:
        current_version:
          type: string
          description: |-
            The disclosure the app must show; a grant of an older version no
            longer counts, so the app asks again.
        decided_at:
          type:
          - string
          - 'null'
          format: date-time
        decided_version:
          type:
          - string
          - 'null'
          description: The version of the caller's latest decision, if any.
        granted:
          type: boolean
          description: |-
            Whether AI may process the caller's data now: their latest decision
            is a grant of `current_version`.
    ApprovalListResponse:
      type: object
      description: |-
        Renamed S146 from `ListResponse` → `ApprovalListResponse` to
        avoid an OpenAPI schema name collision with `verifications::
        ListResponse`. swift-openapi-generator's idiomatic naming
        folds both to `Components.Schemas.ListResponse` and picks one
        arbitrarily, which breaks codegen consumers. Per-module
        prefixing is the boring fix and matches the rest of the
        `<Resource>Response` convention already used here.
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ApprovalResponse'
        next_cursor:
          type:
          - string
          - 'null'
          description: |-
            R3.3.d cursor for the next page. `None` when the result
            set is exhausted.
    ApprovalResponse:
      type: object
      description: |-
        Approval shape returned to clients. Differs from the domain
        [`Approval`] only in being self-contained (no lifetimes, no internal
        fields like `context_snapshot`'s embedded `_owner_user_id` marker —
        see the Postgres adapter for that detail).
      required:
      - id
      - tenant_id
      - agent_id
      - config_version_id
      - owner_user_id
      - draft_body
      - target_room_id
      - triggering_event_id
      - state
      - context_snapshot
      - created_at
      - updated_at
      properties:
        agent_id:
          type: string
          format: uuid
        config_version_id:
          type: string
          format: uuid
        context_snapshot:
          type: object
          description: |-
            Free-form JSON context captured at draft time (sanitised:
            internal book-keeping keys are stripped).
        created_at:
          type: string
          format: date-time
        decided_at:
          type:
          - string
          - 'null'
          format: date-time
        decided_by:
          type:
          - string
          - 'null'
          description: |-
            MXID of the actor who decided this approval (set once
            `state` leaves `pending`).
        draft_body:
          type: string
          description: |-
            Draft body the agent proposes to send; the owner can edit it
            via `POST /approvals/{id}/decide` with `action = edit`.
        escalation_reason:
          type:
          - string
          - 'null'
          description: Why the agent escalated to approval (set by escalation rules).
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
          description: When the approval auto-expires unless decided.
        id:
          type: string
          format: uuid
        outcome_event_id:
          type:
          - string
          - 'null'
          description: |-
            Event id of the final on-the-wire message, when delivery
            succeeded.
        owner_user_id:
          type: string
          description: Owner MXID (e.g. `@alice:agent-x.pp.ua`).
          example: '@alice:agent-x.pp.ua'
        state:
          $ref: '#/components/schemas/ApprovalStateResponse'
        target_room_id:
          type: string
          description: Matrix room the message will land in once approved.
          example: '!RoomId:agent-x.pp.ua'
        tenant_id:
          type: string
          format: uuid
        triggering_event_id:
          type: string
          description: Event id that triggered the agent to draft this reply.
        updated_at:
          type: string
          format: date-time
    ApprovalStateResponse:
      oneOf:
      - type: object
        required:
        - status
        properties:
          status:
            type: string
            enum:
            - pending
      - type: object
        required:
        - status
        properties:
          status:
            type: string
            enum:
            - approved
      - type: object
        required:
        - status
        properties:
          status:
            type: string
            enum:
            - rejected
      - type: object
        required:
        - new_body
        - status
        properties:
          new_body:
            type: string
          status:
            type: string
            enum:
            - edited
      - type: object
        required:
        - status
        properties:
          status:
            type: string
            enum:
            - expired
      description: |-
        Client-facing state shape. Mirrors [`ApprovalState`] but uses a
        stable, lowercase string tag on the wire (`status`) matching the DB
        enum column values. `edited` carries the new body; everything else
        is status-only.
    ArmToolRequest:
      type: object
      description: '`POST /tools` request — the typed WHAT + WHEN.'
      required:
      - params
      - trigger
      properties:
        params:
          type: object
          description: The typed tool params (`ToolParams`, tagged by `kind`).
        replaces_tool_id:
          type:
          - string
          - 'null'
          description: |-
            An edit: the id of one of this agent's active tools in this room
            that the new one replaces. It is turned off in the same transaction
            as the insert, so an edit works when the room is at the cap and an
            unchanged edit is not refused as a duplicate. If it is no longer one
            (turned off meanwhile, unknown, or another agent's) the arm is
            refused with `409 /errors/tool-replaced-gone` and nothing changes.
        trigger:
          type: object
          description: The typed trigger (`TriggerKind`, tagged by `kind`).
    AttachControlWrite:
      type: object
      description: One attach-time control write.
      required:
      - state
      properties:
        params:
          type:
          - object
          - 'null'
          description: |-
            Typed `SessionControlParams` (required iff
            `state == "enabled"` on `translation`; must be absent for
            `recording` / `summary`).
        state:
          type: string
          description: '`enabled` | `disabled` | `inherit`.'
    AttachControlsRequest:
      type: object
      description: |-
        Brief 0055 — initial control overrides at attach. Each entry
        mirrors one `PUT /controls/{control}` write, minus the CAS
        revision (there is no row yet; every write is revision 0).
      properties:
        conversation:
          $ref: '#/components/schemas/AttachControlWrite'
          description: |-
            Decision 180 — the owner's Conversation switch for this call.
            `state: enabled | disabled | inherit`, params must be absent.
            The session starts silent as the call's own rule says (Brief 0058);
            once its runtime is live the orchestrator applies this through the
            same `session.set_control` path as
            `PUT /voice-sessions/{id}/controls/conversation`. `inherit` (or
            absent) writes nothing: the call's own rule, so the owner's own
            chat with the agent still talks. `enabled` together with an
            enabled `translation` is refused (422): the interpreter is its own
            mode.
        recording:
          $ref: '#/components/schemas/AttachControlWrite'
          description: '`state: enabled | disabled` — params must be absent.'
        summary:
          $ref: '#/components/schemas/AttachControlWrite'
          description: '`state: enabled | disabled` — params must be absent.'
        translation:
          $ref: '#/components/schemas/AttachControlWrite'
          description: |-
            `state: enabled` requires typed `params`
            (`{"kind":"translation","directions":[…],"style":…}`).
    AttachRequest:
      type: object
      description: |-
        Request body. `leave_policy` defaults to `"call_end"` per
        DECISIONS Session 60.
      required:
      - room_id
      properties:
        controls:
          $ref: '#/components/schemas/AttachControlsRequest'
          description: |-
            Brief 0055 — initial session-scoped control overrides, applied
            BEFORE the session starts. This is the "add the agent to THIS
            call configured like this" surface: the in-call sheet posts the
            chosen functions here so the session starts as an interpreter /
            without recording / etc. regardless of the room's armed Tools.
            Absent = the pre-0055 behaviour (armed room Tools decide).
        leave_policy:
          $ref: '#/components/schemas/LeavePolicyJson'
        room_id:
          type: string
          example: '!Abc:agent-x.pp.ua'
    AttachResponse:
      type: object
      required:
      - session_id
      - agent_mxid
      - room_id
      - state
      - leave_policy
      - call_in_progress
      properties:
        agent_mxid:
          type: string
        call_in_progress:
          type: boolean
          description: |-
            `true` iff a Matrix call is currently in progress in the
            target room. UI hint only — soft-failure path returns
            `false` on probe error.
        leave_policy:
          type: string
          description: |-
            `call_end` / `stay` — what the agent does when the call ends.

            A plain string on the way OUT, deliberately, matching `state` and
            `voice_mode` beside it (audit A8-2). It used to be the closed
            generated enum, which meant a shipped mobile build meeting a newer
            backend that had added a third variant failed to decode the WHOLE
            list — one unknown string in one session, and the owner's entire
            Agent Center reported itself unavailable.

            Strict on the way in, tolerant on the way out: `AttachRequest`
            keeps the enum, because rejecting a value we cannot honour is the
            right answer to a bad request, while a response field the client
            never branches on has no business being able to break it.
          example: call_end
        room_id:
          type: string
        session_id:
          type: string
          format: uuid
        state:
          type: string
          description: |-
            `pending_consent` initially; later transitions through `pending_join`,
            `starting`, `active`, `ending`, and `ended`.
          example: pending_consent
    BoothView:
      type: object
      description: |-
        One effective translation booth: WHO is translated → into WHICH
        languages (ADR-0075 D2). The read-side twin of one
        `TranslationDirection` / one engine `LiveTranslationRule`.
      required:
      - speaker_scope
      - speaker_members
      - target_languages
      properties:
        speaker_members:
          type: array
          items:
            type: string
          description: Concrete MXIDs for the member scopes; empty otherwise.
        speaker_scope:
          type: string
          description: |-
            `anyone` | `non_self_non_owner` | `owner_only` |
            `specific_senders` | `everyone_except`.
        target_languages:
          type: array
          items:
            type: string
          description: Languages this speaker's listeners get.
    CallArtifactsView:
      type: object
      description: |-
        Brief 0055 — the session's live call-artifact flags (the same
        booleans that gate the post-call recording publisher + summary
        worker). The in-call panel renders its Recording/Summary rows from
        this, not from override rows (which may be absent when the flags
        came from armed room Tools).
      required:
      - recording_enabled
      - summary_enabled
      - recording_stopped
      - recording_segment_count
      - recording_segments_pending
      - recording_segments_delivered
      - recording_segments_failed
      properties:
        latest_recording_segment_id:
          type:
          - string
          - 'null'
        latest_recording_segment_ordinal:
          type:
          - integer
          - 'null'
          format: int32
        recording_delivery:
          type:
          - string
          - 'null'
          description: |-
            Brief 0056 — where each artifact is on its way to the room:
            `pending` | `delivered` | `failed`. The panel renders this so
            the owner is never left wondering whether the recording is
            coming; `null` when the artifact is not armed for this session.
        recording_delivery_target:
          type:
          - string
          - 'null'
          description: |-
            Brief 0057 — WHERE a delivered artifact landed: `room` or
            `owner_dm` (the fallback). `delivered` alone was ambiguous — the
            panel could claim "posted in this room" while the room had
            nothing.
        recording_enabled:
          type: boolean
        recording_segment_count:
          type: integer
          description: Segment-level aggregate for stop/resume capture cycles.
          minimum: 0
        recording_segments_delivered:
          type: integer
          minimum: 0
        recording_segments_failed:
          type: integer
          minimum: 0
        recording_segments_pending:
          type: integer
          minimum: 0
        recording_stopped:
          type: boolean
          description: |-
            Brief 0056 — the capture was stopped mid-call (dictaphone
            semantics: what was captured is published right away).
        summary_delivery:
          type:
          - string
          - 'null'
        summary_delivery_target:
          type:
          - string
          - 'null'
        summary_enabled:
          type: boolean
    CatalogLanguage:
      type: object
      description: |-
        A selectable translation language in the catalog (Brief 0047 / ADR-0062).
        `code` is the canonical provider wire value a client sends unchanged in
        `target_language` / `target_languages`, including required script/region
        casing. `display_name` is an English fallback; clients should localise the
        BCP-47 identifier for presentation.
      required:
      - code
      - display_name
      properties:
        code:
          type: string
        display_name:
          type: string
    CompanyListResponse:
      type: object
      required:
      - items
      - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CompanyResponse'
        total:
          type: integer
          minimum: 0
    CompanyResponse:
      type: object
      required:
      - id
      - name
      - kind
      - owner_user_id
      - lifecycle_state
      - created_at
      - updated_at
      properties:
        branding_mxc:
          type:
          - string
          - 'null'
        created_at:
          type: string
          format: date-time
        description:
          type:
          - string
          - 'null'
        id:
          type: string
          format: uuid
        industry:
          type:
          - string
          - 'null'
        kind:
          type: string
          example: company
        lifecycle_state:
          type: string
          example: active
        name:
          type: string
        owner_user_id:
          type: string
        tenant_id:
          type: string
          format: uuid
          description: |-
            Private to the caller for creation responses; elided when the
            viewer is not a member (directory listing / fetch-by-stranger).
        updated_at:
          type: string
          format: date-time
        website:
          type:
          - string
          - 'null'
    ConfirmRequest:
      type: object
      description: |-
        Confirm body. `comparison_acknowledged` **must** be `true` — this
        is the strict-SAS gate documented in the design doc.
      properties:
        comparison_acknowledged:
          type: boolean
          description: |-
            Must be `true`. Explicit owner consent — required gate
            before signing on behalf of the agent.
          example: true
    ContactBlockView:
      type: object
      description: One of the caller's agents that blocks the person.
      required:
      - agent_id
      - agent_mxid
      - agent_name
      - blocked_at
      properties:
        agent_id:
          type: string
          format: uuid
        agent_mxid:
          type: string
        agent_name:
          type: string
        blocked_at:
          type: string
          format: date-time
          description: The earliest block across the forms of the person's MXID.
    ContactBlocksResponse:
      type: object
      description: Response body of `GET /api/v1/me/blocks`.
      required:
      - contact_mxid
      - blocks
      properties:
        blocks:
          type: array
          items:
            $ref: '#/components/schemas/ContactBlockView'
        contact_mxid:
          type: string
          description: The person's MXID in its canonical form.
    ContactErasureCountsBody:
      type: object
      description: |-
        What an erasure of a contact removed from agents' data. Wire mirror
        of [`GdprContactErasureCounts`].
      required:
      - memory_entries
      - relationships
      - transcript_lines
      - outreach_targets
      - approvals
      - key_relay_rows
      - action_log_entries_scrubbed
      - session_controls_scrubbed
      - invite_redemptions_scrubbed
      - verifications
      - tool_scopes_rewritten
      - tools_turned_off
      properties:
        action_log_entries_scrubbed:
          type: integer
          format: int32
          description: |-
            Action-log entries whose recorded input named the contact; the
            name is removed, the entry stays.
          minimum: 0
        approvals:
          type: integer
          format: int32
          description: |-
            Approvals about the contact (a first contact from them, outreach
            to them); a pending one is cancelled.
          minimum: 0
        invite_redemptions_scrubbed:
          type: integer
          format: int32
          description: |-
            Invite seats the contact took; their name is removed, the seat
            stays counted.
          minimum: 0
        key_relay_rows:
          type: integer
          format: int32
          description: Key-relay audit rows naming the contact's devices.
          minimum: 0
        memory_entries:
          type: integer
          format: int32
          description: Memory entries about the contact.
          minimum: 0
        outreach_targets:
          type: integer
          format: int32
          description: Outreach to the contact.
          minimum: 0
        relationships:
          type: integer
          format: int32
          description: The agents' relationships with the contact.
          minimum: 0
        session_controls_scrubbed:
          type: integer
          format: int32
          description: Call controls the contact last changed; their name is removed.
          minimum: 0
        tool_scopes_rewritten:
          type: integer
          format: int32
          description: |-
            Room tools whose sender / speaker list named the contact; the
            contact is removed from the list.
          minimum: 0
        tools_turned_off:
          type: integer
          format: int32
          description: |-
            Of those, active tools turned off: the list emptied, or the tool
            became identical to another active one in the room.
          minimum: 0
        transcript_lines:
          type: integer
          format: int32
          description: Lines the contact spoke in the agents' calls.
          minimum: 0
        verifications:
          type: integer
          format: int32
          description: Device verifications the contact requested of the agents, deleted.
          minimum: 0
    ControlCatalogEntry:
      type: object
      description: |-
        One control kind's descriptor + params schema, as the client's
        schema-driven control panel renders it (ADR-0071 D4).
      required:
      - control
      - mutable_mid_call
      - mid_call_mutability
      - apply_scope
      - consent_class
      - supports_audience_scope
      - visible_to_participants
      properties:
        apply_scope:
          type: string
          description: '`hot` | `generation_restart`.'
        consent_class:
          type: string
          description: '`none` | `notice` | `explicit`.'
        control:
          type: string
        mid_call_mutability:
          type: string
          description: 'Brief 0055 asymmetric vocabulary: `full` | `disable_only`.'
        mutable_mid_call:
          type: boolean
          description: |-
            Wire-compat boolean: `true` only for fully mutable controls.
            Prefer `mid_call_mutability`.
        supports_audience_scope:
          type: boolean
        visible_to_participants:
          type: boolean
    ControlSetResponse:
      type: object
      description: Body returned by every SET that applies synchronously.
      required:
      - status
      - action_log_id
      properties:
        action_log_id:
          type: string
          description: The `agent_action_log` row id for this control change.
        status:
          type: string
          description: |-
            `applied` when the gate executed the action, `awaiting_consent`
            when PolicyEngine escalated to owner consent.
    ConversationView:
      type: object
      description: |-
        Brief 0080 — the owner's Conversation / Silent switch, read from the
        session's live mode (so a voice "just listen" shows here too).
      required:
      - active
      - available
      - revision
      properties:
        active:
          type: boolean
          description: The assistant talks in this call (mode `owner_assistant`).
        available:
          type: boolean
          description: 'The switch can be used: false while the call runs the interpreter.'
        revision:
          type: integer
          format: int32
          description: CAS token for the next `conversation` write (0 = no override yet).
    CreateAgentSpaceRequest:
      type: object
      description: |-
        Create a company space (was `POST /companies`; the Phase-3
        `POST /organizations` foot-gun — solo-kind org with no membership row —
        is deleted outright).
      required:
      - name
      properties:
        branding_mxc:
          type:
          - string
          - 'null'
        description:
          type:
          - string
          - 'null'
        industry:
          type:
          - string
          - 'null'
        name:
          type: string
          example: Acme Corp
        website:
          type:
          - string
          - 'null'
    CreateCompanyRequest:
      type: object
      required:
      - name
      properties:
        branding_mxc:
          type:
          - string
          - 'null'
        description:
          type:
          - string
          - 'null'
        industry:
          type:
          - string
          - 'null'
        name:
          type: string
          example: Acme Corp
        website:
          type:
          - string
          - 'null'
    CreateSpaceAgentRequest:
      type: object
      description: |-
        Provision a role agent inside a company space (was
        `POST /companies/{id}/agents`). Now accepts `role_brief` in the same
        request — the published create-schema form is submittable as one call.
      required:
      - role
      properties:
        display_name:
          type:
          - string
          - 'null'
          description: Optional display-name override; default `"<Company> <Role>"`.
        role:
          type: string
          description: One of `sales` / `outreach` / `support`.
          example: sales
        role_brief:
          type:
          - string
          - 'null'
          description: |-
            What this agent is for, in the owner's words (published bounds
            enforced).
        slug:
          type:
          - string
          - 'null'
          description: Optional slug override (`^[a-z][a-z0-9-]*$`, ≤32).
    DecideRequest:
      oneOf:
      - type: object
        required:
        - action
        properties:
          action:
            type: string
            enum:
            - approve
      - type: object
        required:
        - action
        properties:
          action:
            type: string
            enum:
            - reject
      - type: object
        required:
        - new_body
        - action
        properties:
          action:
            type: string
            enum:
            - edit
          new_body:
            type: string
      description: |-
        Decide payload. `action` is one of `"approve"`, `"reject"`, `"edit"`.
        `new_body` is required when `action == "edit"` and ignored otherwise.
    DecideResponse:
      type: object
      description: |-
        Response payload. `delivery` describes what happened with the final
        Matrix message (if any); `approval` is the post-image.
      required:
      - approval
      - delivery
      properties:
        approval:
          $ref: '#/components/schemas/ApprovalResponse'
        delivery:
          $ref: '#/components/schemas/DeliveryResponse'
    DeleteMeResponse:
      type: object
      description: |-
        Response body for `DELETE /api/v1/me`. We deliberately return a
        200 + body rather than a 204 because the cascade counts are useful
        for clients (mobile apps showing "your data has been deleted: N
        transcripts, M sessions, ..."). RFC 7231 § 6.3.5 forbids a body
        on 204; 200 is the right shape when there's a body to deliver.
      required:
      - status
      - counts
      properties:
        counts:
          $ref: '#/components/schemas/PurgeCountsBody'
        status:
          type: string
          description: Always `"purged"` on success.
          example: purged
    DeleteMemoryResponse:
      type: object
      description: |-
        Response body for `DELETE /api/v1/me/memory`. Returns the counts so a
        client UI can show what was erased; the idempotent re-call returns
        zeros rather than 404.
      required:
      - status
      - contact_mxid
      - deleted_count
      - erased
      properties:
        contact_mxid:
          type: string
          description: |-
            The contact MXID whose data was erased, as given (trimmed), echoed
            for the client. The audit row does not keep it.
          example: '@bob:agent-x.pp.ua'
        deleted_count:
          type: integer
          format: int32
          description: Memory entries erased (`erased.memory_entries`). Zero is valid.
          minimum: 0
        erased:
          $ref: '#/components/schemas/ContactErasureCountsBody'
          description: Everything erased about the contact across the caller's agents.
        status:
          type: string
          description: |-
            Always `"purged"` on success (even when nothing was erased, to
            keep the idempotent re-call shape predictable).
          example: purged
    DeliveryResponse:
      oneOf:
      - type: object
        description: The approval was rejected — no message was sent.
        required:
        - kind
        properties:
          kind:
            type: string
            enum:
            - not_sent
      - type: object
        description: The agent's message landed in the target room.
        required:
        - event_id
        - kind
        properties:
          event_id:
            type: string
          kind:
            type: string
            enum:
            - sent
      - type: object
        description: |-
          The decision was recorded but the final send failed. Callers
          with a UI should surface this prominently; the user may want to
          re-run the decide later or fix the underlying issue.
        required:
        - reason
        - kind
        properties:
          kind:
            type: string
            enum:
            - send_failed
          reason:
            type: string
      - type: object
        description: |-
          The decision was recorded, but the standard delivery path was
          skipped because the approval carried a specialised-delivery
          context (e.g. cold-outreach). The caller (REST handler) drove
          the specialised delivery after receiving this from the domain
          service; the final on-the-wire response replaces this variant
          with the specialised path's Sent / SendFailed outcome before
          serialisation. A `deferred` response that reaches the client
          would indicate the specialised-dispatch glue failed to fire,
          which is a server-side bug.

          The inner field is serialised as `deferred_kind` because the
          outer envelope already uses `kind` as the tag.
        required:
        - deferred_kind
        - kind
        properties:
          deferred_kind:
            type: string
          kind:
            type: string
            enum:
            - deferred
      - type: object
        description: |-
          The approved action was carried out and sends no message: a block
          request (`context_snapshot.kind = "block_sender"`, decision 38) —
          the contact is blocked.
        required:
        - kind
        properties:
          kind:
            type: string
            enum:
            - applied
    EditAgentRequest:
      type: object
      description: |-
        The single agent-edit request. Field groups mirror the published
        edit-schema exactly (ADR-0049 enforcement: the schemable types validate
        the write): `display_name` + `visibility` from the profile section,
        `persona` (whole group, PA-only), `role_brief` (company-role-only).
        `tool_use_enabled` / `model` / `timezone` are the persona editor's
        read-only-schema extras (kept writable for the PA editor toggles; their
        current values arrive on the read-model persona block).

        Replaces the four scattered PATCHes (`/agents/{id}` raw-config,
        `/persona`, `/visibility`, `/role-brief`) and their three different
        auth predicates with one endpoint behind THE ownership predicate.
      properties:
        avatar_mxc:
          type:
          - string
          - 'null'
          description: |-
            Agent avatar as an `mxc://` content URI. The client uploads the
            image itself through the Matrix SDK (Brief 0039 decision 5 —
            media is client-side, mirroring how Element rooms handle
            avatars) and hands us the resulting URI; the domain service
            pushes it to the agent's Synapse profile. Empty string clears
            the avatar. Replaces the deleted `POST /agents/{id}/avatar`
            route (ADR-0050: this PATCH is THE only config write).
          example: mxc://agent-x.pp.ua/AbCdEf
        display_name:
          type:
          - string
          - 'null'
        model:
          type:
          - string
          - 'null'
          description: |-
            Empty string clears the override (falls back to the deployment
            default model).
        paused:
          type:
          - boolean
          - 'null'
          description: |-
            Decision 194 — any kind: `true` pauses the agent (it replies to
            nobody, fires no tools, runs no scheduled actions, joins no calls,
            sends no outreach; approving its cards is refused with 409
            `/errors/agent-paused`), `false` resumes it. 409 for an archived
            agent.
        persona:
          $ref: '#/components/schemas/PersonaPatchBody'
          description: |-
            Persona group — fields from the published `AgentPersonaEdit`
            schema section, each optional (partial patch; the domain service
            keeps absent fields). 409 for non-PA kinds.

            `value_type` pins a direct `$ref` (not `oneOf [null, $ref]`) —
            swift-openapi-generator skips nullable-oneOf schemas entirely,
            which silently dropped this field from the iOS client.
        role_brief:
          type:
          - string
          - 'null'
          description: 409 for kinds that aren't a company role.
        timezone:
          type:
          - string
          - 'null'
          description: IANA tag; empty string clears back to the deployment default.
        tool_use_enabled:
          type:
          - boolean
          - 'null'
        visibility:
          type:
          - string
          - 'null'
          description: |-
            Whether the agent is shown in search: `public` — found by people
            search and on its person's public profile (`GET /users/{mxid}`);
            `private` — in neither. It does NOT decide who may write to the
            agent: anyone who has its address can, and what it does with them
            is the personal assistant's `visitor_policy` (decision 194).
          example: private
        voice_language:
          type:
          - string
          - 'null'
          description: |-
            Decision 193 — the language a personal assistant's calls are
            transcribed and summarised in: `uk` | `ru` | `en` (the enum in the
            edit-schema's `voice_schema`). 409 for other kinds and for an
            assistant that takes no calls.
          example: ru
    EffectiveControlView:
      type: object
      description: |-
        The effective (resolved) translation config of the session.

        ADR-0075 D5 — the FULL booth list, never a flattened projection.
        The previous shape (`audience` = first rule's tag + a languages
        union) dropped `specific_senders` members entirely and could not
        represent two booths, so a multi-booth session silently read back
        as a single-booth one — the stored-state-lies bug class this
        codebase was bitten by twice (audience hydration, poll-erased
        selections). Clients derive any union/summary they need from
        `booths`.
      required:
      - source
      - booths
      properties:
        booths:
          type: array
          items:
            $ref: '#/components/schemas/BoothView'
          description: |-
            The booths the engine will actually run; empty when translation
            is off. A legacy rule-less config (translate everyone) is
            normalised to one `anyone` booth — the same reading the engine's
            `matched_targets` gives it.
        source:
          type: string
          description: '`override` | `room_tool` | `off`.'
        style:
          type:
          - string
          - 'null'
          description: '`simultaneous` | `consecutive`; `null` when off.'
    EmojiResponse:
      type: object
      required:
      - glyph
      - description
      properties:
        description:
          type: string
          description: Human-readable label (e.g. `"Dog"`).
        glyph:
          type: string
          description: Single emoji character (e.g. `🐶`).
    EnqueueItemOutcome:
      oneOf:
      - type: object
        description: Successfully queued.
        required:
        - id
        - status
        properties:
          id:
            type: string
            format: uuid
          status:
            type: string
            enum:
            - queued
      - type: object
        description: |-
          Target already has an unfinished row for this agent
          (queued or pending_approval).
        required:
        - status
        properties:
          status:
            type: string
            enum:
            - duplicate
      - type: object
        description: MXID failed shape validation.
        required:
        - reason
        - status
        properties:
          reason:
            type: string
          status:
            type: string
            enum:
            - invalid
    EnqueueRequest:
      type: object
      required:
      - mxids
      properties:
        mxids:
          type: array
          items:
            type: string
          description: |-
            Target MXIDs. Each must be a valid-looking MXID
            (`@user:server`); whitespace trimmed; case preserved.
            Duplicates inside the same batch collapse to a single
            attempted insert with the others reported as `duplicate`.
            Hard-capped at 200 items per request.
          example:
          - '@bob:agent-x.pp.ua'
          - '@carol:agent-x.pp.ua'
    EnqueueResponse:
      type: object
      required:
      - items
      - accepted
      - rejected
      properties:
        accepted:
          type: integer
          format: int32
          minimum: 0
        items:
          type: array
          items:
            $ref: '#/components/schemas/EnqueueResponseItem'
        rejected:
          type: integer
          format: int32
          minimum: 0
    EnqueueResponseItem:
      allOf:
      - $ref: '#/components/schemas/EnqueueItemOutcome'
      - type: object
        required:
        - target_mxid
        properties:
          target_mxid:
            type: string
    ExportMeResponse:
      allOf:
      - type: object
        description: |-
          The bundle proper. `serde_json::Value` because the shape is
          rendered by Postgres `row_to_json` and we don't want to define
          a typed mirror for every table — that would invert the
          schema-evolution gravity (changing a column would require an
          API-layer struct edit). The shape itself is stable per
          `TenantExportBundle` doc-comment. Documented as a free-form
          JSON object in the spec; per-section schemas land in a future
          slice if/when a mobile client needs typed bindings.
      - type: object
        required:
        - export_metadata
        properties:
          export_metadata:
            $ref: '#/components/schemas/ExportMetadata'
      description: |-
        Response body for `GET /api/v1/me/export`. Top-level shape mirrors
        the [`crate::ports::tenant_cascade_repository::TenantExportBundle`]
        JSON, plus an `export_metadata` envelope with counts so the client
        doesn't have to walk every array to size the payload.
    ExportMetadata:
      type: object
      description: |-
        Echoed counts so the client can avoid walking arrays in the
        payload to size things. Same wire shape as the audit-row
        metadata for `gdpr_tenant_export`.
      required:
      - agents_count
      - voice_sessions_count
      - voice_transcripts_count
      - voice_summaries_count
      - voice_consent_log_count
      - approvals_count
      - export_size_bytes
      properties:
        agents_count:
          type: integer
          format: int32
          minimum: 0
        approvals_count:
          type: integer
          format: int32
          minimum: 0
        export_size_bytes:
          type: integer
          format: int32
          minimum: 0
        voice_consent_log_count:
          type: integer
          format: int32
          minimum: 0
        voice_sessions_count:
          type: integer
          format: int32
          minimum: 0
        voice_summaries_count:
          type: integer
          format: int32
          minimum: 0
        voice_transcripts_count:
          type: integer
          format: int32
          minimum: 0
    FlowIdResponse:
      type: object
      description: |-
        Flattened flow id. `kind` is `in_room` or `to_device`;
        either `room_id` + `event_id` or `transaction_id` is populated.
      required:
      - kind
      properties:
        event_id:
          type:
          - string
          - 'null'
        kind:
          type: string
          description: '`in_room` (Megolm room) or `to_device` (Olm to-device).'
          example: in_room
        room_id:
          type:
          - string
          - 'null'
        transaction_id:
          type:
          - string
          - 'null'
    IgnoredUsersBody:
      type: object
      description: The caller's whole messenger ignore list (`m.ignored_user_list`).
      required:
      - user_ids
      properties:
        user_ids:
          type: array
          items:
            type: string
          description: The ignored users' MXIDs, as the account data holds them.
    InviteResponse:
      type: object
      description: The owner's personal invite link.
      required:
      - token
      - url
      - max_uses
      - used
      properties:
        expires_at:
          type:
          - string
          - 'null'
          format: date-time
        max_uses:
          type: integer
          format: int32
        token:
          type: string
          description: Opaque token; the last path segment of `url`.
        url:
          type: string
          description: '`https://<server>/join/<token>` — what the owner shares.'
        used:
          type: integer
          format: int32
          description: Seats taken (reserved + completed).
    JoinRoomRequest:
      type: object
      required:
      - room
      properties:
        room:
          type: string
          description: |-
            Either a room id (`!abc:server`) or an alias
            (`#lobby:server`). Passed straight through to Synapse.
          example: '!Abc:agent-x.pp.ua'
    JoinRoomResponse:
      type: object
      required:
      - agent_id
      - room_id
      properties:
        agent_id:
          type: string
          format: uuid
        room_id:
          type: string
    JoinedEntry:
      type: object
      description: One person who registered through the caller's link.
      required:
      - user_id
      - joined_at
      properties:
        joined_at:
          type: string
          format: date-time
        user_id:
          type: string
          description: Full MXID on this homeserver.
    JoinedResponse:
      type: object
      required:
      - joined
      properties:
        joined:
          type: array
          items:
            $ref: '#/components/schemas/JoinedEntry'
    LastSeenRequest:
      type: object
      description: Body for `PUT /api/v1/me/notifications/last-seen`.
      properties:
        last_seen_at:
          type:
          - string
          - 'null'
          format: date-time
          description: |-
            Marker position. Omit to use the server clock. Values older
            than the stored marker are ignored (monotonic — a stale
            backgrounded client can't un-see notifications).
    LastSeenResponse:
      type: object
      description: |-
        Response for `PUT /api/v1/me/notifications/last-seen` — the
        effective marker after the monotonic upsert.
      required:
      - last_seen_at
      properties:
        last_seen_at:
          type: string
          format: date-time
    LeavePolicyJson:
      type: string
      description: |-
        Wire enum for `leave_policy`. Mirrors the domain [`LeavePolicy`]
        but kept as its own type so we can default + reject unknown values
        in serde without leaking domain internals.
      enum:
      - call_end
      - stay
    LeaveRoomRequest:
      type: object
      required:
      - room
      properties:
        room:
          type: string
          description: Room id the agent should leave (`!abc:server`).
          example: '!Abc:agent-x.pp.ua'
    LeaveRoomResponse:
      type: object
      required:
      - agent_id
      - room_id
      properties:
        agent_id:
          type: string
          format: uuid
        room_id:
          type: string
    ListAgentSpacesResponse:
      type: object
      required:
      - spaces
      - provisioning_status
      properties:
        provisioning_status:
          type: string
          description: |-
            Provisioning state of the caller's personal agent — lets the Personal
            space show a "being created…" state on a fresh signup.
          example: ready
        spaces:
          type: array
          items:
            $ref: '#/components/schemas/AgentSpaceSummaryResponse'
    ListQueueResponse:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/OutreachQueueEntry'
    ListSessionsResponse:
      type: object
      description: |-
        List response with cursor pagination. `next_cursor` is `None`
        when the result set is exhausted.
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/VoiceSessionView'
        next_cursor:
          type:
          - string
          - 'null'
          description: |-
            Opaque cursor for the next page. Pass back via
            `?cursor=...` to continue. Internally encodes
            `(created_at, id)` of the last returned row.
    NeedsActionSection:
      type: object
      description: |-
        Pinned "Needs action" section — every pending item the owner can
        currently decide on, one array per family. Newest first within
        each family.
      required:
      - approvals
      - verifications
      properties:
        approvals:
          type: array
          items:
            $ref: '#/components/schemas/ApprovalResponse'
        verifications:
          type: array
          items:
            $ref: '#/components/schemas/VerificationApprovalResponse'
    NotificationsResponse:
      type: object
      description: Wire envelope for `GET /api/v1/me/notifications`.
      required:
      - needs_action
      - visitor_messages
      - activity
      - unseen_count
      properties:
        activity:
          type: array
          items:
            $ref: '#/components/schemas/AgentActivityEntry'
          description: |-
            Chronological feed of terminal agent actions (executed /
            failed / declined / cancelled / denied / ignored), newest
            first. Same entry shape as `GET /agents/{id}/activity`.
        last_seen_at:
          type:
          - string
          - 'null'
          format: date-time
          description: |-
            The owner's last-seen marker. `None` when the hub was never
            opened (treat everything as unseen).
        needs_action:
          $ref: '#/components/schemas/NeedsActionSection'
        next_activity_cursor:
          type:
          - string
          - 'null'
          description: Present iff the activity page filled exactly `limit` rows.
        unseen_count:
          type: integer
          format: int64
          description: |-
            Items in THIS response created after `last_seen_at`
            (needs-action families + visitor messages + the returned activity
            page). Drives
            the bell badge; capped by the response's own limits, which is
            fine — the badge renders "99+" well before that.
        visitor_messages:
          type: array
          items:
            $ref: '#/components/schemas/VisitorMessageResponse'
          description: |-
            Decisions 194, 196 — what the owner's assistants kept for them about
            people they do not answer (messages and missed calls), newest first,
            at most 50, each for 30 days. No push is sent for them.
    OutreachQueueEntry:
      type: object
      required:
      - id
      - target_mxid
      - status
      - approval_id
      - created_at
      - updated_at
      properties:
        approval_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        draft_body:
          type:
          - string
          - 'null'
        error_message:
          type:
          - string
          - 'null'
        id:
          type: string
          format: uuid
        status:
          type: string
          description: |-
            DB-tag status (`queued` / `pending_approval` / `sent` /
            `blocked_by_target` / `content_blocked` / `error`).
        target_mxid:
          type: string
        updated_at:
          type: string
          format: date-time
    PatchAgentSpaceRequest:
      type: object
      description: |-
        Edit a company space's profile (re-homed from `PATCH /organizations/{id}`,
        Brief 0037 S6 → 0038 S4). Behind THE ownership predicate. The Solo
        space is not editable (`409 /errors/personal-space-not-editable`).
      properties:
        branding_mxc:
          type:
          - string
          - 'null'
        description:
          type:
          - string
          - 'null'
        industry:
          type:
          - string
          - 'null'
        name:
          type:
          - string
          - 'null'
        website:
          type:
          - string
          - 'null'
    PersonaPatchBody:
      type: object
      description: |-
        Partial persona patch — the wire mirror of `AgentPersonaEdit` with
        every field optional. Present fields are validated against the exact
        published bounds (`AgentPersonaEdit`'s schemars annotations).
      properties:
        greeting:
          type:
          - string
          - 'null'
        owner_display_name:
          type:
          - string
          - 'null'
        tone:
          type:
          - string
          - 'null'
        visitor_greeting:
          type:
          - string
          - 'null'
        visitor_policy:
          type:
          - string
          - 'null'
          description: |-
            Decision 194 — what the assistant does in a one-to-one chat with
            someone who is not its owner and whom the owner has not approved:
            `ask_first` (default: it drafts, the owner decides), `reply` (it
            answers; moderation and the budget still apply), `off` (no model
            call; the person is told once that the message went to the owner,
            who finds it in `GET /me/notifications` `visitor_messages`).
            Blocked people are ignored and approved ones answered under every
            policy; group rooms are not affected.
          example: ask_first
    PhraseResetResponse:
      type: object
      description: Where the app sends the person to choose a new phrase.
      required:
      - url
      - expires_at
      properties:
        expires_at:
          type: string
          format: date-time
        url:
          type: string
          description: |-
            The identity page in ticket mode — open it in the in-app web
            session. Single use.
    ProblemDetails:
      type: object
      description: |-
        RFC 7807 Problem Details: the body of every error response, sent as
        `application/problem+json`. Branch on `type`; `detail` is the
        request-specific reason, written for people.
      required:
      - type
      - title
      - status
      - detail
      properties:
        detail:
          type: string
          description: Specific, request-scoped reason for the failure.
          example: slug must start with a letter
        existing_session_id:
          type:
          - string
          - 'null'
          format: uuid
          description: |-
            Extension member, sent with `/errors/voice-session-active` only: the
            id of the voice session already running for this agent in the
            room — join it instead of starting another.
        instance:
          type:
          - string
          - 'null'
          description: |-
            RFC 7807 `instance`: a URI for this occurrence. Optional; this
            server does not send it today.
        status:
          type: integer
          format: int32
          description: |-
            HTTP status code mirrored into the body for clients that
            parse the JSON before the headers.
          example: 400
          minimum: 0
        title:
          type: string
          description: Short, human-readable title for the error class.
          example: Validation failed
        type:
          type: string
          description: |-
            RFC 7807 `type` URI identifying the error class
            (`/errors/<kind>`).
          example: /errors/validation-failed
    ProvisioningStatus:
      type: string
      description: |-
        Minimal representation of a personal agent for the `/me/personal-
        agents` endpoint.

        Deliberately thinner than [`crate::api::routes::agents::AgentResponse`] —
        the caller is the owner, they already know the tenant/org context,
        and the persona editor (Phase 6.b) will have its own richer endpoint
        for config details. This is the "directory" shape.
        R3.3.c — coarse status enum on the `GET /me/personal-agents`
        response envelope. Lower-cased on the wire to match the
        project-wide convention for enum-like strings (mirrors
        `LifecycleState` / `Visibility`).
      enum:
      - idle
      - in_progress
      - ready
    PublicAgentSummary:
      type: object
      description: |-
        A single public agent as seen on someone else's profile page.

        Deliberately narrower than the owner-side agent card:
          * no tenant_id / organization_id — leaks backend structure.
          * no lifecycle_state — we filter on active already.
          * no owner_user_id — the caller is reading *somebody else's*
            profile and the owner is right there in the URL, no need
            to re-project.

        Phase 6 closeout (Session 40): we now project the persona
        fields (`display_name`, `tone`, `greeting`, `visitor_greeting`)
        from the agent's current `AgentConfig`. The visitor-facing UI
        wanted this so "Contact agent" could preview how the agent
        greets strangers BEFORE opening a DM. Persona fields are
        `Option<String>` so the wire stays clean for:

          * agents with behaviour != `PersonalAssistant` (technically
            allowed to be public but don't have a persona to preview);
          * older rows where the config fetch failed — UI can fall back
            to the MXID localpart.

        `visitor_greeting` IS safe to expose publicly — by construction
        (see `docs/DECISIONS.md` § Session 35) it's the text the agent
        would send a stranger anyway, there's no new info leakage.
      required:
      - id
      - matrix_user_id
      - created_at
      properties:
        avatar_mxc:
          type:
          - string
          - 'null'
          description: |-
            The agent's avatar, when it has one. `None` is common today —
            nothing sets an avatar at provisioning — and a client letter avatar
            seeded from `display_name` is the correct fallback.
        created_at:
          type: string
          format: date-time
        display_name:
          type:
          - string
          - 'null'
          description: |-
            The agent's own configured name (`agent_configs.display_name`) —
            the same string its Matrix profile carries and the agent editor
            shows. `None` only when the config could not be read. Clients must
            NOT derive a name from the MXID localpart: that renders a login as
            an identity and disagrees with every other surface.
        greeting:
          type:
          - string
          - 'null'
          description: Persona's "about you" line. Visitor preview.
        id:
          type: string
          format: uuid
        matrix_user_id:
          type: string
        tone:
          type:
          - string
          - 'null'
          description: |-
            Persona tone hint. UI can show this as a subtitle so visitors
            know what to expect ("warm, concise, professional").
        visitor_greeting:
          type:
          - string
          - 'null'
          description: |-
            First-contact greeting the agent would send a stranger. Safe
            to preview: it's exactly what the visitor gets anyway.
    PurgeCountsBody:
      type: object
      description: |-
        Wire-shape mirror of [`GdprTenantPurgeCounts`]. Kept in the API
        layer rather than re-exporting the domain struct so the JSON
        shape can evolve independently from the domain shape (e.g. add
        a `i18n_message_key` field for the mobile UI without touching
        the domain type).
      required:
      - agents
      - voice_sessions
      - voice_transcripts
      - voice_summaries
      - voice_consent_log
      - approvals
      - mas_deactivated
      - agents_deactivated
      - recordings_queued
      - login_links_deleted
      - identity_erased
      - bridge_logins_ended
      - bridges_failed
      - ai_consent_decisions
      - recording_publications
      - push_devices
      - notification_read_markers
      - organization_memberships
      - queue_jobs_erased
      - action_log_entries
      - gdpr_audit_rows
      - as_contact
      properties:
        action_log_entries:
          type: integer
          format: int32
          description: The action-log entries of the person's agents, deleted.
          minimum: 0
        agents:
          type: integer
          format: int32
          minimum: 0
        agents_deactivated:
          type: integer
          format: int32
          description: Brief 0078 — agents whose Matrix users were deactivated.
          minimum: 0
        ai_consent_decisions:
          type: integer
          format: int32
          description: Brief 0078 phase 2 — the person's AI-consent decisions, erased.
          minimum: 0
        approvals:
          type: integer
          format: int32
          minimum: 0
        as_contact:
          $ref: '#/components/schemas/ContactErasureCountsBody'
          description: |-
            Decision 13 — what other people's agents held about the person
            (and their agents) as a contact, erased.
        bridge_logins_ended:
          type: integer
          format: int32
          description: Brief 0078 — chat-bridge logins ended.
          minimum: 0
        bridges_failed:
          type: integer
          format: int32
          description: Brief 0078 — bridges that could not be asked to log out.
          minimum: 0
        gdpr_audit_rows:
          type: integer
          format: int32
          description: |-
            The person's other GDPR audit rows (exports, erases, call purges),
            deleted; the deletion's receipt is the one row left (decision 73).
          minimum: 0
        identity_erased:
          type: boolean
          description: Brief 0078 — identity-login erased the identity.
        login_links_deleted:
          type: integer
          format: int32
          description: Brief 0078 — MAS upstream links deleted.
          minimum: 0
        mas_deactivated:
          type: boolean
          description: |-
            Whether MAS deactivated and GDPR-erased the person. Always
            `true` on a 200: since Brief 0078 the purge stops (503) otherwise.
        notification_read_markers:
          type: integer
          format: int32
          description: The person's notifications-hub read marker, deleted.
          minimum: 0
        organization_memberships:
          type: integer
          format: int32
          description: The person's company-space memberships, in any space, deleted.
          minimum: 0
        push_devices:
          type: integer
          format: int32
          description: The person's registered push devices, deleted.
          minimum: 0
        queue_jobs_erased:
          type: integer
          format: int32
          description: Finished reply-queue jobs that named the person, removed.
          minimum: 0
        recording_publications:
          type: integer
          format: int32
          description: |-
            The agents' recording publications (keys, media URIs, event ids),
            deleted.
          minimum: 0
        recordings_queued:
          type: integer
          format: int32
          description: Brief 0078 — recording objects queued for deletion.
          minimum: 0
        voice_consent_log:
          type: integer
          format: int32
          minimum: 0
        voice_sessions:
          type: integer
          format: int32
          minimum: 0
        voice_summaries:
          type: integer
          format: int32
          minimum: 0
        voice_transcripts:
          type: integer
          format: int32
          minimum: 0
    PurgeResponse:
      type: object
      description: |-
        Response body for the GDPR purge variant — counts cascade
        rows the operation wiped. Empty body for the plain end
        variant (204 No Content).
      required:
      - session_id
      - transcripts_purged
      - summary_purged
      - audit_rows_purged
      - budget_rows_purged
      properties:
        audit_rows_purged:
          type: integer
          format: int32
          minimum: 0
        budget_rows_purged:
          type: integer
          format: int32
          minimum: 0
        session_id:
          type: string
          format: uuid
        summary_purged:
          type: boolean
        transcripts_purged:
          type: integer
          format: int32
          minimum: 0
    RegisterPushDeviceRequest:
      type: object
      description: Body for `POST /api/v1/me/push-devices`.
      required:
      - pushkey
      - app_id
      properties:
        app_id:
          type: string
          description: Sygnal app id (`com.veruslogistics.messenger.ios.prod|dev`).
        pushkey:
          type: string
          description: |-
            APNs device token, same encoding the client hands Synapse's
            `setPusher` (base64).
    RoomToolAgentEntry:
      type: object
      description: |-
        One agent joined to the room, with its active Tools.

        Only joined agents are listed (an agent accepts every invite at once,
        and `agent_rooms` records it on the join), so a client's "invited"
        state can never show from here (room-tools audit finding 12); a client
        that wants an invite's state reads it from the room itself.
      required:
      - agent_id
      - matrix_user_id
      - display_name
      - is_mine
      - tools
      properties:
        agent_id:
          type: string
        display_name:
          type: string
        is_mine:
          type: boolean
          description: |-
            Whether the caller owns the agent's space — their personal
            assistant, or an agent of a company space they own (whose
            `owner_user_id` is null). Such an agent's tools are listed in full,
            and the caller may arm and turn them off.
        matrix_user_id:
          type: string
        owner_user_id:
          type:
          - string
          - 'null'
        tools:
          type: array
          items:
            $ref: '#/components/schemas/RoomToolView'
    RoomToolView:
      type: object
      description: |-
        One Tool as the room-wide read surfaces it. For an agent the caller
        owns the projection is full (`params` + `trigger` + `id`); for others
        it is a safe slice — the `kind` + trigger discriminant only (the
        operator's instruction / target details are elided, and no id).
      required:
      - tool_kind
      - trigger_kind
      properties:
        id:
          type:
          - string
          - 'null'
          description: |-
            Tool id — `Some` only for the caller's own agents (needed to
            `DELETE`). `None` for others.
        params:
          type:
          - object
          - 'null'
          description: |-
            Full typed params — `Some` only for own agents (the safe slice
            elides the details that may carry private instructions). Nullable:
            emitted as JSON `null` for agents the caller doesn't own, so the
            schema MUST allow null (else clients fail to decode a room that
            contains another participant's armed tool).
        target_language:
          type:
          - string
          - 'null'
          description: |-
            The translate/live-translate target language, e.g. `English` / `uk`.
            Public for EVERY agent (own AND others), because it is already
            public in the all-participant `com.spiral.tools` state event — the
            banner shows "Translating to English" for anyone's agent. It is the
            only `params` field that is safe to surface in the safe slice; the
            private free-text instructions (`rephrase` / `custom`) stay owner-
            only via `params`. `None` for non-translate tools.
        tool_kind:
          type: string
          description: Tool kind discriminant (`translate` / `live_translate` / …).
        trigger:
          type:
          - object
          - 'null'
          description: |-
            Full typed trigger — `Some` only for own agents. Nullable for the
            same reason as `params`.
        trigger_kind:
          type: string
          description: Trigger discriminant (`on_message` / `on_voice_call`).
    RoomToolsResponse:
      type: object
      description: The room-wide tools read.
      required:
      - room_id
      - agents
      properties:
        agents:
          type: array
          items:
            $ref: '#/components/schemas/RoomToolAgentEntry'
        room_id:
          type: string
    SaveAsRoomDefaultResponse:
      type: object
      required:
      - status
      - action_log_id
      properties:
        action_log_id:
          type: string
        status:
          type: string
          description: '`promoted`.'
    SessionControlView:
      type: object
      description: One override row as the owner panel reads it.
      required:
      - control
      - state
      - params
      - revision
      - updated_by
      - updated_at
      properties:
        control:
          type: string
        params:
          type:
          - object
          - 'null'
          description: Typed `SessionControlParams` (present iff `enabled`).
        revision:
          type: integer
          format: int32
          description: CAS token for the next write.
        state:
          type: string
          description: '`inherit` | `enabled` | `disabled`.'
        updated_at:
          type: string
          format: date-time
        updated_by:
          type: string
    SessionControlsCatalogResponse:
      type: object
      required:
      - controls
      - params_schema
      - voice_translation_languages
      properties:
        controls:
          type: array
          items:
            $ref: '#/components/schemas/ControlCatalogEntry'
        params_schema:
          type: object
          description: JSON Schema of the typed `SessionControlParams` object.
        voice_translation_languages:
          type: array
          items:
            $ref: '#/components/schemas/CatalogLanguage'
          description: |-
            Voice-capable translation languages (Brief 0047 / ADR-0062
            provider allow-list — the same set the arm gate enforces).
    SessionControlsResponse:
      type: object
      required:
      - session_id
      - room_id
      - effective
      - overrides
      - call_artifacts
      - conversation
      - can_save_as_room_default
      properties:
        call_artifacts:
          $ref: '#/components/schemas/CallArtifactsView'
          description: Brief 0055 — live recording/summary flags for this session.
        can_save_as_room_default:
          type: boolean
          description: |-
            Whether this call's translation can become the room's standing rule
            (`POST …/controls/translation/save-as-room-default`): `false` in the
            owner DM and other 1:1 rooms, where live-translation Tools never
            fire. The server decides with the rule and the room classification
            the promotion itself uses; do not infer it from Matrix's direct
            flag. Says nothing about whether there is an enabled override to
            promote (that is `overrides`).
        conversation:
          $ref: '#/components/schemas/ConversationView'
          description: Brief 0080 — the Conversation / Silent switch.
        effective:
          $ref: '#/components/schemas/EffectiveControlView'
          description: |-
            Effective per-control resolution (`session override → room Tool
            → off`). Phase 1: translation only.
        overrides:
          type: array
          items:
            $ref: '#/components/schemas/SessionControlView'
          description: Raw override rows (the owner's session-scoped writes).
        room_id:
          type: string
        session_id:
          type: string
    SetControlRequest:
      type: object
      description: '`PUT /controls/{control}` body.'
      required:
      - state
      properties:
        params:
          type:
          - object
          - 'null'
          description: Typed `SessionControlParams`; required iff `state == "enabled"`.
        revision:
          type: integer
          format: int32
          description: |-
            CAS token: 0 = "no override row yet"; else the revision from the
            last read. 409 on mismatch.
        state:
          type: string
          description: '`enabled` | `disabled` | `inherit`.'
    SetControlResponse:
      type: object
      required:
      - status
      - action_log_id
      - controls
      properties:
        action_log_id:
          type: string
        controls:
          $ref: '#/components/schemas/SessionControlsResponse'
          description: Post-write override row + effective state.
        status:
          type: string
          description: '`applied` | `awaiting_consent`.'
    ToolsCatalogResponse:
      type: object
      description: |-
        The settable-tool catalog: the typed `ToolParams` + `TriggerKind` JSON
        Schemas a client renders forms from, plus the per-transport translation
        language sets a client populates its language pickers from (Brief 0047).
      required:
      - agent_id
      - room_id
      - params_schema
      - trigger_schema
      - text_translation_languages
      - voice_translation_languages
      - available_tool_kinds
      properties:
        agent_id:
          type: string
        available_tool_kinds:
          type: array
          items:
            type: string
          description: |-
            The tool kinds that can fire in THIS room for THIS agent, in catalog
            order. A client offers only these: a text tool in the owner DM, live
            call translation in a 1:1 room, or any call tool on an agent that
            does not join calls (a company agent in 1.0.1, decision 168) would be
            saved and never fire, so the arm refuses them
            (`/errors/tool-does-not-fire-here`).
        params_schema:
          type: object
          description: |-
            JSON Schema 2020-12 for the `params` field (the `ToolParams`
            `oneOf`, tagged by `kind`).
        room_id:
          type: string
        text_translation_languages:
          type: array
          items:
            $ref: '#/components/schemas/CatalogLanguage'
          description: |-
            Languages selectable for the `translate` (text) Tool — the backend's
            curated text-provider set (ADR-0062). A client renders its Translate
            language picker from this list, not from a device-local list.
        trigger_schema:
          type: object
          description: JSON Schema for the `trigger` field (the `TriggerKind` `oneOf`).
        voice_translation_languages:
          type: array
          items:
            $ref: '#/components/schemas/CatalogLanguage'
          description: |-
            Languages selectable for the `live_translate` (voice) Tool — the voice
            provider's allow-list (Gemini live translation). A client MUST render its
            LiveTranslate picker from this list; an off-list code makes the runtime
            session crash with `1007 Unsupported language code`.
    UsageCategoryShareResponse:
      type: object
      required:
      - category
      - used_percent
      properties:
        category:
          type: string
          description: |-
            One of `messages`, `room_tools`, `posts`, `calls`,
            `call_translation`, `call_summaries`, `other`. A string, not a
            closed enum: a client shows a category it does not know as other
            rather than failing the whole view.
        used_percent:
          type: number
          format: double
          description: |-
            Share of the daily limit, in percent (one decimal; any use reads at
            least 0.1, never 0).
    UsageDayResponse:
      type: object
      required:
      - date
      - used_percent
      - categories
      properties:
        categories:
          type: array
          items:
            $ref: '#/components/schemas/UsageCategoryShareResponse'
          description: Non-zero categories, largest first; empty on a day without use.
        date:
          type: string
          format: date
          description: The UTC day.
        used_percent:
          type: number
          format: double
          description: Share of the daily limit, in percent; past 100 when a call ran over.
    UsageTodayResponse:
      type: object
      required:
      - used_percent
      - limit_reached
      - resets_at
      properties:
        limit_reached:
          type: boolean
          description: 'Today''s limit is spent: the agent stays silent until `resets_at`.'
        resets_at:
          type: string
          format: date-time
          description: The next UTC midnight; show it in the person's local time.
        used_percent:
          type: number
          format: double
    UserProfileResponse:
      type: object
      required:
      - mxid
      - display_name
      - public_agents
      properties:
        display_name:
          type: string
          description: |-
            Best-effort display name. Phase 6.c derives this from the
            MXID localpart (capitalised) — matches how
            `provision_personal_agent` builds its owner name. Phase 6.d
            or later can fetch the real Matrix profile display name
            through the intent client.
        mxid:
          type: string
          description: Canonical MXID of the user the profile describes.
          example: '@alice:agent-x.pp.ua'
        public_agents:
          type: array
          items:
            $ref: '#/components/schemas/PublicAgentSummary'
          description: |-
            Publicly-contactable personal agents owned by the user.
            Empty array when the user has no agent yet (reconciliation
            pending) OR has toggled them all private.
    VerificationApprovalResponse:
      type: object
      description: |-
        Client-facing shape. Mirrors [`VerificationApproval`] but flattens
        `FlowId` into wire-friendly scalars and renders state / cancel
        code as strings (vs the domain enums). Stable on the wire — we
        version this struct if we ever need to break it.
      required:
      - id
      - agent_id
      - owner_user_id
      - requester_user_id
      - flow_id
      - state
      - created_at
      - deadline_at
      properties:
        agent_id:
          type: string
          format: uuid
        cancel_code:
          type:
          - string
          - 'null'
          description: Set when state is `cancelled`. RFC-spec cancel-code string.
        created_at:
          type: string
          format: date-time
        deadline_at:
          type: string
          format: date-time
        decided_at:
          type:
          - string
          - 'null'
          format: date-time
        decided_by:
          type:
          - string
          - 'null'
        emojis:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/EmojiResponse'
        emojis_ready_at:
          type:
          - string
          - 'null'
          format: date-time
        flow_id:
          $ref: '#/components/schemas/FlowIdResponse'
        id:
          type: string
          format: uuid
        owner_user_id:
          type: string
        requester_device_id:
          type:
          - string
          - 'null'
        requester_user_id:
          type: string
        shown_to_owner_at:
          type:
          - string
          - 'null'
          format: date-time
        state:
          type: string
          description: |-
            Domain state tag (`pending_dh_exchange` / `pending_owner` /
            `awaiting_remote_done` / `confirmed` / `cancelled`).
    VerificationListResponse:
      type: object
      description: |-
        Renamed S146 alongside `approvals::ApprovalListResponse` to
        avoid OpenAPI schema name collision (see that doc-comment).
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/VerificationApprovalResponse'
    VisitorMessageResponse:
      type: object
      description: |-
        Decisions 194, 196 — an entry a personal assistant kept for its owner
        about someone it does not answer: a message (under «Не отвечать»; no
        model read it, the person was told once that it went to the owner), or
        a missed call (under «Спрашивать меня» or «Не отвечать», from a person
        the owner has not approved).
      required:
      - id
      - kind
      - agent_id
      - visitor_mxid
      - room_id
      - body
      - created_at
      properties:
        agent_id:
          type: string
          format: uuid
          description: The assistant it was written to.
        body:
          type: string
          description: What they wrote, as written; empty for a `missed_call`.
        created_at:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
        kind:
          type: string
          description: |-
            `message` or `missed_call`. A plain string in the spec, so a client
            meeting a newer value decodes the hub and shows the entry as a generic
            one (decision 96).
          example: message
        room_id:
          type: string
          description: The one-to-one chat it was written in.
        visitor_mxid:
          type: string
          description: Who wrote it.
          example: '@bob:agent-x.pp.ua'
    VoiceSessionExportConsentEvent:
      type: object
      description: One consent-timeline event.
