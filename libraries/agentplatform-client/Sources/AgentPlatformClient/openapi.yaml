                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Unknown session / control
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: '`/errors/recording-covered` (extensions `recording_agent`, `recording_owner`): turning `recording` on while another assistant records the call — one recording per call; nothing changed. `/errors/conflict`: revision conflict (re-read and retry). No translation write conflicts on coverage (ADR-0094): the response''s `controls.effective` says what was claimed, `standby: true` when nothing was free'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '410':
          description: Session already ended
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '415':
          description: 'Request body is not `Content-Type: application/json` (`/errors/unsupported-media-type`)'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: '`/errors/translation-intent-unavailable` (extension `room_kind`): the form is not allowed in this room; `/errors/translation-paused` (extensions `reason`, `pause_until`): turning translation on while it is paused, the AI limit is reached, or `call_cap` stopped it; `/errors/validation-failed`: not exactly one of `for_language` / `pocket`, a code outside the catalog, a removed field; otherwise a gate refusal. `/errors/invalid-request-body`: the body is JSON but does not fit the schema; `detail` names the field and what was expected'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: 'Internal server error (`/errors/internal`): something the request depends on failed; the `detail` says no more'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: '`/errors/service-unavailable` with `Retry-After: 5`: an enabling translation write could not read the call''s participants; nothing was written. Never on a disabling write'
          headers:
            Retry-After:
              schema:
                type: integer
                format: int64
                minimum: 0
              description: Seconds to wait before retrying (5)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - bearer_auth: []
    delete:
      tags:
      - session-controls
      operationId: delete_session_control
      parameters:
      - name: session_id
        in: path
        description: Voice session id
        required: true
        schema:
          type: string
      - name: control
        in: path
        description: Control kind tag (translation)
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Override removed (back to inherit)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetControlResponse'
        '400':
          description: 'Request could not be read (`/errors/validation-failed`): a path parameter does not parse'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Missing or invalid bearer token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Caller does not own the session's agent
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Unknown session / control
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: '`/errors/recording-covered` (extensions `recording_agent`, `recording_owner`): clearing `recording` back to a room Tool that records while another assistant records the call; nothing changed'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '410':
          description: Session already ended
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: Rejected by the gate (a kind that cannot be cleared mid-call, or the live call refused the change)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: 'Internal server error (`/errors/internal`): something the request depends on failed; the `detail` says no more'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - bearer_auth: []
