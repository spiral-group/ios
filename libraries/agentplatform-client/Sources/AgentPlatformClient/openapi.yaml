  /api/v1/sync:
    get:
      tags:
      - sync
      summary: The app's change stream over Server-Sent Events.
      description: |-
        Events: `ready` (`SyncReady`, first), `changes` (`SyncChanges`, with
        `id:` = its position), `limited` (`SyncLimited`). Resume with
        `Last-Event-ID` or `since` (the header wins). The server ends a stream
        after 30 minutes and at shutdown: resume at once. Keepalive comments
        every 15 s. `Accept-Language` picks the translation `feed.post_published`
        announces by the rule Latest uses (`feed::reader_language`), so the two
        never disagree; without it, English.
      operationId: get_sync
      parameters:
      - name: since
        in: query
        description: |-
          A `position` this stream gave out (`ready`, `changes` or `limited`);
          absent: start fresh. `Last-Event-ID` wins over it.
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: Last-Event-ID
        in: header
        description: The last `changes` id received; wins over `since`
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: Accept-Language
        in: header
        description: 'The app''s language, as on Latest: `feed.post_published` of an official post with translations is sent for the one in it (en, uk, ru), else the English one'
        required: false
        schema:
          type:
          - string
          - 'null'
      responses:
        '200':
          description: 'A Server-Sent Events stream: `ready` (`SyncReady`), then `changes` (`SyncChanges`) and `limited` (`SyncLimited`) frames'
          content:
            text/event-stream: {}
        '400':
          description: '`since` or `Last-Event-ID` is not a position (`/errors/validation-failed`): start without one'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Missing or invalid bearer token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '429':
          description: '`/errors/too-many-requests`: five streams open for this account, or the per-IP rate limit'
          headers:
            Retry-After:
              schema:
                type: integer
                format: int64
                minimum: 0
              description: Seconds to wait
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: 'Internal server error (`/errors/internal`): something the request depends on failed; the `detail` says no more'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: '`/errors/service-unavailable`: the change log could not be read; retry shortly'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - bearer_auth: []
