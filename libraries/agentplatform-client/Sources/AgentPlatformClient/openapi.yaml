        rule:
          type: string
          description: |-
            The Terms § 6 category it rests on (the author reads its fixed
            texts).
          example: spam
        until:
          type: string
          format: date-time
          description: Until when (RFC 3339, in the future, at most 10 years ahead).
    AdminFeedSuspension:
      type: object
