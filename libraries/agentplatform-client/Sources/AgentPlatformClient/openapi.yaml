        tier:
          type: integer
          format: int32
          description: |-
            0 (new: 30 posts and 200 comments a day, likes not trusted), 1
            (trusted: 200 and 2,000), 2 (the operator and the stand-in: no
            caps).
          maximum: 2
          minimum: 0
