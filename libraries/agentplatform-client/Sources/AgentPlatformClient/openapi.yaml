          type:
          - string
          - 'null'
    CreateFeedCommentRequest:
      type: object
      description: |-
        `POST /feed/posts/{post_id}/comments`. Fields this server does not know
        are ignored (decision 96).
      required:
      - text
      - idempotency_key
      properties:
        idempotency_key:
          type: string
          format: uuid
          description: |-
            One per send: a retry with the same key and text answers the
