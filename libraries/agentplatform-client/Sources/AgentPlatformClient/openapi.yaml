      - granted
      properties:
        granted:
          type: boolean
          description: |-
            `true` agrees to the disclosure in force, `false` declines or
            withdraws.
    AiConsentResponse:
      type: object
      description: The caller's consent as the server applies it.
      required:
      - granted
      - current_version
      properties:
        current_version:
          type: string
          description: |-
            The disclosure the app must show; a grant of an older version no
            longer counts, so the app asks again.
        decided_at:
          type:
          - string
          - 'null'
          format: date-time
        decided_version:
          type:
          - string
          - 'null'
          description: The version of the caller's latest decision, if any.
        granted:
          type: boolean
          description: |-
            Whether AI may process the caller's data now: their latest decision
            is a grant of `current_version`.
    AppleLinkResponse:
      type: object
