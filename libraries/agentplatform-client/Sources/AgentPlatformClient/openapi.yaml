          type: string
        role:
          type: string
          description: '`owner` | `admin` | `member`.'
    AdminConsentResponse:
      type: object
      description: The person's latest AI-consent decision (Brief 0078).
      required:
      - state
      - current
      properties:
        current:
          type: boolean
          description: |-
            The decision is for the disclosure in force; a grant of an older one
