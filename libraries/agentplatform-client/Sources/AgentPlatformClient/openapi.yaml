              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - bearer_auth: []
  /api/v1/me/ignored-users:
    put:
      tags:
      - me
      summary: Bring the caller's agents in step with their messenger ignore list (decision 98).
      description: |-
        The body is the caller's whole `m.ignored_user_list`. Each listed person
        is blocked for every one of the caller's agents that are not archived,
        as the owner's block; a person no longer listed loses the owner's block,
        and a block an agent asked for stays. An entry that does not
        canonicalise is skipped. Idempotent: the same set writes nothing, and
        the last write wins. `no-store`.
