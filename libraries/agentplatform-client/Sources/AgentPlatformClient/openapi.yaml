  /api/v1/approvals:
    get:
      tags:
      - approvals
      summary: |-
        List the caller's approvals with optional state filter +
        cursor pagination.
      description: |-
        Returns approvals visible to the caller — i.e. tenant matches
        AND `owner_user_id` equals the bearer-token MXID. Cross-tenant
        / cross-owner rows are silently filtered out; the endpoint
        never reveals their existence.

        R3.3.d (Session 145): added `?state=` filter (all / pending /
        approved / rejected / edited / expired) and cursor pagination
        (`?limit=` + `?cursor=`). Default behaviour unchanged: empty
        query string → `state=pending` + 25 newest rows. Existing
        clients keep working.
      operationId: list_approvals
      parameters:
      - name: state
        in: query
        description: |-
          State filter. R3.3.d (Session 145) widened this from
          `pending`-only to the full set: `pending` / `approved` /
          `rejected` / `edited` / `expired` / `all`. Defaults to
          `pending` (the most common mobile UI case) so existing
          clients don't break.
        required: false
        schema:
          type: string
        example: pending
      - name: limit
        in: query
        description: |-
          Maximum rows per page. Default 25; clamped to [1, 100].
          Mobile inbox typically renders ~10-20 visible items so
          25 is a comfortable initial page.
        required: false
        schema:
          type: integer
          format: int64
        example: 25
      - name: cursor
        in: query
        description: |-
          Opaque cursor from the previous response's `next_cursor`.
          Encoded as `<rfc3339-created_at>|<uuid>`. Clients should
          treat as opaque — the format may evolve.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Approvals for the caller (newest first)
          content:
            application/json:
