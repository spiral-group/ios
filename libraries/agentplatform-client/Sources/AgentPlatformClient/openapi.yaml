            `room_blocked`, or a value this build does not know (shown as it is).
        due_at:
          type: string
          format: date-time
          description: '`received_at` + 24 h (Terms § 7).'
        handled_at:
          type:
          - string
          - 'null'
          format: date-time
        handled_by:
          type:
          - string
          - 'null'
          description: The admin who marked it; `null` for a mark made by hand in SQL.
        id:
          type: integer
          format: int64
          description: Its id in Synapse's table of that kind.
        kind:
          type: string
          description: |-
            `event` | `room` | `user`; with `id`, the report (`event 7`, as the
            alert names it).
        note:
          type:
          - string
          - 'null'
        overdue:
          type: boolean
          description: |-
            Open: it is now `due_at` or later. Handled: it was handled at
            `due_at` or later.
        reason:
          type:
          - string
          - 'null'
          description: 'Room reports only: the reporter''s reason.'
        received_at:
          type: string
          format: date-time
        room_id:
          type:
          - string
          - 'null'
          description: 'Room reports only: the room reported.'
        rule:
          type:
          - string
          - 'null'
          description: The Terms § 6 rule the decision rests on.
        state:
          type: string
          description: '`open` | `handled`.'
        user_id:
          type:
          - string
          - 'null'
          description: 'Room reports only: the reporter.'
    AdminReportsResponse:
