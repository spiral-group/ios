          - string
          - 'null'
          format: date-time
          description: The latest whole-window "reset for everyone".
        updated_at:
          type: string
          format: date-time
        usage:
          $ref: '#/components/schemas/AdminLimitUsageResponse'
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/AdminLimitWarning'
