  /api/v1/me:
    delete:
      tags:
      - me
      summary: Delete the caller's account (GDPR Article 17 — right to erasure).
      description: |-
        Cascades through every row owned by the caller's tenant
        (agents, voice sessions, transcripts, summaries, consent log,
        approvals). Brief 0078: MAS first deactivates and GDPR-erases the
        caller's MXID — when it cannot, nothing is deleted (503); then the
        tenant's agents are deactivated, recordings queued for deletion, the
        MAS upstream links, the identity-login identity and the bridge logins
        removed. A surviving row is recorded in `gdpr_audit_log` (`kind =
        gdpr_tenant_purge`).

        Authorisation: the caller's bearer-token MXID is matched
        against `tenants.owner_matrix_user_id`. Idempotent — a second
        call returns 404 because the tenant is already gone.
      operationId: delete_me
      responses:
        '200':
          description: Account purged with cascade counts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteMeResponse'
        '401':
          description: Missing or invalid bearer token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No account exists for this caller (idempotent re-call)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Purge pipeline failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: MAS could not erase the account; nothing was deleted, retry
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - bearer_auth: []
