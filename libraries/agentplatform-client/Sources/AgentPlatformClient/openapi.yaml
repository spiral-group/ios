      - id
      - actor_kind
      - actor_mxid
      - room_id
      - metadata
      - occurred_at
      properties:
        actor_kind:
          type: string
        actor_mxid:
          type: string
        id:
          type: string
          format: uuid
        metadata:
          type: object
        occurred_at:
          type: string
          format: date-time
        room_id:
          type: string
        triggering_event_id:
