  /api/v1/agents/{id}/voice-sessions:
    post:
      tags:
      - operator-voice-sessions
      summary: |-
        Start an on-demand voice session for an agent in a specific
        Matrix room (Phase 7.7).
      description: |-
        Three scenarios (A/B/C) covered by the same handler:
          * **A** — agent already in room: immediate consent + JWT mint.
          * **B** — agent not in room: AS-impersonated join, then attach.
          * **C** — call already in progress: same flow, `call_in_progress = true`.

        Owner-only: caller MXID must match the agent's `owner_user_id`,
        must be a joined room member, and the agent + room must share a
        tenant. All three predicates collapse to `403` on failure to
        avoid information disclosure. The shared `/api/v1` request limiter
        protects this endpoint from request bursts; completed attach cycles
        are not subject to a separate per-agent quota.
      operationId: attach_handler
      parameters:
      - name: id
        in: path
        description: Agent id (UUIDv7)
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachRequest'
        required: true
      responses:
        '202':
          description: Voice session started; lifecycle proceeds asynchronously
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachResponse'
        '400':
          description: Malformed room_id / leave_policy
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Missing or invalid bearer token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Owner / membership / tenant check failed
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: 'Active session already exists, or agent not voice-capable. `/errors/voice-session-active`: the agent already has an active session in the room, and the extension member `existing_session_id` names it (join it); a session the owner just removed (still `ending`) is waited for, up to 5 s (one waiting attach per caller and room), before this answer; `/errors/conflict`: the agent is not a voice agent, or the running session could not be read back (race; retry); `/errors/recording-covered` (extensions `recording_agent`, `recording_owner`): `controls.recording` is `enabled` while another assistant records the call (one recording per call), nothing attached; `/errors/agent-paused`: the owner paused the agent (decision 194) — it joins no call until resumed; nothing changed. No translation attach conflicts (ADR-0094): read `GET /voice-sessions/{session_id}/controls` after the 202 for what was claimed'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '415':
          description: 'Request body is not `Content-Type: application/json` (`/errors/unsupported-media-type`)'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: 'Distinct causes share this status; branch on the RFC 7807 `type`, never on `detail` prose. `/errors/agent-invite-required` — agent could not auto-join an invite-only room, so invite it and retry (the only case that warrants a client-side write). `/errors/translation-intent-unavailable` (extension `room_kind`) — the translation form is not allowed in this room (ADR-0094 A.2). `/errors/translation-paused` (extensions `reason`, `pause_until`) — call translation is paused by the AI limit; nothing was attached. `/errors/validation-failed` — the translation params are not exactly one of `for_language` / `pocket`, a code outside the catalog, or a removed field. `/errors/unprocessable-entity` — agent_rooms cache slow (retry shortly), or the agent cannot run live translation.. `/errors/invalid-request-body`: the body is JSON but does not fit the schema; `detail` names the field and what was expected'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: 'Internal server error (`/errors/internal`): something the request depends on failed; the `detail` says no more'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '503':
          description: '`/errors/service-unavailable`: a translating attach could not read the call''s participants (or classify the room), or another attach of this agent to this room is still running; nothing was attached. Retry the same request after `Retry-After`'
          headers:
            Retry-After:
              schema:
                type: integer
                format: int64
                minimum: 0
              description: Seconds to wait before retrying (5)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - bearer_auth: []
  /api/v1/agents/{id}/voice-sessions/join-check:
