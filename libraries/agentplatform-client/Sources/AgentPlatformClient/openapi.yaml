openapi: 3.1.0
info:
  title: Matrix AI Agent Platform — REST API
  description: |-
    Public REST surface for the Matrix AI Agent Platform.

    Every `/api/v1/*` endpoint requires `Authorization: Bearer <token>` where the token is either a MAS OIDC access token (`mat_…`) or a Matrix compatibility token (`mct_…`).

    Errors are returned as RFC 7807 Problem Details at `application/problem+json`.
  contact:
    name: Agent Platform operators
  license:
    name: AGPL-3.0-or-later
    url: https://www.gnu.org/licenses/agpl-3.0.html
  version: 1.0.0-rc17
servers:
- url: https://agent-x.pp.ua
  description: Production
- url: http://localhost:3000
  description: Local dev
paths:
  /api/v1/admin/agents:
    get:
      tags:
      - admin
      summary: Every agent on the platform.
      operationId: list_agents
      parameters:
      - name: owner
        in: query
        description: The MXID of the person whose tenants the agents are in.
        required: false
        schema:
          type: string
      - name: kind
        in: query
        description: '`personal_assistant` | `sales` | `outreach` | `support` | `llm` | `echo`.'
        required: false
        schema:
          type: string
      - name: state
        in: query
        description: '`active` | `paused` | `archived`.'
        required: false
        schema:
          type: string
      - name: mxid
        in: query
        description: |-
          Only the agents with these Matrix IDs (repeat it:
          `?mxid=@assistant-a:x&mxid=@agent-b:x`, at most 100 distinct).
        required: false
        schema:
          type: array
          items:
            type: string
          maxItems: 100
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      - name: sort
        in: query
        description: |-
          `last_active_at` (default) | `created_at` | `display_name` |
          `spend_today_usd`.
        required: false
        schema:
          type: string
      - name: order
        in: query
        description: '`asc` | `desc` (default).'
        required: false
        schema:
          type: string
      responses:
        '200':
          description: A page of agents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAgentsResponse'
        '400':
          description: An unknown filter, sort or page, or more than 100 `mxid`s
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Missing or invalid bearer token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: The token lacks `urn:mas:admin`
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: 'Internal server error (`/errors/internal`): something the request depends on failed; the `detail` says no more'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - bearer_auth: []
  /api/v1/admin/agents/{id}:
    get:
      tags:
      - admin
      summary: |-
        One agent: settings that are not content, tools, blocked people,
        approvals, spend and budget days.
      operationId: get_agent
      parameters:
      - name: id
        in: path
        description: Agent id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: The agent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAgentDetailResponse'
        '400':
          description: The id is not a UUID
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Missing or invalid bearer token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: The token lacks `urn:mas:admin`
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No such agent
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: 'Internal server error (`/errors/internal`): something the request depends on failed; the `detail` says no more'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - bearer_auth: []
  /api/v1/admin/agents/{id}/actions:
    get:
      tags:
      - admin
      summary: The agent's action log (kept 90 days).
      operationId: list_agent_actions
      parameters:
      - name: id
        in: path
        description: Agent id
        required: true
        schema:
          type: string
          format: uuid
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      - name: order
        in: query
        description: '`desc` (default, newest first) | `asc`.'
        required: false
        schema:
          type: string
      responses:
        '200':
          description: A page of the action log
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminActionsResponse'
        '400':
          description: The id is not a UUID, or an unknown order or page
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Missing or invalid bearer token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: The token lacks `urn:mas:admin`
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No such agent
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: 'Internal server error (`/errors/internal`): something the request depends on failed; the `detail` says no more'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - bearer_auth: []
  /api/v1/admin/agents/{id}/ai-limit:
    get:
      tags:
      - admin
      summary: |-
        One agent's AI limit: its window, total, each category against its cap,
        and its latest audit rows.
      operationId: get_agent_ai_limit
      parameters:
      - name: id
        in: path
        description: Agent id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Its AI limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAgentLimitResponse'
        '400':
          description: 'Request could not be read (`/errors/validation-failed`): a path parameter does not parse'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Missing or invalid bearer token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: The token lacks `urn:mas:admin`
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No such agent
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: 'Internal server error (`/errors/internal`): something the request depends on failed; the `detail` says no more'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - bearer_auth: []
    put:
      tags:
      - admin
      summary: |-
        Set one agent's overrides: its total (inherit or a value) and any
        category (inherit, a cap, or no cap). One audited write; applies at
        once.
      operationId: set_agent_ai_limit
      parameters:
      - name: id
        in: path
        description: Agent id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminSetAgentLimitRequest'
        required: true
      responses:
        '200':
          description: Its AI limit as stored, with warnings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAgentLimitResponse'
        '400':
          description: An amount out of range, an unknown state or category, a category twice, `no_cap` for the total, a reason over 200 characters
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Missing or invalid bearer token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: The token lacks `urn:mas:admin`
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No such agent
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '415':
          description: 'Request body is not `Content-Type: application/json` (`/errors/unsupported-media-type`)'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: '`/errors/invalid-request-body`: the body is JSON but does not fit the schema; `detail` names the field and what was expected'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: 'Internal server error (`/errors/internal`): something the request depends on failed; the `detail` says no more'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - bearer_auth: []
    delete:
      tags:
      - admin
      summary: |-
        Clear every override of one agent: it inherits the global total and
        caps again.
      operationId: clear_agent_ai_limit
      parameters:
      - name: id
        in: path
        description: Agent id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Its AI limit as stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAgentLimitResponse'
        '400':
          description: 'Request could not be read (`/errors/validation-failed`): a path parameter does not parse'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Missing or invalid bearer token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: The token lacks `urn:mas:admin`
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No such agent
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: 'Internal server error (`/errors/internal`): something the request depends on failed; the `detail` says no more'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - bearer_auth: []
  /api/v1/admin/agents/{id}/ai-limit/reset:
    post:
      tags:
      - admin
      summary: 'Reset one agent: its whole window (every category) or one category.'
      operationId: reset_agent_ai_limit
      parameters:
      - name: id
        in: path
        description: Agent id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminAiLimitResetRequest'
        required: true
      responses:
        '200':
          description: The reset and warnings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAiLimitResetResponse'
        '400':
          description: An unknown category, a reason over 200 characters
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Missing or invalid bearer token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: The token lacks `urn:mas:admin`
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No such agent
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '415':
          description: 'Request body is not `Content-Type: application/json` (`/errors/unsupported-media-type`)'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: '`/errors/invalid-request-body`: the body is JSON but does not fit the schema; `detail` names the field and what was expected'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: 'Internal server error (`/errors/internal`): something the request depends on failed; the `detail` says no more'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - bearer_auth: []
  /api/v1/admin/ai-limit:
    get:
      tags:
      - admin
      summary: 'The global AI limit: total, period, caps and this window''s usage.'
      operationId: get_ai_limit
      responses:
        '200':
          description: The global AI limit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAiLimitResponse'
        '401':
          description: Missing or invalid bearer token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: The token lacks `urn:mas:admin`
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: 'Internal server error (`/errors/internal`): something the request depends on failed; the `detail` says no more'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - bearer_auth: []
    put:
      tags:
      - admin
      summary: |-
        Set the global AI limit: the total, the period and category caps, for
        every agent without its own setting, at once (the window keeps its
        start; a new period moves its end). Lowering anything needs `confirm:
        "RESET"`.
      operationId: set_ai_limit
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminSetAiLimitRequest'
        required: true
      responses:
        '200':
          description: The global AI limit as stored, with warnings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAiLimitResponse'
        '400':
          description: An amount out of range, an unknown period or category, a category twice, a reason over 200 characters
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Missing or invalid bearer token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: The token lacks `urn:mas:admin`
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '415':
          description: 'Request body is not `Content-Type: application/json` (`/errors/unsupported-media-type`)'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: 'The write lowers a value for everyone without `confirm: "RESET"`. `/errors/invalid-request-body`: the body is JSON but does not fit the schema; `detail` names the field and what was expected'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: 'Internal server error (`/errors/internal`): something the request depends on failed; the `detail` says no more'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - bearer_auth: []
  /api/v1/admin/ai-limit/audit:
    get:
      tags:
      - admin
      summary: The AI limit's audit log, newest first.
      operationId: ai_limit_audit
      parameters:
      - name: scope
        in: query
        description: '`global` | `agent`.'
        required: false
        schema:
          type: string
      - name: agent_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
      - name: admin
        in: query
        description: The admin who wrote.
        required: false
        schema:
          type: string
      - name: since
        in: query
        description: Rows from then on.
        required: false
        schema:
          type: string
          format: date-time
      - name: page
        in: query
        description: One-based.
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      - name: per_page
        in: query
        description: 1 to 100; 25 by default.
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      responses:
        '200':
          description: A page of audit rows
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAiLimitAuditPageResponse'
        '400':
          description: An unknown scope or page
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Missing or invalid bearer token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: The token lacks `urn:mas:admin`
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: 'Internal server error (`/errors/internal`): something the request depends on failed; the `detail` says no more'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - bearer_auth: []
  /api/v1/admin/ai-limit/reset:
    post:
      tags:
      - admin
      summary: |-
        Reset for everyone: the whole window (every category) or one category.
        Usage rows stay; caps and overrides don't change.
      operationId: reset_ai_limit
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminAiLimitResetRequest'
        required: true
      responses:
        '200':
          description: The reset, what it touched, and warnings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminAiLimitResetResponse'
        '400':
          description: An unknown category, a reason over 200 characters
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Missing or invalid bearer token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: The token lacks `urn:mas:admin`
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '415':
          description: 'Request body is not `Content-Type: application/json` (`/errors/unsupported-media-type`)'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: 'No `confirm: "RESET"`. `/errors/invalid-request-body`: the body is JSON but does not fit the schema; `detail` names the field and what was expected'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: 'Internal server error (`/errors/internal`): something the request depends on failed; the `detail` says no more'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - bearer_auth: []
  /api/v1/admin/feed/blocked-domains:
    get:
      tags:
      - admin
      summary: |-
        Our own domain deny list (decision 254), beside the two fetched feeds:
        a link to one of these domains or their subdomains is refused.
      operationId: list_blocked_domains
      responses:
        '200':
          description: Every domain on our own list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminBlockedDomains'
        '401':
          description: Missing or invalid bearer token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: The token lacks `urn:mas:admin`
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: 'Internal server error (`/errors/internal`): something the request depends on failed; the `detail` says no more'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - bearer_auth: []
  /api/v1/admin/feed/blocked-domains/{domain}:
    put:
      tags:
      - admin
      summary: |-
        Add a domain to our own deny list. Idempotent. The entry blocks the
        domain and its subdomains, down to the registrable domain.
      operationId: add_blocked_domain
      parameters:
      - name: domain
        in: path
        description: The domain, Unicode or punycode
        required: true
        schema:
          type: string
      responses:
        '201':
          description: Added
        '204':
          description: It was on the list already
        '400':
          description: Not a domain name
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Missing or invalid bearer token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: The token lacks `urn:mas:admin`
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: '`/errors/unprocessable-entity`: a bare public suffix (`co.uk`, `blogspot.com`), which no link check would ever match'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: 'Internal server error (`/errors/internal`): something the request depends on failed; the `detail` says no more'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - bearer_auth: []
    delete:
      tags:
      - admin
      summary: Take a domain off our own deny list (the fetched feeds are not touched).
      operationId: remove_blocked_domain
      parameters:
      - name: domain
        in: path
        description: The domain, Unicode or punycode
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Removed
        '400':
          description: Not a domain name
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Missing or invalid bearer token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: The token lacks `urn:mas:admin`
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not on our own list
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: 'Internal server error (`/errors/internal`): something the request depends on failed; the `detail` says no more'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - bearer_auth: []
  /api/v1/admin/feed/comments/{comment_id}/decision:
    post:
      tags:
      - admin
      summary: Decide about a comment.
      operationId: decide_comment
      parameters:
      - name: comment_id
        in: path
        description: The comment's id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminFeedItemDecisionRequest'
        required: true
      responses:
        '200':
          description: 'Done: the modlog row, the author''s notice and the reporters'' notices written'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminFeedDecision'
        '400':
          description: An unknown decision or rule, a missing rule, or an `explanation` or `legal_ground` too long
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
