openapi: 3.1.0
info:
  title: Matrix AI Agent Platform — REST API
  description: |-
    Public REST surface for the Matrix AI Agent Platform.

    Every `/api/v1/*` endpoint requires `Authorization: Bearer <token>` where the token is either a MAS OIDC access token (`mat_…`) or a Matrix compatibility token (`mct_…`).

    Errors are returned as RFC 7807 Problem Details at `application/problem+json`.
  contact:
    name: Agent Platform operators
  license:
    name: AGPL-3.0-or-later
    url: https://www.gnu.org/licenses/agpl-3.0.html
  version: 1.0.0-rc17
servers:
- url: https://agent-x.pp.ua
  description: Production
- url: http://localhost:3000
  description: Local dev
paths:
  /api/v1/agent-spaces:
    post:
      tags:
      - agent-spaces
      operationId: create_agent_space
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAgentSpaceRequest'
        required: true
      responses:
        '201':
          description: Company space created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentSpaceSummaryResponse'
        '400':
          description: Empty name
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Missing or invalid bearer token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '415':
          description: 'Request body is not `Content-Type: application/json` (`/errors/unsupported-media-type`)'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: '`/errors/invalid-request-body`: the body is JSON but does not fit the schema; `detail` names the field and what was expected'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: 'Internal server error (`/errors/internal`): something the request depends on failed; the `detail` says no more'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - bearer_auth: []
  /api/v1/agent-spaces/{org_id}:
    get:
      tags:
      - agent-spaces
      summary: |-
        One space's header + its agents. Owner-gated: 403 (without leaking
        existence) if the org isn't under the caller's tenant.
      operationId: fetch_my_agent_space
      parameters:
      - name: org_id
        in: path
        description: Organization (space) id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Space header + its agents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentSpaceDetailResponse'
        '400':
          description: 'Request could not be read (`/errors/validation-failed`): a path parameter does not parse'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Missing or invalid bearer token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Not the caller's space
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Space not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: 'Internal server error (`/errors/internal`): something the request depends on failed; the `detail` says no more'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - bearer_auth: []
    patch:
      tags:
      - agent-spaces
      operationId: patch_agent_space
      parameters:
      - name: org_id
        in: path
        description: Organization id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchAgentSpaceRequest'
        required: true
      responses:
        '200':
          description: Space profile updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentSpaceSummaryResponse'
        '400':
          description: Empty patch
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Missing or invalid bearer token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Caller does not own this space
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Space not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: '`/errors/personal-space-not-editable`: the space is the caller''s Solo (personal) space, which comes with the account and has no editable profile — the client shows its own localised name for `kind: solo`; nothing changed, do not retry'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '415':
          description: 'Request body is not `Content-Type: application/json` (`/errors/unsupported-media-type`)'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: '`/errors/invalid-request-body`: the body is JSON but does not fit the schema; `detail` names the field and what was expected'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: 'Internal server error (`/errors/internal`): something the request depends on failed; the `detail` says no more'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - bearer_auth: []
  /api/v1/agent-spaces/{org_id}/agents:
    post:
      tags:
      - agent-spaces
      operationId: create_space_agent
      parameters:
      - name: org_id
        in: path
        description: Company organization id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSpaceAgentRequest'
        required: true
      responses:
        '201':
          description: Agent provisioned; canonical read-model
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentDetailResponse'
        '400':
          description: Not a company / bad slug / schema-bound violation
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Missing or invalid bearer token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Caller does not own this space
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Space not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '415':
          description: 'Request body is not `Content-Type: application/json` (`/errors/unsupported-media-type`)'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: '`/errors/invalid-request-body`: the body is JSON but does not fit the schema; `detail` names the field and what was expected'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: 'Internal server error (`/errors/internal`): something the request depends on failed; the `detail` says no more'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - bearer_auth: []
  /api/v1/agents/{agent_id}/verifications:
    get:
      tags:
      - verifications
      summary: |-
        List non-terminal verification approvals for an agent.
        Owner-only.
      operationId: list_for_agent
      parameters:
      - name: agent_id
        in: path
        description: Agent id (UUIDv7)
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Pending verification approvals
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationListResponse'
        '400':
          description: 'Request could not be read (`/errors/validation-failed`): a path parameter does not parse'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Missing or invalid bearer token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Caller is not the agent's org owner
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Agent not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: 'Internal server error (`/errors/internal`): something the request depends on failed; the `detail` says no more'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - bearer_auth: []
  /api/v1/agents/{id}:
    delete:
      tags:
      - agents
      summary: Archive an agent (soft delete).
      description: |-
        MAS-deactivates the agent's MXID, flips the DB lifecycle to
        `archived`, and clears room memberships. Idempotent: a second
        call on an already-archived agent still returns 204. Never the
        caller's personal assistant (decision 153): it is created with the
        account and deleted with it (`DELETE /me`), so the route answers 409
        `/errors/personal-assistant-not-deletable`.
      operationId: delete_agent
      parameters:
      - name: id
        in: path
        description: Agent id (UUIDv7)
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Agent archived (or already was)
        '400':
          description: 'Request could not be read (`/errors/validation-failed`): a path parameter does not parse'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Missing or invalid bearer token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Cross-tenant access denied
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Agent not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: '`/errors/personal-assistant-not-deletable`: the personal assistant is created with the account and deleted with it (`DELETE /me`); nothing changed'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: 'Internal server error (`/errors/internal`): something the request depends on failed; the `detail` says no more'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - bearer_auth: []
    patch:
      tags:
      - agent-spaces
      summary: |-
        Edit an agent — the ONLY config write. Partial by field-group; validates
        through the same schemable types the edit-schema publishes, then hands
        the whole edit to [`crate::domain::services::edit_agent`] (all or
        nothing); answers with the fresh canonical read-model so the client
        needs no follow-up GET.
      operationId: edit_agent
      parameters:
      - name: id
        in: path
        description: Agent id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditAgentRequest'
        required: true
      responses:
        '200':
          description: Updated, or every value already as asked (nothing written); the fresh read-model
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentDetailResponse'
        '400':
          description: Empty body, a schema-bound violation or a persona rule (empty after trimming, control characters, prompt injection, a bad timezone); nothing written
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Missing or invalid bearer token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Caller does not own this agent's space
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Agent not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Field group not applicable to this agent kind; nothing written
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '415':
          description: 'Request body is not `Content-Type: application/json` (`/errors/unsupported-media-type`)'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: '`/errors/invalid-request-body`: the body is JSON but does not fit the schema; `detail` names the field and what was expected'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: 'Internal server error (`/errors/internal`): something the request depends on failed; the `detail` says no more'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - bearer_auth: []
  /api/v1/agents/{id}/activity:
    get:
      tags:
      - agents
      summary: List the agent's action-log timeline (newest first).
      description: |-
        Owner-only: caller's MXID must equal the agent's
        `owner_user_id`. Cross-tenant agents return 403 even if the
        caller has a token. Company-role agents (no
        `owner_user_id`) are not exposed through this endpoint — they
        surface through a per-company timeline that will land in a
        future slice.

        Defaults `state=all`, `limit=25`. Cursor pagination via
        `(created_at, id)` keyset; `next_cursor` is `Some` only when
        the page filled exactly `limit` rows.
      operationId: list_agent_activity
      parameters:
      - name: id
        in: path
        description: Agent id (UUIDv7)
        required: true
        schema:
          type: string
          format: uuid
      - name: state
        in: query
        description: |-
          Outcome filter (default `all`). Accepts:
          `all` / `pending_consent` (alias `pending`) / `executed` /
          `failed` / `declined` / `cancelled` / `denied` / `ignored`.
        required: false
        schema:
          type:
          - string
          - 'null'
      - name: limit
        in: query
        description: Max rows per page. Clamped to `[1, 100]`. Default `25`.
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int64
      - name: cursor
        in: query
        description: Opaque cursor from the previous response's `next_cursor`.
        required: false
        schema:
          type:
          - string
          - 'null'
      responses:
        '200':
          description: Activity timeline page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentActivityListResponse'
        '400':
          description: Bad `state` filter or malformed cursor
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Missing or invalid bearer token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Caller is not the agent's owner
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Agent not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: 'Internal server error (`/errors/internal`): something the request depends on failed; the `detail` says no more'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - bearer_auth: []
  /api/v1/agents/{id}/blocks:
    get:
      tags:
      - agents
      summary: The people one agent blocks (decision 194, «Контроль» › «Заблокированные»).
      description: |-
        Its own blocks (the owner's approval of `messenger.block_sender`,
        decision 38): the owner's messenger block (decision 98) is the
        messenger's "Unblock user" and is not listed, as in `GET /me/blocks`.
        One entry per person, newest block first, with their display name when
        their profile could be read. The space owner's, like the agent's other
        screens. An archived agent's list is empty. Unblock with `DELETE
        /agents/{id}/blocks?contact_mxid=`. `next_cursor` pages like the
        activity timeline.
      operationId: list_agent_blocks
      parameters:
      - name: id
        in: path
        description: Agent id (UUIDv7)
        required: true
        schema:
          type: string
          format: uuid
      - name: limit
        in: query
        description: Max entries per page. Clamped to `[1, 100]`. Default `50`.
        required: false
        schema:
          type:
          - integer
          - 'null'
          format: int64
      - name: cursor
        in: query
        description: Opaque cursor from the previous response's `next_cursor`.
        required: false
        schema:
          type:
          - string
          - 'null'
      responses:
        '200':
          description: One page of the people the agent blocks (maybe none)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentBlocksResponse'
        '400':
          description: 'Request could not be read (`/errors/validation-failed`): a malformed cursor, or a path parameter does not parse'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Missing or invalid bearer token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Not the caller's space (`/errors/forbidden`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No such agent (`/errors/not-found`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: Internal server error (`/errors/internal`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - bearer_auth: []
    delete:
      tags:
      - agents
      summary: Unblock a person for one of the caller's agents (decision 87).
      description: |-
        Clears the agent's block of the person in every form it is stored in:
        trust goes back to `unknown`, so the person is a new contact again and
        the agent's next reply to them waits for a first-contact approval. The
        caller's own messenger block (decision 98) is not lifted: while it holds
        the person, they stay blocked. Nothing else changes: closed cards stay
        closed, outreach rows stay `blocked_by_target`, messages sent during the
        block stay unanswered. Audited (`contact.unblock`) when a row changed.
        Never a chat tool.

        Idempotent: unblocking a person who is not blocked returns 204. So does
        an archived agent, which `GET /me/blocks` leaves out: nothing is
        written for it.
      operationId: delete_agent_blocks
      parameters:
      - name: id
        in: path
        description: Agent id (UUIDv7)
        required: true
        schema:
          type: string
          format: uuid
      - name: contact_mxid
        in: query
        description: |-
          MXID of the person (e.g. `@bob:agent-x.pp.ua`); every case and
          spacing form of it counts.
        required: true
        schema:
          type: string
        example: '@bob:agent-x.pp.ua'
      responses:
        '204':
          description: Unblocked (or was not blocked)
        '400':
          description: 'Request could not be read (`/errors/validation-failed`): the MXID does not canonicalise, or a path parameter does not parse'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Missing or invalid bearer token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Not the caller's agent (`/errors/forbidden`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: No such agent (`/errors/not-found`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: 'Internal server error (`/errors/internal`): nothing changed'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - bearer_auth: []
  /api/v1/agents/{id}/edit-schema:
    get:
      tags:
      - agent-spaces
      summary: The editable field-group schemas for one agent. Owner-gated, kind-aware.
      operationId: fetch_agent_edit_schema
      parameters:
      - name: id
        in: path
        description: Agent id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Profile (+ persona, kind-aware) edit schemas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentEditSchemaResponse'
        '400':
          description: 'Request could not be read (`/errors/validation-failed`): a path parameter does not parse'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Missing or invalid bearer token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Not the caller's agent
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Agent not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: 'Internal server error (`/errors/internal`): something the request depends on failed; the `detail` says no more'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - bearer_auth: []
  /api/v1/agents/{id}/join-room:
    post:
      tags:
      - agents
      summary: |-
        Ask the agent to join a Matrix room (must be invited or open
        join). Records the membership in `agent_rooms` so the worker
        routes messages in this room through this agent.
      operationId: join_room_handler
      parameters:
      - name: id
        in: path
        description: Agent id (UUIDv7)
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinRoomRequest'
        required: true
      responses:
        '200':
          description: Joined
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinRoomResponse'
        '400':
          description: Empty room id / alias
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Missing or invalid bearer token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Cross-tenant access or Synapse-forbidden join
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Agent or room not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '415':
          description: 'Request body is not `Content-Type: application/json` (`/errors/unsupported-media-type`)'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: '`/errors/invalid-request-body`: the body is JSON but does not fit the schema; `detail` names the field and what was expected'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: 'Internal server error (`/errors/internal`): something the request depends on failed; the `detail` says no more'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - bearer_auth: []
  /api/v1/agents/{id}/leave-room:
    post:
      tags:
      - agent-spaces
      summary: |-
        Remove an agent from a room: its per-room tools are turned off through
        the gate (`tool.disable`, one audited action each), then the agent leaves
        from its own side. Owner-gated. Mirror of the join handler.
      operationId: agent_leave_room
      parameters:
      - name: id
        in: path
        description: Agent id
