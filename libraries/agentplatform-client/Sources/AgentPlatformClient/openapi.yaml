  /api/v1/approvals/{id}/decide:
    post:
      tags:
      - approvals
      summary: Apply an approve / reject / edit decision to a pending approval.
      description: |-
        On `approve` / `edit` the orchestrator drives the final Matrix
        send; on `reject` no message is sent. The `delivery` field on
        the response reflects the actual on-the-wire outcome (Sent /
        NotSent / SendFailed). A block request (`context_snapshot.kind =
        "block_sender"`) sends nothing: `approve` blocks the contact
        (`applied`), `edit` is refused with 400. The endpoint is idempotent
        in spirit: a second call on an already-decided approval returns 409.
      operationId: decide_handler
      parameters:
      - name: id
        in: path
        description: Approval id (UUIDv7)
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecideRequest'
        required: true
      responses:
        '200':
          description: Decision applied + delivery outcome
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecideResponse'
        '400':
          description: Malformed body (e.g. empty `new_body` on edit), or an edit of an approval with no message (a block request)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '401':
          description: Missing or invalid bearer token
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '403':
          description: Caller is not the approval owner
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: '`/errors/approval-not-found`: no approval with that id, or it no longer exists — a GDPR erase deleted it, or it was a first-contact reply whose visitor was erased while it was drafted, and the approve deleted it and sent nothing. Final, drop the card. (An unknown path is `/errors/not-found`.)'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: '`/errors/agent-paused`: an approve or edit of a card whose agent the owner paused — nothing was decided or sent, the card stays pending and can be approved after the resume (a reject still works); `/errors/conflict`: the approval is already decided; `/errors/target-blocked`: a cold-outreach card, a first-contact reply or a generic escalation card''s reply (`sender_mxid`) to someone the owner has blocked — the approve closed it (expired) and nothing was sent'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '415':
          description: 'Request body is not `Content-Type: application/json` (`/errors/unsupported-media-type`)'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '422':
          description: '`/errors/invalid-request-body`: the body is JSON but does not fit the schema; `detail` names the field and what was expected'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '500':
          description: The decision could not be saved; for a block request nothing was decided and it can be approved again
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
      security:
      - bearer_auth: []
