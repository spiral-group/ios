# AGENT-PLATFORM (Brief 0086): the App Clip for invite links. It carries the
# invitation across the App Store install and nothing else: no SDK, no
# Compound, no app module (an App Clip opened from a link stays well under
# 15 MB; the only package is SpiralTokens). Embedded in the app as its App Clip, in Staging too (operator,
# 2026-11-19): it follows SPIRAL_ASSOCIATED_DOMAIN like the app (Brief 0084).
name: SpiralClip

schemes:
  SpiralClip:
    analyze:
      config: Debug
    archive:
      config: Release
    build:
      targets:
        SpiralClip: all
        SpiralClipTests: [test]
    profile:
      config: Release
    run:
      config: Debug
      environmentVariables:
        # Xcode hands this URL to the Clip as its invocation (a campaign token).
        - variable: _XCAppClipURL
          value: https://spiral.md/join/TESTFLIGHT
          isEnabled: true
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - SpiralClipTests

targets:
  SpiralClip:
    type: application.on-demand-install-capable
    platform: iOS

    info:
      path: Info.plist
      properties:
        # App Store Connect refuses a Clip whose Info.plist has no package type (upload 2026-11-19).
        CFBundlePackageType: APPL
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Portrait on iPhone: the tour and the bottom block don't fit a phone's landscape height. iPad keeps every
        # orientation (it needs them all to share the screen).
        UISupportedInterfaceOrientations: [
          UIInterfaceOrientationPortrait
        ]
        UISupportedInterfaceOrientations~ipad: [
          UIInterfaceOrientationPortrait,
          UIInterfaceOrientationPortraitUpsideDown,
          UIInterfaceOrientationLandscapeLeft,
          UIInterfaceOrientationLandscapeRight
        ]
        # Read by ClipInviteHandOff, as in the app.
        appGroupIdentifier: $(APP_GROUP_IDENTIFIER)
        # The server the Clip talks to: spiral.md, or staging.spiral.md in Staging (ClipInviteLink.host).
        spiralServerName: $(SPIRAL_ASSOCIATED_DOMAIN)
        ITSAppUsesNonExemptEncryption: false
        NSAppClip:
          NSAppClipRequestEphemeralUserNotification: false
          NSAppClipRequestLocationConfirmation: false

    entitlements:
      path: SpiralClip.entitlements
      properties:
        # The App Clip experience of https://<host>/join/ (the AASA's `appclips`), staging's in a Staging build.
        com.apple.developer.associated-domains:
        - appclips:$(SPIRAL_ASSOCIATED_DOMAIN)
        com.apple.developer.on-demand-install-capable: true
        com.apple.developer.parent-application-identifiers:
        - $(AppIdentifierPrefix)$(BASE_BUNDLE_IDENTIFIER)
        com.apple.security.application-groups:
        - $(APP_GROUP_IDENTIFIER)

    settings:
      base:
        PRODUCT_NAME: SpiralClip
        PRODUCT_BUNDLE_IDENTIFIER: $(BASE_BUNDLE_IDENTIFIER).Clip
        MARKETING_VERSION: $(MARKETING_VERSION)
        CURRENT_PROJECT_VERSION: $(CURRENT_PROJECT_VERSION)
        DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: accent-icon
        # Archived inside the app, never as an app of its own.
        SKIP_INSTALL: YES
        SWIFT_VERSION: 6
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        # The String Catalog is written by hand; a build must not rewrite it.
        SWIFT_EMIT_LOC_STRINGS: NO

    sources:
    - path: ../Sources
    - path: ../Resources
    - path: ../SupportingFiles
      excludes:
        - target.yml
    # The contract with the app: one file, compiled into both.
    - path: ../../ElementX/Sources/Services/AgentPlatform/ClipInviteHandOff.swift
    - path: ../../ElementX/Resources/AppIcon.icon

    dependencies:
    # Spiral's generated tokens (one Swift file, no resources): the inviter's monogram takes the app's colours, so
    # they can't drift. Still no SDK and no Compound.
    - package: SpiralUI
      product: SpiralTokens

  SpiralClipTests:
    type: bundle.unit-test
    platform: iOS

    dependencies:
    - target: SpiralClip

    settings:
      base:
        PRODUCT_NAME: SpiralClipTests
        PRODUCT_BUNDLE_IDENTIFIER: $(BASE_BUNDLE_IDENTIFIER).Clip.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/SpiralClip.app/SpiralClip
        BUNDLE_LOADER: $(TEST_HOST)
        SWIFT_VERSION: 6
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor

    sources:
    - path: ../../SpiralClipTests/Sources
