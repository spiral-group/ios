name: NSE

schemes:
  NSE:
    analyze:
      config: Debug
    archive:
      config: Release
    build:
      targets:
        NSE:
        - running
        - testing
        - profiling
        - analyzing
        - archiving
    profile:
      config: Release
    run:
      askForAppToLaunch: true
      config: Debug
      debugEnabled: false
      disableMainThreadChecker: false
      launchAutomaticallySubstyle: 2
    test:
      config: Debug
      disableMainThreadChecker: false

targets:
  NSE:
    type: app-extension
    platform: iOS

    dependencies:
      - package: MatrixRustSDK
      - package: KeychainAccess
      - package: Kingfisher
      - package: Collections
      - package: Compound
      - package: BuildExtensions
        product: Macros
      - package: DeviceKit
      - package: LRUCache
      - package: Version
      - package: SwiftSoup

    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: $(PRODUCT_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        appGroupIdentifier: $(APP_GROUP_IDENTIFIER)
        baseBundleIdentifier: $(BASE_BUNDLE_IDENTIFIER)
        keychainAccessGroupIdentifier: $(KEYCHAIN_ACCESS_GROUP_IDENTIFIER)
        productionAppName: $(PRODUCTION_APP_NAME)
        isNightlyBuild: $(IS_NIGHTLY_BUILD)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationServiceExtension

    entitlements:
      path: NSE.entitlements
      properties:
        com.apple.developer.usernotifications.filtering: true
        com.apple.security.application-groups:
        - $(APP_GROUP_IDENTIFIER)
        keychain-access-groups:
        - $(KEYCHAIN_ACCESS_GROUP_IDENTIFIER)

    settings:
      base:
        PRODUCT_NAME: NSE
        PRODUCT_DISPLAY_NAME: $(APP_DISPLAY_NAME)
        PRODUCT_BUNDLE_IDENTIFIER: ${BASE_BUNDLE_IDENTIFIER}.nse
        MARKETING_VERSION: $(MARKETING_VERSION)
        CURRENT_PROJECT_VERSION: $(CURRENT_PROJECT_VERSION)
        DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
        SWIFT_OBJC_INTERFACE_HEADER_NAME: GeneratedInterface-Swift.h
        SWIFT_VERSION: 6.2
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        OTHER_SWIFT_FLAGS:
        - "-DIS_NSE"
      configs:
        # AGENT-PLATFORM: Xcode compilation caching, Debug (the test
        # configuration) only; Release/archive builds stay uncached.
        Debug:
          COMPILATION_CACHE_ENABLE_CACHING: YES

    sources:
    - path: ../Sources
    - path: ../SupportingFiles
    - path: ../../ElementX/Sources/AppHooks/AppHooks.swift
    - path: ../../ElementX/Sources/AppHooks/Hooks/TracingHook.swift
    - path: ../../ElementX/Sources/AppHooks/Hooks/ClientBuilderHook.swift
    - path: ../../ElementX/Sources/AppHooks/Hooks/RemoteSettingsHook.swift
    - path: ../../Secrets/Secrets.swift
    - path: ../../ElementX/Sources/Application/Settings
    - path: ../../ElementX/Sources/Application/TargetConfiguration.swift
    - path: ../../ElementX/Sources/Generated/Strings.swift
    # AGENT-PLATFORM: NSE needs UntranslatedL10n for the
    # notification body polish in
    # AgentPlatformNotificationDecorator (S171, I3 polish).
    - path: ../../ElementX/Sources/Generated/Strings+Untranslated.swift
    - path: ../../ElementX/Sources/Other/Avatars.swift
    - path: ../../ElementX/Sources/Other/CurrentValuePublisher.swift
    - path: ../../ElementX/Sources/Other/ExpiringTaskRunner.swift
    - path: ../../ElementX/Sources/Other/Extensions/AttributedString.swift
    - path: ../../ElementX/Sources/Other/Extensions/Bundle.swift
    - path: ../../ElementX/Sources/Other/Extensions/ClientBuilder.swift
    - path: ../../ElementX/Sources/Other/Extensions/Date.swift
    - path: ../../ElementX/Sources/Other/Extensions/Dictionary.swift
    - path: ../../ElementX/Sources/Other/Extensions/FileManager.swift
    - path: ../../ElementX/Sources/Other/Extensions/ImageCache.swift
    - path: ../../ElementX/Sources/Other/Extensions/NSRegularExpresion.swift
    - path: ../../ElementX/Sources/Other/Extensions/ProcessInfo.swift
    - path: ../../ElementX/Sources/Other/Extensions/String.swift
    - path: ../../ElementX/Sources/Other/Extensions/Task.swift
    - path: ../../ElementX/Sources/Other/Extensions/UNNotificationContent.swift
    - path: ../../ElementX/Sources/Other/Extensions/URL.swift
    - path: ../../ElementX/Sources/Other/Extensions/UTType.swift
    - path: ../../ElementX/Sources/Other/Extensions/CharacterSet.swift
    - path: ../../ElementX/Sources/Other/HTMLParsing
    # AGENT-PLATFORM (Brief 0060): `PhishingDetector` (part of
    # HTMLParsing above) recognises our own spiral.md smart links, so
    # the NSE needs the codec too.
    - path: ../../ElementX/Sources/Services/AgentPlatform/SpiralLink.swift
    # AGENT-PLATFORM (Brief 0073): `RoomMessageEventStringBuilder` previews a
    # client-rendered notice in the reader's language.
    - path: ../../ElementX/Sources/Services/AgentPlatform/SpiralNotice.swift
    # AGENT-PLATFORM (Brief 0073): `AppSettings.pendingInvite` is typed
    # with these; the extensions never use them but compile AppSettings.
    - path: ../../ElementX/Sources/Services/AgentPlatform/SpiralInviteLink.swift
    - path: ../../ElementX/Sources/Services/AgentPlatform/PendingInvite.swift
    - path: ../../ElementX/Sources/Other/InfoPlistReader.swift
    - path: ../../ElementX/Sources/Other/Logging
    - path: ../../ElementX/Sources/Other/MatrixEntityRegex.swift
    # AGENT-PLATFORM: target-portable parsers for approval-bot,
    # verification-bot AND v2 action-proposal (owner-DM consent)
    # event markers, shared between NSE (decorate path) and
    # UnitTests (parser coverage). The three parsers are
    # siblings — same shape, different marker key + version
    # gating per family.
    - path: ../../ElementX/Sources/Other/SpiralPushContentBuilder.swift
    # AGENT-PLATFORM (Brief 0078): an approval push is worded by the
    # escalation tag its payload names (`spiral.reason`).
    - path: ../../ElementX/Sources/Services/AgentPlatform/ApprovalEscalation.swift
    - path: ../../ElementX/Sources/Other/NetworkMonitor/NetworkMonitorProtocol.swift
    - path: ../../ElementX/Sources/Other/Pills/PillUtilities.swift
    - path: ../../ElementX/Sources/Other/Pills/PlainMentionBuilder.swift
    - path: ../../ElementX/Sources/Other/SDKListener.swift
    - path: ../../ElementX/Sources/Other/SwiftUI/Views/PlaceholderAvatarImage.swift
    - path: ../../ElementX/Sources/Other/TestablePreview/TestablePreview.swift
    - path: ../../ElementX/Sources/Other/UserAgentBuilder.swift
    - path: ../../ElementX/Sources/Services/AlertTones/NotificationTone.swift
    - path: ../../ElementX/Sources/Services/AlertTones/NotificationToneManager.swift
    - path: ../../ElementX/Sources/Services/AlertTones/NotificationToneManagerProtocol.swift
    - path: ../../ElementX/Sources/Services/CallKit/CallKitServiceConstants.swift
    - path: ../../ElementX/Sources/Services/Keychain/KeychainController.swift
    - path: ../../ElementX/Sources/Services/Keychain/KeychainControllerProtocol.swift
    - path: ../../ElementX/Sources/Services/Media/Provider
    - path: ../../ElementX/Sources/Services/Notification/NotificationConstants.swift
    - path: ../../ElementX/Sources/Services/Room/RoomSummary/RoomMessageEventStringBuilder.swift
    - path: ../../ElementX/Sources/Services/UserSession/RestorationToken.swift
    - path: ../../ElementX/Sources/Services/UserSession/SessionDirectories.swift
    - path: ../../ElementX/Sources/UITests/UITestsScreenIdentifier.swift
