---
name: ElementX
attributes:
  ORGANIZATIONNAME: Element
  LastUpgradeCheck: "1620"
  
fileGroups:
- project.yml
- app.yml

options:
  groupSortPosition: bottom
  createIntermediateGroups: true
  deploymentTarget:
    iOS: '18.5'
    macOS: '14.5'
  groupOrdering:
  - order:
    - ElementX
    - NSE
    - ShareExtension
    - UnitTests
    - PreviewTests
    - UITests
    - AccessibilityTests
    - IntegrationTests
    - SpiralDevE2ETests
    - SpiralClip
    - SpiralClipTests
    - Components
    - Tools
  - pattern: ElementX
    order:
    - Sources
    - Resources
    - SupportingFiles
  - pattern: Sources
    order:
    - Application
    - UserSession
    - Services
    - FlowCoordinators
    - Screens
    - Other
    - UITests
    - AccessibilityTests
  fileTypes:
    icon:
      file: true # https://github.com/yonaskolb/XcodeGen/issues/1556
  postGenCommand: cd Tools/XcodeGen && sh postGenCommand.sh

# AGENT-PLATFORM (Brief 0084): Staging is Release's optimisation pointed at
# staging.spiral.md. A scheme can pick a configuration but no build setting, so
# Product › Archive needs one. `SpiralEnvironment` is the only reader of the
# condition; docs/project/CODEBASE/07-build-and-codegen.md.
configs:
  Debug: debug
  Release: release
  Staging: release

settings:
  base:
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: true
    ENABLE_BITCODE: false
    APP_NAME: Spiral
    KEYCHAIN_ACCESS_GROUP_IDENTIFIER: "$(DEVELOPMENT_TEAM).$(BASE_BUNDLE_IDENTIFIER)"
    # AGENT-PLATFORM: Spiral marketing version (upstream calendar version was 26.10.8).
    MARKETING_VERSION: 1.0.3
    CURRENT_PROJECT_VERSION: 1
    SUPPORTS_MACCATALYST: false
    ARCHS: arm64

include:
- path: app.yml
- path: ElementX/SupportingFiles/target.yml
- path: NSE/SupportingFiles/target.yml
- path: ShareExtension/SupportingFiles/target.yml
- path: UnitTests/SupportingFiles/target.yml
- path: PreviewTests/SupportingFiles/target.yml
- path: UITests/SupportingFiles/target.yml
- path: IntegrationTests/SupportingFiles/target.yml
# AGENT-PLATFORM (decision 146): the dev-stack E2E suite; its runner is not published.
- path: SpiralDevE2ETests/SupportingFiles/target.yml
- path: AccessibilityTests/SupportingFiles/target.yml
# AGENT-PLATFORM (Brief 0086): the App Clip for invite links, and its tests.
- path: SpiralClip/SupportingFiles/target.yml
- path: Components/MapLibre/MapLibreInterface/SupportingFiles/target.yml
- path: Components/MapLibre/MapLibreShim/SupportingFiles/target.yml
- path: Components/SDKMocks/SupportingFiles/target.yml
# - path: MyAppVariant/override.yml

packages:
  # Element/Matrix dependencies
  MatrixRustSDK:
    # AGENT-PLATFORM (Brief 0063, decision 203): Spiral's components fork.
    # Its release carries the XCFramework built from Spiral's matrix-rust-sdk
    # fork; the SOURCE OF TRUTH for which SDK commit is the tag's
    # PROVENANCE.json. For cross-repo work, swap in the sibling path (a
    # locally built framework beside its Package.swift is used first).
    url: https://github.com/spiral-group/matrix-rust-components-swift
    exactVersion: 26.10.29-spiral.7
    # path: ../matrix-rust-components-swift
  Compound:
    path: compound-ios
  # AGENT-PLATFORM (Brief 0083 phase 3, decision 293): Spiral's own design-system
  # package. Its SpiralTokens target is generated from agent-brand-assets
  # (gen-spiral-ios.mjs); compound-ios depends on it as well.
  SpiralUI:
    path: SpiralUI
  # AGENT-PLATFORM (Brief 0083 phase 3, decision 293): Spiral's own shared components, built on
  # Compound and SpiralTokens. A package of its own, as compound-ios depends on SpiralUI.
  SpiralComponents:
    path: SpiralComponents
  # AGENT-PLATFORM (Brief 0067): upstream's `ElementCall` package
  # (element-call-ios, upstream's own native calls) is deliberately absent,
  # like `EmbeddedElementCall` below: calls are Spiral's native MatrixRTC
  # (ADR-0079), and it pulls element-hq's own SDK and token packages.
  # AGENT-PLATFORM: typed REST bindings against the Matrix AI
  # Agent Platform backend (`/api/v1/*`). Local-path package
  # mirroring the compound-ios shape; sources live at
  # `libraries/agentplatform-client/`. Drives the
  # `Services/AgentPlatform/` layer (M2.3+).
  AgentPlatformClient:
    path: libraries/agentplatform-client
  BuildExtensions:
    path: Components/BuildExtensions
  AnalyticsEvents:
    url: https://github.com/matrix-org/matrix-analytics-events
    exactVersion: 0.38.0
    # path: ../matrix-analytics-events
  # AGENT-PLATFORM (Brief 0067): upstream's `EmbeddedElementCall` package is
  # deliberately absent — calls are native MatrixRTC only (ADR-0079). Do not
  # restore it on an upstream sync.
  #
  # AGENT-PLATFORM (Brief 0066, ADR-0007): `SpiralAppShell` below is NOT a
  # restoration of that package and does not reopen ADR-0079. That decision
  # removed a WebView that was a second CALL stack, competing with CallKit
  # for media ownership and duplicating what native does better. This one
  # carries the trusted shell and runtime for Interactive Posts — untrusted,
  # vibe-coded React that has no native alternative (the declarative variant
  # was evaluated and rejected). It touches no call code and captures no
  # media. See ADR-0007 § "Reconciliation with ADR-0079".
  SpiralAppShell:
    url: https://github.com/spiral-group/spiral-app-shell
    exactVersion: 1.1.0
    # path: ../spiral-app-shell/ios
  # AGENT-PLATFORM (Brief 0063): native MatrixRTC media stack. Sibling fork
  # of livekit/client-sdk-swift on the exact 2.16.0 tag (the first release
  # exposing `BaseKeyProvider.setKey(keyData:)`, required to install the raw
  # binary media keys MatrixRTC distributes) plus ONE addition, branch
  # `spiral/2.16.0`: `E2EEManager.setSenderKeyIndex(_:)`. Upstream never moves
  # a local sender off key-ring index 0, so a gapless key rotation (new key
  # under a new index, old key left decryptable until the switch) had no way
  # to tell the sender which slot to tag frames with — device day run 4
  # (2026-09-12) heard the ~1 s of silence that costs. Published as
  # spiral-group/client-sdk-swift (decision 203).
  LiveKit:
    url: https://github.com/spiral-group/client-sdk-swift
    exactVersion: 2.16.0-spiral.1
    # path: ../client-sdk-swift
  Emojibase:
    url: https://github.com/matrix-org/emojibase-bindings
    revision: 60bc01f2e3b31445dc723f5af1a777b63d18e6c2 # pinned due to https://github.com/matrix-org/emojibase-bindings/issues/59
    # exactVersion: 1.5.0
    # path: ../emojibase-bindings
  SwiftOGG:
    url: https://github.com/element-hq/swift-ogg
    exactVersion: 0.0.4
    # path: ../swift-ogg
  WysiwygComposer:
    url: https://github.com/element-hq/matrix-rich-text-editor-swift
    exactVersion: 2.42.1
    # path: ../matrix-rich-text-editor/platforms/ios/lib/WysiwygComposer
  
  # External dependencies
  Algorithms:
    url: https://github.com/apple/swift-algorithms
    exactVersion: 1.2.1
  AsyncAlgorithms:
    url: https://github.com/apple/swift-async-algorithms
    exactVersion: 1.1.6
  # AGENT-PLATFORM (Brief 0067): test-only, for CallKitServiceTests (upstream dropped it with ElementCallService).
  Clocks:
    url: https://github.com/pointfreeco/swift-clocks
    exactVersion: 1.1.0 # 1.1.1 pulls swift-issue-reporting, which clashes with xctest-dynamic-overlay
  Collections:
    url: https://github.com/apple/swift-collections
    exactVersion: 1.7.1
  DeviceKit:
    url: https://github.com/devicekit/DeviceKit
    exactVersion: 5.9.0
  DSWaveformImage:
    url: https://github.com/dmrschmidt/DSWaveformImage
    exactVersion: 14.5.0
  Dynamic:
    url: https://github.com/mhdhejazi/Dynamic
    exactVersion: 1.2
  GZIP:
    url: https://github.com/nicklockwood/GZIP
    exactVersion: 1.3.2
  KeychainAccess:
    url: https://github.com/kishikawakatsumi/KeychainAccess
    exactVersion: 4.2.2
  Kingfisher:
    url: https://github.com/onevcat/Kingfisher
    exactVersion: 8.13.0
  KZFileWatchers:
    url: https://github.com/krzysztofzablocki/KZFileWatchers
    exactVersion: 1.2.0
  LoremSwiftum:
    url: https://github.com/lukaskubanek/LoremSwiftum
    exactVersion: 2.2.3
  LRUCache:
    url: https://github.com/nicklockwood/LRUCache
    exactVersion: 1.3.0
  Mantis:
    url: https://github.com/guoyingtao/Mantis
    exactVersion: 3.1.0
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    exactVersion: 6.31.0
  # AGENT-PLATFORM (Brief 0078): PostHog and Sentry removed — Spiral collects no
  # analytics or crash data (docs/project/DECISIONS.md, App Review pass).
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    exactVersion: 1.19.6
  SwiftFlow:
    url: https://github.com/tevelee/SwiftUI-Flow.git
    exactVersion: 3.5.1
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup.git
    exactVersion: 2.13.9
  SwiftState:
    url: https://github.com/ReactKit/SwiftState
    exactVersion: 6.0.1
  Version:
    url: https://github.com/mxcl/Version
    exactVersion: 2.2.1

aggregateTargets:
  Periphery:
    buildScripts:
    - name: Scan
      script: |
        export PATH="$PATH:/opt/homebrew/bin"
        periphery scan --format xcode
      basedOnDependencyAnalysis: false
